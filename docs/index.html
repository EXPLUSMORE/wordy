<!doctype html>
<html lang="de" data-design="gold" data-x="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Englisch-Vokabeltrainer für Schule und Beruf – mit Spaced Repetition, Satzbau und Arena auf Zeit.">
<meta name="theme-color" content="#0E1320">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Wordy">
<title>Wordy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Karla:wght@400;500;600;700&family=DM+Sans:wght@500;700;800&family=Nunito:wght@600;800;900&family=Fredoka:wght@500;600&display=swap">
<style>
:root{
  --paper:#EEF2F8; --card:#FFFFFF; --card-2:#F7F9FC;
  --ink:#16223A; --ink-2:#4B5B78; --ink-3:#8593AB;
  --rule:#C9D7EA; --line:#DEE6F1; --shadow:0 1px 2px rgba(22,34,58,.06),0 8px 24px rgba(22,34,58,.06);
  --accent:#1E6273; --accent-ink:#ffffff; --accent-soft:#DCEDF1;
  --good:#2C7A57; --good-soft:#DCF0E6; --bad:#B8403B; --bad-soft:#FAE3E1;
  --gold:#A9781F; --margin:#C2413A;
  --r:14px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0E131C; --card:#161D29; --card-2:#1B2431;
  --ink:#E7EDF8; --ink-2:#A7B5CC; --ink-3:#74839B;
  --rule:#27344703; --rule:#253246; --line:#222C3B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --accent:#4FA8BE; --accent-ink:#06121A; --accent-soft:#16323C;
  --good:#63C79A; --good-soft:#152F26; --bad:#E7817B; --bad-soft:#331C1B;
  --gold:#D8A445; --margin:#E07A73;
}}
:root[data-theme="dark"]{
  --paper:#0E131C; --card:#161D29; --card-2:#1B2431;
  --ink:#E7EDF8; --ink-2:#A7B5CC; --ink-3:#74839B;
  --rule:#253246; --line:#222C3B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --accent:#4FA8BE; --accent-ink:#06121A; --accent-soft:#16323C;
  --good:#63C79A; --good-soft:#152F26; --bad:#E7817B; --bad-soft:#331C1B;
  --gold:#D8A445; --margin:#E07A73;
}
/* Farbwelten (Shop): färben Akzent, Hintergrund und Linien; Hell- und Dunkelvariante.
   Stehen nach den Grundfarben und sind spezifischer, damit sie auch im Dunkelmodus greifen. */
:root[data-accent="mint"]:not([data-x]){ --paper:#E8F4EC; --card-2:#F2FAF5; --rule:#BFDCCB; --line:#D6EBDF; --accent:#2E7357; --accent-soft:#D9EEE2; }
:root[data-accent="plum"]:not([data-x]){ --paper:#F2EAF5; --card-2:#FAF4FB; --rule:#D9C6DF; --line:#E8DCEB; --accent:#6A3D70; --accent-soft:#EBDDEE; }
:root[data-accent="amber"]:not([data-x]){ --paper:#F6EEDF; --card-2:#FBF6EC; --rule:#E2CFAE; --line:#EDE1C8; --accent:#8A5A1B; --accent-soft:#F3E4CA; }
@media (prefers-color-scheme:dark){
:root[data-accent="mint"]:not([data-theme="light"]):not([data-x]){ --paper:#0C1612; --card:#13211A; --card-2:#182A21; --rule:#24392E; --line:#1E3127; --accent:#5CC59A; --accent-ink:#06140E; --accent-soft:#163025; }
:root[data-accent="plum"]:not([data-theme="light"]):not([data-x]){ --paper:#140E17; --card:#1D1522; --card-2:#241A2A; --rule:#3A2941; --line:#2E2136; --accent:#C48BD0; --accent-ink:#1A0B1E; --accent-soft:#31203A; }
:root[data-accent="amber"]:not([data-theme="light"]):not([data-x]){ --paper:#16110A; --card:#201910; --card-2:#282015; --rule:#41321B; --line:#332814; --accent:#E0A34A; --accent-ink:#1C1205; --accent-soft:#3A2B13; }
}
:root[data-theme="dark"][data-accent="mint"]:not([data-x]){ --paper:#0C1612; --card:#13211A; --card-2:#182A21; --rule:#24392E; --line:#1E3127; --accent:#5CC59A; --accent-ink:#06140E; --accent-soft:#163025; }
:root[data-theme="dark"][data-accent="plum"]:not([data-x]){ --paper:#140E17; --card:#1D1522; --card-2:#241A2A; --rule:#3A2941; --line:#2E2136; --accent:#C48BD0; --accent-ink:#1A0B1E; --accent-soft:#31203A; }
:root[data-theme="dark"][data-accent="amber"]:not([data-x]){ --paper:#16110A; --card:#201910; --card-2:#282015; --rule:#41321B; --line:#332814; --accent:#E0A34A; --accent-ink:#1C1205; --accent-soft:#3A2B13; }
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Karla,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;overflow:hidden}
h1,h2,h3{font-family:var(--font-h,Newsreader,Georgia,serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.tnum{font-variant-numeric:tabular-nums}

/* Gerüst */
#app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;position:relative}
header#top{position:relative;z-index:10;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
/* schmale Handys: Kopfzeile schrumpft statt über den Rand zu ragen (Herzen rechts) */
header#top>*{min-width:0}header#top .stat{white-space:nowrap}header#top .avatar{flex:0 0 auto}
header#top>div:nth-child(2){flex:0 1 auto;max-width:none}header#top.hc #hHearts span{display:none}header#top.hc #hHearts::before{content:"♥ " attr(data-n);color:var(--bad)}header#top .stat{flex:0 0 auto}header#top #hRank{white-space:nowrap}header#top.wr #hRank{white-space:normal;line-height:1.15}
header#top .spacer{flex:1 1 0;min-width:0}header#top .hstk{position:absolute;right:14px;bottom:-21px;z-index:5;min-width:0;overflow:visible;display:flex;align-items:center;cursor:pointer;padding:0 2px}header#top .hstk .stk+.stk{margin-left:-11px}header#top .hstk .stk{filter:drop-shadow(0 2px 2px rgba(20,33,61,.45));transition:transform .15s}header#top .hstk:active .stk{transform:scale(1.08) rotate(0)}header#top .hstk .stk{transform:rotate(calc(var(--r,0deg)*1.7))}
header#top .hstk.hs-m .stk{width:25px!important;height:25px!important}header#top .hstk.hs-m .stk+.stk{margin-left:-10px}header#top .hstk.hs-s .stk{width:20px!important;height:20px!important}header#top .hstk.hs-s .stk+.stk{margin-left:-8px}
header#top .hstk .stk::before{content:"";position:absolute;inset:-2px;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%) -140% 0/260% 100% no-repeat;animation:stkSh 4.8s ease-in-out infinite;mix-blend-mode:overlay}
header#top .hstk .stk:nth-child(2)::before{animation-delay:.5s}header#top .hstk .stk:nth-child(3)::before{animation-delay:1s}header#top .hstk .stk:nth-child(4)::before{animation-delay:1.5s}header#top .hstk .stk:nth-child(5)::before{animation-delay:2s}
@keyframes stkSh{0%,55%{background-position:-140% 0}85%,100%{background-position:240% 0}}
@media (prefers-reduced-motion:reduce){header#top .hstk .stk::before{animation:none;opacity:0}}
header#top .hstk .stk:nth-child(odd){translate:0 -2px}header#top .hstk .stk:nth-child(even){translate:0 4px}header#top .hearts{flex:0 0 auto}
@media (max-width:400px){header#top{gap:6px;padding:8px 10px}header#top .hearts{font-size:12px;letter-spacing:0}header#top .stat{font-size:12px}}
header#top.dn{gap:6px;padding:8px 10px}header#top.dn .hearts{font-size:12px;letter-spacing:0}header#top.dn .stat{font-size:12px}
@media (max-width:340px){header#top{gap:4px;padding:8px 8px}header#top .hearts{font-size:11px}header#top .avatar{width:34px;height:34px;font-size:20px}}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;-webkit-overflow-scrolling:touch}
nav#tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  border-top:1px solid var(--line);background:var(--card);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
nav#tabs button .ic{font-size:19px;line-height:1}
nav#tabs button{font-size:10.5px}
nav#tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}

/* Kopfzeile */
.wishfig{position:relative;width:48px;height:48px;display:grid;place-items:center;font-size:36px;line-height:1;flex:0 0 auto}
.wishfig>span.sil,.wishfig>span.col{grid-area:1/1;display:grid;place-items:center}
.wishfig .sil{filter:brightness(0);opacity:.2}
.wishfig .col{clip-path:inset(calc(100% - var(--p)) 0 0 0);transition:clip-path .6s ease}
.wishfig .lock{position:absolute;right:-5px;bottom:-5px;font-size:15px;line-height:1}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .wishfig .sil{filter:brightness(0) invert(1);opacity:.22} }
:root[data-theme="dark"] .wishfig .sil{filter:brightness(0) invert(1);opacity:.22}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
/* Rahmen um den Avatar (Shop) */
.avatar{position:relative}
.avatar.fr-gold{box-shadow:0 0 0 2.5px #E8B22B,0 0 10px 1px rgba(255,211,77,.7)}
.avatar.fr-rainbow{isolation:isolate}
.avatar.fr-rainbow::before{content:"";position:absolute;inset:-4px;border-radius:50%;z-index:-1;
  background:conic-gradient(#ff5d7a,#ffb84d,#ffe55c,#5dd68f,#4db8ff,#9a7bff,#ff5d7a);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.avatar.fr-fire{animation:frFire 1.1s ease-in-out infinite alternate}
@keyframes frFire{from{box-shadow:0 0 0 2px #FF8A3D,0 0 6px 1px rgba(255,120,40,.7),0 -4px 10px rgba(255,200,60,.5)}
  to{box-shadow:0 0 0 2.5px #FF5A2B,0 0 12px 3px rgba(255,90,30,.8),0 -7px 14px rgba(255,210,70,.6)}}
@media (prefers-reduced-motion:reduce){.avatar.fr-fire{animation:none;box-shadow:0 0 0 2.5px #FF7A33,0 0 8px 2px rgba(255,120,40,.6)}}
.avatar.fr-neon{animation:frNeon 1.4s ease-in-out infinite alternate}
@keyframes frNeon{from{box-shadow:0 0 0 2px #00F0FF,0 0 8px 2px rgba(0,240,255,.85),0 0 18px 4px rgba(255,61,240,.5)}to{box-shadow:0 0 0 2.5px #FF3DF0,0 0 10px 3px rgba(255,61,240,.85),0 0 20px 5px rgba(0,240,255,.55)}}
.avatar.fr-pirat{box-shadow:0 0 0 2px #5a3a1a,0 0 0 4.5px #d8a85a,0 0 0 6.5px #5a3a1a,0 0 8px 6px rgba(255,211,77,.35)}
.avatar.fr-sterne{isolation:isolate}
.avatar.fr-sterne::before{content:"";position:absolute;inset:-5px;border-radius:50%;z-index:-1;animation:frSp 4s linear infinite;
  background:conic-gradient(#b58cff,#ffe27a,#8ed0f8,#ff8fd0,#ffe27a,#b58cff);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4.5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 4.5px),#000 calc(100% - 4px))}
@keyframes frSp{to{transform:rotate(360deg)}}
.avatar.fr-kristall{box-shadow:0 0 0 2px #9fefff,0 0 0 4.5px #fff,0 0 14px 4px rgba(159,239,255,.85)}
@media (prefers-reduced-motion:reduce){.avatar.fr-neon{animation:none;box-shadow:0 0 0 2.5px #00F0FF,0 0 12px 3px rgba(255,61,240,.6)}.avatar.fr-sterne::before{animation:none}}
/* Hintergründe (Shop): liegen als feine Muster über der Papierfarbe */
html[data-bg="stars"] body{background-image:
  radial-gradient(2.4px 2.4px at 12% 18%,var(--bgdot) 50%,transparent 55%),radial-gradient(1.8px 1.8px at 78% 12%,var(--bgdot) 50%,transparent 55%),
  radial-gradient(2.6px 2.6px at 38% 62%,var(--bgdot) 50%,transparent 55%),radial-gradient(1.8px 1.8px at 88% 70%,var(--bgdot) 50%,transparent 55%),
  radial-gradient(2.2px 2.2px at 22% 90%,var(--bgdot) 50%,transparent 55%),radial-gradient(1.6px 1.6px at 60% 38%,var(--bgdot) 50%,transparent 55%);
  background-size:190px 190px;background-attachment:fixed}
html[data-bg="clouds"] body{background-image:
  radial-gradient(ellipse 80px 26px at 20% 14%,var(--bgblob),transparent 70%),radial-gradient(ellipse 100px 30px at 80% 32%,var(--bgblob),transparent 70%),
  radial-gradient(ellipse 90px 28px at 35% 70%,var(--bgblob),transparent 70%),radial-gradient(ellipse 110px 32px at 90% 88%,var(--bgblob),transparent 70%);
  background-size:380px 380px;background-attachment:fixed}
html[data-bg="space"] body{background-image:
  radial-gradient(circle at 85% 8%,rgba(255,215,120,.45) 0,transparent 100px),linear-gradient(180deg,rgba(90,70,170,.30),rgba(40,60,150,.14)),
  radial-gradient(2px 2px at 15% 25%,var(--bgstar) 50%,transparent 55%),radial-gradient(1.6px 1.6px at 70% 15%,var(--bgstar) 50%,transparent 55%),
  radial-gradient(2.4px 2.4px at 45% 55%,var(--bgstar) 50%,transparent 55%),radial-gradient(1.6px 1.6px at 90% 75%,var(--bgstar) 50%,transparent 55%),
  radial-gradient(1.8px 1.8px at 28% 85%,var(--bgstar) 50%,transparent 55%);
  background-size:auto,auto,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px;background-attachment:fixed}
html[data-bg="stars"],html[data-bg="clouds"],html[data-bg="space"]{--bgdot:color-mix(in srgb,var(--accent) 65%,transparent);--bgblob:color-mix(in srgb,var(--accent) 16%,transparent);--bgstar:rgba(255,255,255,.9)}
@media (prefers-color-scheme:light){html[data-bg="space"]{--bgstar:rgba(60,50,140,.55)}}
html[data-bg="space"][data-theme="light"]{--bgstar:rgba(60,50,140,.55)}
html[data-bg="space"][data-theme="dark"]{--bgstar:rgba(255,255,255,.9)}
/* Karten lassen das Muster leicht durchscheinen */
html[data-bg="stars"] .card,html[data-bg="clouds"] .card,html[data-bg="space"] .card{background:color-mix(in srgb,var(--card) 88%,transparent)}

/* Lektionsfinale */
.fin-in{animation:finUp .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes finUp{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.fin-top{position:relative;overflow:hidden}
.fin-hero{position:relative;width:96px;height:96px;margin:6px auto 4px;display:grid;place-items:center}
.fin-rays{position:absolute;inset:-46px;border-radius:50%;opacity:.9;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gold) 55%,transparent) 0 8deg,transparent 8deg 20deg);
  -webkit-mask:radial-gradient(circle,transparent 34%,#000 36%,transparent 70%);mask:radial-gradient(circle,transparent 34%,#000 36%,transparent 70%);
  animation:finSpin 14s linear infinite,finFade 1s ease-out both}
@keyframes finSpin{to{transform:rotate(360deg)}}
@keyframes finFade{from{opacity:0;transform:scale(.4)}to{opacity:.9}}
.fin-av{width:92px;height:92px;font-size:54px;position:relative;animation:finPop .8s cubic-bezier(.3,1.6,.4,1) both .1s}
.fin-av svg{width:60px;height:60px}
@keyframes finPop{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.fin-stars{display:flex;justify-content:center;gap:6px;margin-top:6px}
.fin-star{width:38px;height:38px;fill:var(--line);stroke:var(--rule);stroke-width:1}
.fin-star.on{fill:#FFC93C;stroke:#E0A800;filter:drop-shadow(0 0 6px rgba(255,201,60,.7));
  animation:finStar .6s cubic-bezier(.3,1.7,.4,1) both;animation-delay:calc(.9s + var(--i) * .28s)}
@keyframes finStar{0%{transform:scale(0) rotate(-120deg);opacity:0}70%{transform:scale(1.35) rotate(12deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.fin-stamp{position:absolute;right:10px;top:12px;z-index:2;padding:4px 10px;border:3px solid var(--bad);color:var(--bad);border-radius:8px;
  font-weight:800;letter-spacing:.08em;font-size:15px;transform:rotate(-9deg);animation:finStamp .5s cubic-bezier(.2,1.4,.4,1) both 1.2s}
@keyframes finStamp{0%{transform:scale(3) rotate(-25deg);opacity:0}70%{transform:scale(.94) rotate(-9deg);opacity:1}100%{transform:scale(1) rotate(-9deg);opacity:1}}
.fin-rankup{margin-top:12px;padding:12px;border-radius:12px;text-align:center;color:var(--accent-ink);background:linear-gradient(100deg,var(--accent) 30%,color-mix(in srgb,var(--gold) 60%,var(--accent)) 50%,var(--accent) 70%);
  background-size:250% 100%;display:none}
.fin-rankup span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.fin-rankup b{font-family:Newsreader,Georgia,serif;font-size:24px}
.fin-rankup.show{display:block;animation:finBanner .7s cubic-bezier(.2,1.4,.4,1) both,finShine 1.6s ease-in-out .3s 2}
@keyframes finBanner{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes finShine{from{background-position:120% 0}to{background-position:-60% 0}}
.fin-coin b{font-weight:700}
.fin-flame{font-size:34px;text-align:center;transform-origin:50% 90%}
.fin-flame.go{animation:finFlame .9s ease-in-out 3 .5s}
@keyframes finFlame{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.35) rotate(-8deg)}60%{transform:scale(1.2) rotate(7deg)}}
@media (prefers-reduced-motion:reduce){.fin-in,.fin-rays,.fin-av,.fin-star.on,.fin-stamp,.fin-rankup.show,.fin-flame.go{animation:none!important}.fin-rankup.show{display:block}}

/* Sticker */
.stk{position:relative;display:inline-block;width:var(--s,64px);height:var(--s,64px);transform:rotate(var(--r,0deg));filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));flex:0 0 auto;vertical-align:middle}
.stk-cut{position:absolute;inset:calc(var(--s) * .1);display:grid;place-items:center;font-size:calc(var(--s) * .6)}
.stk-worn .stk-cut{transform:translateY(-7%)}
.stk-cut svg{width:calc(var(--s) * .8);height:calc(var(--s) * .8);display:block}
.stk-holo{position:absolute;inset:calc(var(--s) * .1);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:100% 100%;mask-size:100% 100%;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 46%,rgba(120,255,240,.5) 50%,rgba(255,150,230,.5) 54%,transparent 64%) -150% 0/250% 100%;
  mix-blend-mode:screen;animation:stShine 3s ease-in-out infinite}
@keyframes stShine{0%{background-position:150% 0}55%,100%{background-position:-60% 0}}
.fstk{display:block;margin-top:4px;min-height:24px;font-size:12px}.stkpv{display:grid;place-items:center;height:100%}
/* EINMALEINS */
.mal-ov{position:fixed;inset:0;z-index:9000;background:var(--paper);overflow:auto}
.mal-in{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
.mal-top{display:flex;align-items:center;gap:10px;font-size:18px}.mal-top b{flex:1 1 auto}.mal-x{border:0;background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.mal-sc{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.mal-bar{height:10px;background:var(--line);border-radius:6px;margin:12px 0 4px;overflow:hidden}.mal-bar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:6px}.mal-bar.low i{background:var(--bad)}
.mal-q{font-size:clamp(44px,13vw,64px);font-weight:800;text-align:center;margin-top:auto;padding-top:18px;font-variant-numeric:tabular-nums}

.mal-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mal-pad button{height:clamp(54px,9vh,70px);font-size:26px;font-weight:700;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}.mal-pad button:active{transform:scale(.96)}.mal-pad .mal-ok{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.stat{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--ink-2)}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}

hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Start */

   linear-gradient(180deg,transparent 0 22px,var(--rule) 22px 23px,transparent 23px) 0 0/100% 23px repeat-y,var(--card)}

/* Einheiten */

@media (prefers-reduced-motion:reduce){html[data-season] .hwsp{animation:none!important}}
/* ---------- Lernpfad ---------- */

.pnode:hover::after,.pnode:focus-visible::after,.pchest:hover::after{content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);width:176px;background:#16202e;color:#fff;font-size:12px;font-weight:600;line-height:1.3;padding:6px 9px;border-radius:8px;z-index:10;pointer-events:none;text-align:center;font-family:inherit}

@keyframes ppulse{0%,100%{box-shadow:0 0 0 0 rgba(30,98,115,.45),0 4px 0 rgba(0,0,0,.2)}50%{box-shadow:0 0 0 10px rgba(30,98,115,0),0 4px 0 rgba(0,0,0,.2)}}
@keyframes pbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.chestov .cray{position:absolute;left:50%;top:38%;width:900px;height:900px;margin:-450px;border-radius:50%;background:repeating-conic-gradient(rgba(255,214,102,.22) 0 8deg,transparent 8deg 16deg);animation:cspin 14s linear infinite;opacity:0;transition:opacity .6s}
.chestov.open .cray{opacity:1}

.chestov.open .lid{transform:rotate(-58deg)}
.chestov .rwd{position:relative;z-index:2;display:flex;align-items:center;gap:12px;background:#fff;color:#16202e;border-radius:14px;padding:12px 16px;min-width:230px;font-weight:700;opacity:0;transform:translateY(14px) scale(.9);transition:all .45s cubic-bezier(.3,1.5,.5,1)}
.chestov .rwd.show{opacity:1;transform:none}
@keyframes cspin{to{transform:rotate(360deg)}}
@keyframes cshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

@media (prefers-reduced-motion:reduce){.pnode.cur,.pme,.pchest.ready,.chestov svg.chestsvg,.chestov .cray{animation:none}}
.tile.word,.slot .sw,.slot .sl,#session .tile[data-ch]{touch-action:none;-webkit-user-select:none;user-select:none}.slot .sl{cursor:grab}.slot .sl.dragging{opacity:.3}

  font-size:22px;font-weight:700;letter-spacing:.04em;padding:6px 2px}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.gapline{font-family:Newsreader,Georgia,serif;font-size:24px;line-height:1.45;text-wrap:balance}

.eis-word{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:100%}.eis-l{width:clamp(24px,8vw,34px);height:clamp(32px,10vw,42px);border-bottom:4px solid var(--ar-gold);text-align:center;font-size:clamp(20px,7vw,28px);font-weight:900;line-height:1.4}.eis-l.miss{color:var(--ar-bad)}

/* =====================================================================
   DESIGNS (Einstellungen › Aussehen): gold = Nachtgold (Standard), sun = Sonnenschein, aurora = Aurora.
   "klassisch" = das bisherige Papier-Design (kein data-design-Wert, die Farbwelten des Shops greifen dort).
   Alles läuft über Farb-Variablen, dazu ein paar Bausteine (Knöpfe, Karten, Leiste).
   ===================================================================== */
:root[data-design]{--btn-bg:var(--accent);--btn-ink:var(--accent-ink);--btn-sh:rgba(0,0,0,.25);--eyebrow:var(--ink-3);
  --cta-bg:linear-gradient(165deg,#1a2233,#10151f);--cta-bd:rgba(216,164,69,.45);--cta-ring:rgba(216,164,69,.08);--cta-glow:rgba(216,164,69,.34);--cta-ink:#F6EFE0;--cta-sub:#B9C0CE;--cta-eb:#E9BD62;
  --cta-btn:linear-gradient(#F4C45E,#D8A445);--cta-btn-ink:#2a1c00;--cta-btn-sh:#9b6f1c;--cta-box:rgba(255,255,255,.05);--cta-box-bd:rgba(216,164,69,.55);--cta-day:rgba(255,255,255,.06);--cta-day-ink:#aab3c4;--cta-day-ok:rgba(216,164,69,.15);--cta-day-ok-ink:#FFD98A;--cta-day-now:#E9BD62}
:root[data-design] h1,:root[data-design] h2,:root[data-design] h3,:root[data-design] .prompt{font-family:var(--font-h)}
:root[data-design] .eyebrow{color:var(--eyebrow)}
:root[data-design] .hero{background:var(--card)}:root[data-design] .hero:before{display:none}
:root[data-design] .btn:not(.ghost):not(.soft){background:var(--btn-bg);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh);border-radius:14px}
:root[data-design] .btn:not(.ghost):not(.soft):active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-sh)}
:root[data-design] .btn[disabled]{box-shadow:none}
:root[data-design] .btn.ghost{border-radius:14px}
:root[data-design] .bar>i{background:var(--bar,var(--accent))}
:root[data-design] .cta{background:var(--cta-bg);border-color:var(--cta-bd);box-shadow:0 0 0 4px var(--cta-ring),0 18px 34px rgba(0,0,0,.25);color:var(--cta-ink)}
:root[data-design] .cta .eyebrow{color:var(--cta-eb)}:root[data-design] .cta h2{color:var(--cta-ink)}
:root[data-design] .ctaglow{background:radial-gradient(var(--cta-glow),transparent 66%)}
:root[data-design] .ctap,:root[data-design] .ctarew small{color:var(--cta-sub)}
:root[data-design] .ctarew{background:var(--cta-box);border-color:var(--cta-box-bd)}
:root[data-design] .ctabtn{background:var(--cta-btn);color:var(--cta-btn-ink);box-shadow:0 5px 0 var(--cta-btn-sh)}
:root[data-design] .ctad{background:var(--cta-day);color:var(--cta-day-ink)}:root[data-design] .ctad.ok{background:var(--cta-day-ok);color:var(--cta-day-ok-ink)}:root[data-design] .ctad.now{outline-color:var(--cta-day-now)}
:root[data-design] .ctablitz{border-color:var(--cta-box-bd);color:var(--cta-eb)}
:root[data-design] .ctafl{background:var(--cta-day-ok);border-color:var(--cta-box-bd);color:var(--cta-day-ok-ink)}
:root[data-design] .dsh{background:var(--cta-bg);border-color:var(--cta-bd);color:var(--cta-ink)}
:root[data-design] .dsh .eyebrow{color:var(--cta-eb)}:root[data-design] .dsh h3{color:var(--cta-ink)}:root[data-design] .dsh p{color:var(--cta-sub)}
:root[data-design] .dshb{background:var(--cta-btn);color:var(--cta-btn-ink);box-shadow:0 5px 0 var(--cta-btn-sh)}
:root[data-design] .duelcard{border-color:var(--cta-bd)}
.dsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dstile{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:left}

/* Farbwelten (Shop) gelten in jedem Design: sie färben Akzent, Knöpfe und Beschriftungen; Hintergrund und Karten bleiben die des Designs. */
:root[data-design="gold"][data-accent="mint"],:root[data-design="sun"][data-accent="mint"]{--accent:#2E7357;--accent-ink:#fff;--accent-soft:#D9EEE2;--eyebrow:#2E7357;--btn-bg:#2E7357;--btn-sh:#1F5440}
:root[data-design="gold"][data-accent="plum"],:root[data-design="sun"][data-accent="plum"]{--accent:#6A3D70;--accent-ink:#fff;--accent-soft:#EBDDEE;--eyebrow:#6A3D70;--btn-bg:#6A3D70;--btn-sh:#4A2A4F}

@media (prefers-color-scheme:dark){:root[data-design="gold"][data-accent="mint"]:not([data-theme="light"]){--accent:#5CC59A;--accent-ink:#06140E;--accent-soft:#163025;--eyebrow:#5CC59A;--btn-bg:linear-gradient(#8BE0BC,#5CC59A);--btn-sh:#2E8D68}}

/* Rechtschreibung und Satzbau: die Kacheln der Startseite (.tiles/.tile weiter oben) sollen hier nicht greifen.
   Buchstaben stehen zu viert in einer Reihe, Wörter laufen in natürlicher Breite um. */
#session .tiles{display:flex;flex-wrap:wrap;gap:7px;margin-top:0}
#session .tile{display:block;width:auto;min-width:38px;text-align:center;padding:10px 11px;border-radius:9px;background:var(--card);font-weight:700;font-size:17px;font-family:Karla,sans-serif}
#session .tile.word{font-size:15px;padding:10px 13px;min-width:0;font-weight:600}
#session .tiles.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
#session .tiles.letters .tile{width:100%;min-width:0;padding:14px 0;font-size:24px;border-radius:12px;text-align:center}
#session .tile.used{opacity:.25;pointer-events:none}
/* Xing: Tastatur als Leiste unten über dem Spiel (erscheint beim Antippen eines Felds oder Hinweises) */
.kr-pad{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ar-bg);border-top:1px solid var(--ar-line);box-shadow:0 -10px 24px rgba(0,0,0,.35);animation:krUp .18s ease-out}
.kr-pad[hidden]{display:none}
.kr-pad .wg-keys,.kr-pad .wg-acts{max-width:420px}
.kr-padx{width:64px;height:22px;border-radius:11px;background:var(--ar-s);color:var(--ar-ink2);font-size:16px;line-height:1}
.kr-open .wg-body{padding-bottom:calc(var(--krpad,230px) + 14px)}
.kr-open .kc{scroll-margin-bottom:calc(var(--krpad,230px) + 18px)}
.kr-tip{color:var(--ar-ink2);text-align:center;margin:0}
@keyframes krUp{from{transform:translateY(30%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.kr-pad{animation:none}}
/* Duell-Auswahl: Einheiten wählen, dann Spiel */
.dsu{max-height:36vh;overflow:auto;text-align:left;margin:10px 0 0;padding:2px 4px;border-radius:12px;background:rgba(255,255,255,.05)}
.dsug{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin:10px 4px 4px;font-weight:800}
.dsur{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;cursor:pointer;font-size:14px}
.dsur input{width:20px;height:20px;flex:none;accent-color:#E9BD62}.dsur span{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}.dsur small{opacity:.7;flex:none}
.dshs{border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;border-radius:12px;padding:6px 14px;font-weight:700;font-family:inherit;cursor:pointer}
.dshb[disabled]{opacity:.45;box-shadow:none;cursor:default;transform:none}
.ren{display:block;font-style:normal;font-size:10px;line-height:1.1;opacity:.8;margin-top:1px;font-weight:600}.rtile .ren{color:inherit}.accin .ren{font-size:12px;color:var(--ink-2);opacity:1}
.accfig{position:relative}.accfig.lock{opacity:.7}.accfig .acl{position:absolute;right:-2px;bottom:-2px;font-size:11px;font-style:normal}.acct.try{border-style:dashed;background:var(--accent-soft)}
.ftst{position:relative;width:200px;height:272px;margin:6px auto}.ftfl{position:absolute;left:0;bottom:0;width:100%;height:100%}

.accfigs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px}.accfig{flex:0 0 auto;width:48px;height:48px;border-radius:14px;border:2px solid var(--rule);background:var(--card);padding:4px;display:grid;place-items:center;cursor:pointer}

.accpv{display:flex;gap:12px;align-items:center;margin:4px 0 8px;position:sticky;top:0;z-index:6;background:var(--card);padding:6px 4px;border-radius:0 0 16px 16px;box-shadow:0 6px 10px -8px rgba(0,0,0,.35)}.accst{flex:0 0 108px;height:144px;position:relative;border-radius:16px;background:radial-gradient(circle at 50% 30%,var(--accent-soft),transparent 70%);overflow:visible}

<script>
if ('serviceWorker' in navigator) {
  var hadController = !!navigator.serviceWorker.controller, bannerShown = false;
  function updateBanner() {
    if (bannerShown) return; bannerShown = true;
    var b = document.createElement('div');
    b.setAttribute('role', 'status');
    b.style.cssText = 'position:fixed;left:12px;right:12px;max-width:560px;margin:0 auto;bottom:78px;z-index:90;display:flex;gap:10px;align-items:center;' +
      'padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--paper);box-shadow:0 8px 24px rgba(0,0,0,.3);font:inherit';
    b.innerHTML = '<span style="flex:1">Neue Version verfügbar.</span>' +
      '<button style="font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer">Neu laden</button>' +
      '<button aria-label="Später" style="font:inherit;border:0;background:none;color:inherit;opacity:.7;cursor:pointer;padding:4px 6px">✕</button>';
    b.firstChild.nextSibling.onclick = function () { location.reload(); };
    b.lastChild.onclick = function () { b.remove(); };
    document.body.appendChild(b);
  }
  /* Eine neue Version übernimmt sofort; die offene Seite läuft aber noch mit dem alten Code. */
  /* Ist gerade nichts im Gang (keine Runde, keine Eingabe), lädt sich die App von selbst neu; sonst erscheint der Hinweis. */
  function idleNow() {
    var s = document.getElementById('session'), a = document.getElementById('arena'), f = document.activeElement;
    return (!s || s.hidden) && (!a || a.hidden) && !(f && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName));
  }
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController) return;
    if (idleNow()) { location.reload(); } else { updateBanner(); }
  });
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      var check = function () { reg.update().catch(function () {}); };
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      setInterval(check, 60 * 60 * 1000);
    }).catch(function () {});
  });
}
</script>
