    },
    odd: function (t, body, foot) {
      var w = t.w;
      var mates = S.words().filter(function (x) { return x.unit !== w.unit; });
      var otherUnit = mates[Math.floor(Math.random() * mates.length)].unit;
      var three = S.shuffle(S.words().filter(function (x) { return x.unit === otherUnit; })).slice(0, 3);
      if (three.length < 3) return RENDER.mc_en_de(t, body, foot);
      var opts = S.shuffle([{ label: w.en, ok: true, de: w.de }].concat(three.map(function (x) { return { label: x.en, ok: false, de: x.de }; })));
      t.opts = opts;
      var topic = three[0].unitTitle;
      body.innerHTML = '<div class="stack" style="padding-top:8px"><div class="eyebrow">Was passt nicht?</div>' +
        '<h2 style="font-size:20px">Drei Wörter gehören zum Thema „' + esc(topic) + '“.</h2>' +
        optionList(opts) + '</div>';
      foot.innerHTML = footCheck();
    },
    type: function (t, body, foot) {
      var w = t.w;
      body.innerHTML = '<div class="stack" style="padding-top:8px"><div class="eyebrow">Schreib das englische Wort</div>' +
        '<div class="prompt de">' + esc(w.de) + '</div>' +
        '<input id="typeIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="englisches Wort">' +
        '<p class="small muted" style="margin:0">Kleine Tippfehler zählen halb – die Schreibweise siehst du gleich.</p></div>';
      foot.innerHTML = footCheck();
      var inp = $("#typeIn"), btn = $("#mainBtn");
      inp.addEventListener("input", function () { btn.disabled = !inp.value.trim(); });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter" && inp.value.trim()) check(); });
      setTimeout(function () { inp.focus(); }, 60);
    },
    spell: function (t, body, foot) {
      var w = t.w, target = w.en.replace(/^to\s+/, "");
      t.target = target;
      var letters = S.shuffle(target.split("").map(function (ch, i) { return { ch: ch, i: i }; }));
      t.built = [];
      body.innerHTML = '<div class="stack" style="padding-top:8px"><div class="eyebrow">Rechtschreibung</div>' +
        '<div class="row" style="gap:12px">' + (audioAvailable() ? speakBtn(w.en) : "") + '<div class="prompt de">' + esc(w.de) + '</div></div>' +
        '<div class="slot" id="slot" data-len="' + target.length + '"></div>' +
        '<div class="tiles" id="tiles">' + letters.map(function (l, i) {
          return '<button class="tile" data-tile="' + i + '" data-ch="' + esc(l.ch) + '">' + (l.ch === " " ? "␣" : esc(l.ch)) + '</button>';
        }).join("") + '</div>' +
        '<button class="chip" data-act="undo" style="align-self:flex-start">← Buchstabe zurück</button></div>';
      foot.innerHTML = footCheck();
      paintSlot(t);
      if (audioAvailable()) setTimeout(function () { speak(w.en); }, 250);
    },
    build: function (t, body, foot) {
      var x = t.s, m = x.en.match(/[.?!]$/);
      t.punct = m ? m[0] : "";
      var parts = x.en.replace(/[.?!]$/, "").split(/\s+/);
      t.target = parts; t.built = []; t.usedTiles = [];
      body.innerHTML = '<div class="stack" style="padding-top:8px"><div class="eyebrow">Satzbau</div>' +
        '<h2 style="font-size:19px">Bring die Wörter in die richtige Reihenfolge.</h2>' +
        '<div class="card" style="background:var(--card-2);box-shadow:none"><div class="eyebrow">Gemeint ist</div>' +
        '<p style="margin:6px 0 0;font-family:Newsreader,serif;font-size:19px">' + esc(x.de) + '</p></div>' +
        '<div class="slot build" id="slot"></div>' +
        '<div class="tiles" id="tiles">' + S.shuffle(parts.slice()).map(function (wd, i) {
          return '<button class="tile word" data-tile="' + i + '" data-ch="' + esc(wd) + '">' + esc(wd) + '</button>';
        }).join("") + '</div>' +
        '<button class="chip" data-act="undo" style="align-self:flex-start">← Wort zurück</button></div>';
      foot.innerHTML = footCheck();
      paintSlot(t, true);
    },
    match: function (t, body, foot) {
      var w = t.w;
      var mates = S.shuffle(S.words().filter(function (x) { return x.unit === w.unit && x.id !== w.id; })).slice(0, 3);
      if (mates.length < 3) return RENDER.mc_en_de(t, body, foot);
      var set = [w].concat(mates);
      t.set = set; t.pairs = 0; t.errors = 0; t.sel = null;
      body.innerHTML = '<div class="stack" style="padding-top:8px"><div class="eyebrow">Zuordnen</div>' +
        '<h2 style="font-size:19px">Tippe erst das englische, dann das deutsche Wort.</h2>' +
        '<div class="matchgrid" id="mg">' +
        '<div style="display:grid;gap:9px">' + S.shuffle(set.slice()).map(function (x) { return '<button data-side="en" data-wid="' + esc(x.id) + '">' + esc(x.en) + '</button>'; }).join("") + '</div>' +
        '<div style="display:grid;gap:9px">' + S.shuffle(set.slice()).map(function (x) { return '<button data-side="de" data-wid="' + esc(x.id) + '">' + esc(x.de) + '</button>'; }).join("") + '</div>' +
        '</div></div>';
      foot.innerHTML = '<div class="small muted" style="text-align:center">Noch <b id="mgLeft">4</b> Paare</div>';
    }
  };

  function paintSlot(t, words) {
    var el = $("#slot"); if (!el) return;
    var rest = Math.max(0, t.target.length - t.built.length);
    if (words || t.type === "build") {
      el.innerHTML = '<span style="font-size:19px">' + esc(t.built.join(" ")) + '</span>' +
        (rest ? '<span style="color:var(--ink-3);font-size:19px;letter-spacing:.1em"> ' + Array(rest + 1).join("··· ") + '</span>' : "") +
        (t.punct ? '<span style="font-size:19px;color:var(--ink-3)">' + esc(t.punct) + '</span>' : "");
    } else {
      el.innerHTML = '<span>' + esc(t.built.join("")) + '</span>' +
        '<span style="color:var(--ink-3);letter-spacing:.18em">' + "·".repeat(rest) + '</span>';
    }
  }

  /* ---------- Antwort prüfen ---------- */
  function applyGrade(w, g, extra) {
    var before = S.levelOf(w.id), wasBox = S.inErrorBox(w.id);
    var res = S.grade(w.id, g);
    SS.items++;
    if (g > 0) {
      SS.correct++; SS.chain++; SS.maxChain = Math.max(SS.maxChain, SS.chain);
      S.addXp(g === 2 ? 10 : 6);
      if (wasBox && !S.inErrorBox(w.id)) SS.boxSolved++;
      else if (wasBox) SS.boxSolved += 0;
      if (res.after === 4 && before < 4) SS.mastered++;
    } else {
      SS.chain = 0; S.addXp(2);
      if (S.state.settings.hearts) { S.state.hearts = Math.max(0, S.state.hearts - 1); S.state.heartTs = Date.now(); }
    }
    if (before === 0) SS.newSeen++;
    S.save();
    renderHeader();
    return res;
  }
  function verdict(ok, w, res, note) {
    var foot = $("#sfoot"); if (!foot) return;
    var lvl = res ? S.levelOf(w.id) : 0;
    var comp = "";
    if (ok && res) {
      var r = S.state.w[w.id];
      comp = res.after > res.before && res.after === 4 ? "Dieses Wort sitzt jetzt langfristig. ★"
        : res.after > res.before ? "Stufe erreicht: " + S.LEVELS[res.after].n + "."
        : r.iv >= 1 ? "Kommt in " + r.iv + " " + plural(r.iv, "Tag", "Tagen") + " wieder." : "";
    } else if (!ok) comp = "Kommt gleich noch einmal – und häufiger, bis es sitzt.";
    foot.innerHTML = '<div class="verdict ' + (ok ? "ok" : "no") + ' pop">' + (ok ? "Richtig" : "Noch nicht") +
      (note ? " · " + esc(note) : "") +
      '<span class="cmp">' +
      (audioAvailable() ? '<button class="mini-speak" data-act="say" data-text="' + esc(w.en) + '" aria-label="' + esc(w.en) + ' anhören">🔊</button>' : '') +
      esc(w.en) + " – " + esc(w.de) + (comp ? " · " + comp : "") + '</span>' +
      (w.ex && audioAvailable() ? '<span class="cmp"><button class="mini-speak" data-act="say" data-text="' + esc(w.ex) + '" aria-label="Beispielsatz anhören">🔊</button>' + esc(w.ex) + '</span>' : "") +
      '</div>' +
      '<button class="btn wide lg" data-act="next" id="mainBtn">Weiter</button>';
    var b = $("#mainBtn"); if (b) b.focus();
  }
  function verdictSentence(ok, x) {
    var foot = $("#sfoot"); if (!foot) return;
    foot.innerHTML = '<div class="verdict ' + (ok ? "ok" : "no") + ' pop">' + (ok ? "Richtig gebaut" : "So heißt es richtig") +
      '<span class="cmp" style="font-family:Newsreader,Georgia,serif;font-size:16px;margin-top:6px">' + esc(x.en) + '</span>' +
      '<span class="cmp">Regel: ' + esc(x.rule) + '</span></div>' +
      (audioAvailable() ? '<button class="btn ghost wide" data-act="say" data-text="' + esc(x.en) + '" style="margin-bottom:8px">🔊 Satz anhören</button>' : "") +
      '<button class="btn wide lg" data-act="next" id="mainBtn">Weiter</button>';
    if (ok) speak(x.en, 0.9);
    var b = $("#mainBtn"); if (b) b.focus();
  }
  function check() {
    if (!SS || SS.answered) return;
    var t = SS.tasks[SS.i], w = t.w;
    if (t.type === "type") {
      var val = $("#typeIn").value, g = judgeTyped(val, w.en);
      SS.answered = true;
      var res = applyGrade(w, g);
      if (g === 0) SS.retry.push({ type: "mc_en_de", w: w });
      verdict(g > 0, w, res, g === 1 ? "fast – achte auf die Schreibweise" : null);
      var inp = $("#typeIn"); if (inp) inp.disabled = true;
      return;
    }
    if (t.type === "build") {
      SS.answered = true;
      var okB = t.built.join(" ") === t.target.join(" ");
      S.gradeSentence(t.s.id, okB ? 2 : 0);
      SS.items++;
      if (okB) { SS.correct++; SS.sentOk++; SS.chain++; SS.maxChain = Math.max(SS.maxChain, SS.chain); S.addXp(14); }
      else {
        SS.chain = 0; S.addXp(3); SS.retry.push({ type: "build", s: t.s });
        if (S.state.settings.hearts) { S.state.hearts = Math.max(0, S.state.hearts - 1); S.state.heartTs = Date.now(); }
      }
      S.save(); renderHeader();
      verdictSentence(okB, t.s);
      return;
    }
    if (t.type === "spell") {
      var built = t.built.join(""); SS.answered = true;
      var okS = built === t.target;
      var resS = applyGrade(w, okS ? 2 : 0);
      if (!okS) SS.retry.push({ type: "spell", w: w });
      verdict(okS, w, resS);
      return;
    }
    if (SS.pick == null) return;
    SS.answered = true;
    var ok = !!t.opts[SS.pick].ok;
    $$(".opt").forEach(function (b, i) {
      b.disabled = true;
      if (t.opts[i].ok) b.classList.add("right");
      else if (i === SS.pick) b.classList.add("wrong");
    });
    var res2 = applyGrade(w, ok ? 2 : 0);
    if (!ok) SS.retry.push({ type: t.type === "odd" ? "mc_en_de" : t.type, w: w });
    if (ok && (t.type === "listen" || t.type === "mc_en_de")) speak(w.en);
    verdict(ok, w, res2);
  }
  function next() {
    if (!SS) return;
    if (S.state.settings.hearts && S.state.hearts <= 0) return endSession("hearts");
    SS.i++; renderTask();
  }

  /* ---------- Ereignisse ---------- */
  sessionEl.addEventListener("click", function (e) {
    var t = SS && SS.tasks[SS.i];
    var say = e.target.closest("[data-act='say']");
    if (say) { speak(say.getAttribute("data-text")); return; }
    var opt = e.target.closest(".opt");
    if (opt && !SS.answered) {
      SS.pick = +opt.getAttribute("data-opt");
      $$(".opt").forEach(function (b) { b.setAttribute("aria-pressed", b === opt); });
      var mb = $("#mainBtn"); if (mb) mb.disabled = false;
      return;
    }
    var tile = e.target.closest(".tile");
    if (tile && t && (t.type === "spell" || t.type === "build") && !SS.answered) {
      tile.classList.add("used"); t.built.push(tile.getAttribute("data-ch"));
      t.usedTiles = (t.usedTiles || []); t.usedTiles.push(tile);
      paintSlot(t);
      $("#mainBtn").disabled = t.built.length !== t.target.length;
      return;
    }
    var mg = e.target.closest("#mg button");
    if (mg && t && t.type === "match" && !SS.answered) return matchTap(t, mg);
    var act = e.target.closest("[data-act]"); if (!act) return;
    var a = act.getAttribute("data-act");
    if (a === "check") check();
    else if (a === "next") next();
    else if (a === "quit") { if (SS && SS.items) endSession("quit"); else closeSession(); }
    else if (a === "close") closeSession();
    else if (a === "again") { closeSession(); startSession({ minutes: S.state.settings.goalMin }); }
    else if (a === "undo" && t && (t.type === "spell" || t.type === "build") && !SS.answered) {
      if (!t.built.length) return;
      t.built.pop(); var el = t.usedTiles.pop(); if (el) el.classList.remove("used");
      paintSlot(t); $("#mainBtn").disabled = true;
    }
  });
  function matchTap(t, btn) {
    var side = btn.getAttribute("data-side"), wid = btn.getAttribute("data-wid");
    if (side === "en") {
      $$("#mg button[data-side='en']").forEach(function (b) { b.classList.remove("sel"); });
      btn.classList.add("sel"); t.sel = { wid: wid, el: btn };
      if (audioAvailable()) speak(S.byId(wid).en);
      return;
    }
    if (!t.sel) return;
    var ok = t.sel.wid === wid;
    if (ok) {
      btn.classList.add("ok"); t.sel.el.classList.add("ok"); t.sel.el.classList.remove("sel");
      t.pairs++; t.sel = null;
      var left = 4 - t.pairs; var lEl = $("#mgLeft"); if (lEl) lEl.textContent = left;
      if (t.pairs === 4) {
        SS.answered = true;
        var g = t.errors === 0 ? 2 : 1;
        t.set.forEach(function (x) { if (x.id !== t.w.id) S.grade(x.id, g); });
        var res = applyGrade(t.w, g);
        verdict(true, t.w, res, t.errors ? t.errors + " Fehlversuch" + (t.errors > 1 ? "e" : "") : null);
      }
    } else {
      t.errors++; btn.classList.add("no");
      setTimeout(function () { btn.classList.remove("no"); }, 500);
    }
  }
  document.addEventListener("keydown", function (e) {
    if (sessionEl.hidden || !SS) return;
    var t = SS.tasks[SS.i];
    if (e.key === "Enter") { var b = $("#mainBtn"); if (b && !b.disabled) { e.preventDefault(); b.click(); } return; }
    if (!SS.answered && t && t.opts && /^[1-4]$/.test(e.key)) {
      var o = $$(".opt")[+e.key - 1]; if (o) o.click();
    }
  });

  view.addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]"); if (!act) return;
    var a = act.getAttribute("data-act"), st = S.state;
    if (a === "say") { if (!speak(act.getAttribute("data-text"))) toast("Dieses Gerät hat keine Sprachausgabe bereit."); return; }
    if (a === "install") {
      if (!installPrompt) return toast("Dein Browser bietet die Installation gerade nicht an.");
      installPrompt.prompt();
      installPrompt.userChoice.then(function (r) {
        installPrompt = null;
        if (r && r.outcome !== "accepted") toast("Abgebrochen – du kannst es jederzeit nachholen.");
        render();
      });
      return;
    }
    if (a === "voicetest") {
      if (!st.settings.audio) return toast("Erst „Aussprache vorlesen“ einschalten.");
      var okV = speak("This is the English voice of your device.", 0.9);
      toast(okV ? (voice ? "Stimme: " + voice.name + " (" + voice.lang + ")" : "Standardstimme des Browsers wird genutzt.") : "Der Browser bietet hier keine Sprachausgabe an.");
      return;
    }
    if (a === "arena") { if (global.ARENA) global.ARENA.start(act.getAttribute("data-id")); return; }
    if (a === "start") {
      startSession({ minutes: +(act.getAttribute("data-min") || st.settings.goalMin), mode: act.getAttribute("data-mode") || "mix", unit: act.getAttribute("data-unit") || null });
    } else if (a === "track") {
      var nt = act.getAttribute("data-t");
      if (nt !== st.settings.track) { S.setTrack(nt); toast(nt === "business" ? "Business English aktiv." : "Schule aktiv."); render(); view.scrollTop = 0; }
    } else if (a === "klasse") {
      var raw = act.getAttribute("data-k"), k = /^\d+$/.test(raw) ? +raw : raw;
      var arr = st.settings.track === "business" ? st.settings.bizGroups : st.settings.klassen;
      var i = arr.indexOf(k);
      if (i >= 0) { if (arr.length > 1) arr.splice(i, 1); }
      else arr.push(k);
      st.settings.units = []; S.save(true); render();
    } else if (a === "unit") { detailUnit = act.getAttribute("data-id"); render(); }
    else if (a === "back") { detailUnit = null; render(); }
    else if (a === "readall") {
      var u = S.units().filter(function (x) { return x.id === act.getAttribute("data-id"); })[0];
      if (u) speak(u.words.map(function (w) { return w[0]; }).join(", "), 0.85);
    }
    else if (a === "buy") { var r = S.buy(act.getAttribute("data-id")); toast(r.error || ("Gekauft: " + r.item.label)); renderHeader(); render(); }
    else if (a === "equip") {
      var it = S.SHOP.filter(function (x) { return x.id === act.getAttribute("data-id"); })[0];
      if (it) { if (it.kind === "avatar") st.profile.avatar = it.val; else st.profile.theme = it.val; S.save(true); renderHeader(); render(); }
    }
    else if (a === "csvimport") {
      var res = S.parseCsv($("#csvText").value, $("#csvTitle").value.trim() || "Eigene Liste");
      if (res.error) return toast(res.error);
      toast(res.count + " Wörter übernommen" + (res.skipped ? " (" + res.skipped + " Zeilen übersprungen)" : ""));
      render();
    }
    else if (a === "delcustom") { S.removeCustom(act.getAttribute("data-id")); toast("Liste entfernt."); render(); }
    else if (a === "exp") {
      var box = $("#expBox"); box.hidden = false;
      box.value = act.getAttribute("data-kind") === "csv" ? S.exportCsv() : S.exportProgress();
      box.select();
      try {
        navigator.clipboard.writeText(box.value).then(function () { toast("In die Zwischenablage kopiert."); },
          function () { toast("Markiert – jetzt kopieren."); });
      } catch (err) { toast("Markiert – jetzt kopieren."); }
    }
    else if (a === "impopen") { $("#impWrap").hidden = false; $("#impBox").focus(); }
    else if (a === "impdo") {
      var ri = S.importProgress($("#impBox").value);
      if (ri.error) return toast(ri.error);
      toast("Lernstand eingespielt."); renderHeader(); render();
    }
    else if (a === "reset") {
      if (confirm("Wirklich den gesamten Fortschritt löschen? Eigene Wortlisten bleiben erhalten.")) {
        S.resetProgress(); toast("Fortschritt zurückgesetzt."); renderHeader(); render();
      }
    }
  });

  tabs.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]"); if (!b) return;
    tab = b.getAttribute("data-tab"); detailUnit = null; render(); view.scrollTop = 0;
  });

  function render() {
    S.rollDay();
    $$("#tabs button").forEach(function (b) { b.setAttribute("aria-current", b.getAttribute("data-tab") === tab); });
    renderHeader();
    if (tab === "home") viewHome();
    else if (tab === "arena") viewArena();
    else if (tab === "units") viewUnits();
    else if (tab === "stats") viewStats();
    else viewParent();
  }

  global.VTUI = {
    toast: toast,
    refreshHeader: renderHeader,
    afterArena: function () { render(); }
  };

  S.load();
  render();
  setInterval(function () { if (sessionEl.hidden) { S.regenHearts(); renderHeader(); } }, 30000);
})(window);
</script>
<script>/* Arena – vier Zeitmodi zum schnellen Üben.
   Eigene Spielfläche, eigene Optik, angebunden an die Wiederholungslogik. */
(function (global) {
  "use strict";
  var S = global.VT, el = document.getElementById("arena");

  var MODES = [
    { id: "match", icon: "⚡", name: "Match-Rausch",
      tag: "60 Sekunden", claim: "Fünf gegen fünf, so schnell du kannst.",
      desc: "Links fünf Wörter, rechts fünf Übersetzungen in zufälliger Reihenfolge. Jedes Paar, das sitzt, macht Platz für ein neues. Ein Fehlgriff kostet zwei Sekunden." },
    { id: "blitz", icon: "🔥", name: "Blitzrunde",
      tag: "Zeit sammeln", claim: "Jede richtige Antwort kauft dir Zeit.",
      desc: "Du startest mit 40 Sekunden. Richtig bringt anderthalb Sekunden zurück, falsch kostet drei. Die Runde endet, wenn die Uhr leer ist." },
    { id: "survival", icon: "💠", name: "Letztes Herz",
      tag: "Ein Fehler genügt", claim: "Wie weit kommst du ohne Patzer?",
      desc: "Pro Wort läuft ein kurzer Balken ab, und er wird alle fünf Treffer schneller. Ein Fehler oder eine abgelaufene Zeit beendet die Runde sofort." },
    { id: "hunt", icon: "🎯", name: "Fehlerjagd",
      tag: "90 Sekunden", claim: "Nur die Wörter, die dich ärgern.",
      desc: "Gespielt wird ausschließlich mit der Fehlerkartei. Jedes Wort muss zweimal sitzen, dann ist es erledigt. Schaffst du die Kartei leer?" }
  ];

  var run = null, timer = null;

  /* ---------- Hilfen ---------- */
  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function $(s, r) { return (r || el).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || el).querySelectorAll(s)); }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function key(id) { return id + ":" + S.state.settings.track; }
  function best(id) { var a = S.state.arena || {}; return a[key(id)] || { best: 0, plays: 0 }; }

  /* Wortpool: Fehlerkartei und fällige Wörter zuerst, dann der Rest */
  function pool(mode) {
    var p = S.pools(), list;
    if (mode === "hunt") {
      list = p.box.slice();
      if (list.length < 6) {
        var weak = p.all.filter(function (w) { var r = S.state.w[w.id]; return r && r.no > 0; });
        list = list.concat(weak.filter(function (w) { return list.indexOf(w) < 0; }));
      }
      if (list.length < 6) list = list.concat(S.shuffle(p.all.slice()).slice(0, 12 - list.length));
    } else {
      list = S.shuffle(p.box.slice()).concat(S.shuffle(p.due.slice()), S.shuffle(p.learning.slice()), S.shuffle(p.fresh.slice()));
    }
    var seenDe = {}, seenEn = {};
    return list.filter(function (w) {
      if (seenDe[w.de] || seenEn[w.en]) return false;
      seenDe[w.de] = seenEn[w.en] = 1; return true;
    });
  }
  function nextWord() {
    if (!run.queue.length) run.queue = pool(run.mode);
    return run.queue.shift();
  }
  function distractors(w, n) {
    var all = run.all.filter(function (x) { return x.id !== w.id && x.de !== w.de && x.en !== w.en; });
    var same = all.filter(function (x) { return x.unit === w.unit; });
    return S.shuffle(same).slice(0, n).concat(S.shuffle(all).slice(0, n)).slice(0, n);
  }

  /* ---------- Punkte ---------- */
  function hit(w, weight) {
    run.combo++; run.maxCombo = Math.max(run.maxCombo, run.combo);
    var mult = Math.min(3, 1 + run.combo * 0.1);
    var pts = Math.round(10 * mult * (weight || 1));
    run.score += pts; run.correct++; run.items++;
    if (w) S.grade(w.id, 1);            // Tempo zählt als sichere, nicht als tiefe Wiederholung
    S.addXp(2);
    flash("+" + pts, run.combo >= 5 ? "combo" : "ok");
    return pts;
  }
  function miss(w) {
    run.combo = 0; run.items++; run.wrong++;
    if (w) S.grade(w.id, 0);
    buzz(35);
    shake();
  }
  function flash(text, kind) {
    var f = $("#arFlash"); if (!f) return;
    f.textContent = text; f.className = "ar-flash " + (kind || "ok") + " show";
    setTimeout(function () { if (f) f.className = "ar-flash " + (kind || "ok"); }, 420);
  }
  function shake() {
    var b = $("#arBoard"); if (!b) return;
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  }

  /* ---------- Rahmen ---------- */
  function chrome(inner) {
    var t = run.mode === "survival" ? "" :
      '<div class="ar-time"><i id="arBar" style="width:100%"></i></div>';
    return '<div class="ar-top">' +
      '<button class="ar-x" data-a="quit" aria-label="Arena verlassen">✕</button>' +
      '<div class="ar-clock tnum" id="arClock">' + fmt(run.left) + '</div>' +
      '<div class="ar-score"><b class="tnum" id="arScore">0</b><span>Punkte</span></div>' +
      '</div>' + t +
      '<div class="ar-sub"><span id="arCombo" class="ar-combo"></span><span id="arNote">' + esc(run.note || "") + '</span></div>' +
      '<div class="ar-board" id="arBoard">' + inner + '</div>' +
      '<div class="ar-flash" id="arFlash"></div>';
  }
  function fmt(ms) {
    var s = Math.max(0, ms / 1000);
    return s >= 10 ? s.toFixed(0) : s.toFixed(1);
  }
  function paintHud() {
    var c = $("#arClock"); if (c) c.textContent = fmt(run.left);
    var sc = $("#arScore"); if (sc) sc.textContent = run.score;
    var cb = $("#arCombo");
    if (cb) {
      cb.textContent = run.combo >= 3 ? "×" + (Math.min(3, 1 + run.combo * 0.1)).toFixed(1) + " Serie " + run.combo : "";
      cb.className = "ar-combo" + (run.combo >= 8 ? " hot" : "");
    }
    var bar = $("#arBar");
    if (bar) {
      var pct = Math.max(0, Math.min(100, run.left / run.total * 100));
      bar.style.width = pct + "%";
      bar.className = pct < 20 ? "low" : pct < 45 ? "mid" : "";
    }
    if (run.mode === "hunt") { var n = $("#arNote"); if (n) n.textContent = "Noch " + run.targets.length + " in der Kartei"; }
  }

  /* ---------- Takt ---------- */
  function startClock() {
    var last = Date.now();
    timer = setInterval(function () {
      if (!run) return stopClock();
      var now = Date.now(), d = now - last; last = now;
      run.left -= d;
      if (run.mode === "survival") {
        run.qLeft -= d;
        var qb = $("#arQbar");
        if (qb) {
          var p = Math.max(0, run.qLeft / run.qTotal * 100);
          qb.style.width = p + "%";
          qb.className = p < 30 ? "low" : p < 60 ? "mid" : "";
        }
        if (run.qLeft <= 0) { miss(run.cur); return finish("timeout"); }
        var c = $("#arClock"); if (c) c.textContent = run.correct;
        return;
      }
      if (run.left <= 0) { run.left = 0; paintHud(); return finish("time"); }
      paintHud();
    }, 90);
  }
  function stopClock() { if (timer) clearInterval(timer); timer = null; }

  /* ================= Modus 1: Match-Rausch ================= */
  function renderMatch() {
    run.left = run.total = 60000;
    run.dir = Math.random() < 0.5 ? "de2en" : "en2de";
    run.note = run.dir === "de2en" ? "Deutsch → Englisch" : "Englisch → Deutsch";
    run.left5 = []; run.right5 = []; run.sel = null;
    for (var i = 0; i < 5; i++) { var w = nextWord(); run.left5.push(w); run.right5.push(w); }
    run.right5 = S.shuffle(run.right5);
    el.innerHTML = chrome('<div class="ar-match" id="arMatch"></div>');
    paintMatch(); startClock();
  }
  function side(w, which) {
    return run.dir === "de2en" ? (which === "l" ? w.de : w.en) : (which === "l" ? w.en : w.de);
  }
  function paintMatch() {
    var m = $("#arMatch"); if (!m) return;
    m.innerHTML =
      '<div class="ar-col">' + run.left5.map(function (w, i) {
        return w ? '<button class="ar-tile' + (run.sel === i ? " sel" : "") + '" data-l="' + i + '">' + esc(side(w, "l")) + '</button>'
                 : '<span class="ar-tile gone"></span>';
      }).join("") + '</div>' +
      '<div class="ar-col">' + run.right5.map(function (w, i) {
        return w ? '<button class="ar-tile" data-r="' + i + '">' + esc(side(w, "r")) + '</button>'
                 : '<span class="ar-tile gone"></span>';
      }).join("") + '</div>';
  }
  function tapMatch(l, r) {
    if (l != null) {
      run.sel = run.sel === l ? null : l;
      $$("[data-l]").forEach(function (t) { t.classList.toggle("sel", +t.getAttribute("data-l") === run.sel); });
      return;
    }
    if (run.sel == null) return;
    var lw = run.left5[run.sel], rw = run.right5[r];
    if (!lw || !rw) return;
    if (lw.id === rw.id) {
      hit(lw, 1);
      var li = run.sel, ri = r;
      run.sel = null;
      var tiles = $$("[data-l='" + li + "'],[data-r='" + ri + "']");
      tiles.forEach(function (t) { t.classList.add("pop"); });
      setTimeout(function () {
        if (!run || run.mode !== "match") return;
        var nw = nextWord();
        run.left5[li] = nw; run.right5[ri] = nw;
        var swap = Math.floor(Math.random() * 5);        // neue Übersetzung nicht auf Höhe des Partners lassen
        var tmp = run.right5[ri]; run.right5[ri] = run.right5[swap]; run.right5[swap] = tmp;
        paintMatch();
      }, 150);
      paintHud();
    } else {
      miss(lw);
      run.left -= 2000;
      run.sel = null;
      var wrongTile = $("[data-r='" + r + "']");
      if (wrongTile) { wrongTile.classList.add("bad"); setTimeout(function () { wrongTile.classList.remove("bad"); }, 320); }
      $$("[data-l]").forEach(function (t) { t.classList.remove("sel"); });
      paintHud();
    }
  }

  /* ================= Modus 2 & 4: Karten mit Auswahl ================= */
  function renderCard() {
    var w = nextWord();
    if (run.mode === "hunt") {
      if (!run.targets.length) return finish("cleared");
      w = run.targets[Math.floor(Math.random() * run.targets.length)];
    }
    run.cur = w;
    var ask = Math.random() < 0.5 ? "en" : "de";
    run.ask = ask;
    var opts = S.shuffle(distractors(w, 3).map(function (x) { return { t: ask === "en" ? x.de : x.en, ok: false }; })
      .concat([{ t: ask === "en" ? w.de : w.en, ok: true }]));
    run.opts = opts;
    var qbar = run.mode === "survival"
      ? '<div class="ar-qbar"><i id="arQbar" style="width:100%"></i></div>' : "";
    var inner = '<div class="ar-card">' +
      '<div class="ar-ask">' + (ask === "en" ? "auf Deutsch" : "auf Englisch") + '</div>' +
      '<div class="ar-word">' + esc(ask === "en" ? w.en : w.de) + '</div>' + qbar +
      '<div class="ar-opts">' + opts.map(function (o, i) {
        return '<button class="ar-opt" data-o="' + i + '">' + esc(o.t) + '</button>';
      }).join("") + '</div></div>';
    if ($("#arBoard")) { $("#arBoard").innerHTML = inner; }
    else el.innerHTML = chrome(inner);
    if (run.mode === "survival") { run.qLeft = run.qTotal; var c = $("#arClock"); if (c) c.textContent = run.correct; }
    paintHud();
  }
  function tapOpt(i) {
    if (!run || run.locked) return;
    var o = run.opts[i], w = run.cur;
    var btns = $$(".ar-opt");
    if (o.ok) {
      btns[i].classList.add("right");
      hit(w, run.mode === "hunt" ? 1.4 : 1);
      if (run.mode === "blitz") run.left = Math.min(run.cap, run.left + 1500);
      if (run.mode === "survival") {
        if (run.correct % 5 === 0) run.qTotal = Math.max(2800, run.qTotal - 300);
      }
      if (run.mode === "hunt") {
        run.hits[w.id] = (run.hits[w.id] || 0) + 1;
        if (run.hits[w.id] >= 2) {
          run.targets = run.targets.filter(function (x) { return x.id !== w.id; });
          run.cleared++;
          flash("erledigt!", "combo");
          if (!run.targets.length) { paintHud(); return setTimeout(function () { finish("cleared"); }, 250); }
        }
      }
    } else {
      btns[i].classList.add("wrong");
      btns.forEach(function (b, j) { if (run.opts[j].ok) b.classList.add("right"); });
      miss(w);
      if (run.mode === "blitz") run.left -= 3000;
      if (run.mode === "hunt") { run.hits[w.id] = 0; run.left -= 2000; }
      if (run.mode === "survival") { paintHud(); run.locked = true; return setTimeout(function () { finish("dead"); }, 600); }
    }
    paintHud();
    run.locked = true;
    setTimeout(function () {
      if (!run) return;
      run.locked = false;
      if (run.left > 0 || run.mode === "survival") renderCard();
    }, o.ok ? 150 : 550);
  }

  /* ---------- Start & Ende ---------- */
  function start(mode) {
    var p = S.pools();
    if (p.all.length < 8) return global.VTUI.toast("Für die Arena brauchst du mindestens acht Wörter im gewählten Bereich.");
    if (mode === "hunt" && !p.box.length) global.VTUI.toast("Fehlerkartei ist leer – gespielt wird mit deinen wackeligsten Wörtern.");
    S.rollDay();
    run = {
      mode: mode, score: 0, combo: 0, maxCombo: 0, items: 0, correct: 0, wrong: 0,
      start: Date.now(), left: 0, total: 0, queue: [], all: p.all, locked: false,
      qTotal: 7000, qLeft: 7000, targets: [], hits: {}, cleared: 0, note: ""
    };
    run.queue = pool(mode);
    el.hidden = false;
    document.documentElement.classList.add("ar-open");
    if (mode === "match") return renderMatch();
    if (mode === "blitz") { run.left = 40000; run.total = 60000; run.cap = 60000; run.note = "Richtig bringt Zeit, bis 60 Sekunden"; }
    if (mode === "survival") { run.left = run.total = 0; run.note = "Ein Fehler beendet die Runde"; }
    if (mode === "hunt") {
      run.left = run.total = 90000;
      run.targets = run.queue.slice(0, 10);
      run.note = "Noch " + run.targets.length + " in der Kartei";
    }
    el.innerHTML = chrome("");
    if (mode === "survival") { var c = $("#arClock"); if (c) c.textContent = "0"; }
    renderCard(); startClock();
  }

  function finish(reason) {
    if (!run || run.done) return;
    run.done = true; stopClock();
    var sec = Math.round((Date.now() - run.start) / 1000);
    var m = MODES.filter(function (x) { return x.id === run.mode; })[0];
    var score = run.mode === "survival" ? run.correct : run.score;
    var rec = best(run.mode), isRecord = score > rec.best;
    if (!S.state.arena) S.state.arena = {};
    S.state.arena[key(run.mode)] = { best: Math.max(rec.best, score), plays: rec.plays + 1 };
    var coins = Math.min(40, Math.floor(score / 40)) + (isRecord ? 10 : 0);
    S.addCoins(coins);
    S.addXp(Math.min(60, Math.round(score / 8)));
    var rw = S.finishSession({ items: run.items, correct: run.correct, sec: sec, maxChain: run.maxCombo, newSeen: 0, boxSolved: run.cleared, mastered: 0, sentOk: 0 });
    var fresh = [];
    function give(id) {
      if (S.state.badges.indexOf(id) < 0) {
        S.state.badges.push(id);
        var b = S.BADGES.filter(function (x) { return x.id === id; })[0];
        if (b) fresh.push(b);
      }
    }
    give("arena1");
    if (run.maxCombo >= 15) give("combo15");
    var acc = run.items ? Math.round(run.correct * 100 / run.items) : 0;
    var head = reason === "cleared" ? "Kartei leer geräumt!"
      : isRecord ? "Neuer Bestwert!"
      : reason === "dead" ? "Erwischt."
      : reason === "timeout" ? "Zeit abgelaufen."
      : "Runde vorbei";
    var line = run.mode === "survival"
      ? run.correct + " " + (run.correct === 1 ? "Wort" : "Wörter") + " am Stück"
      : score + " Punkte";
    el.innerHTML = '<div class="ar-end">' +
      '<div class="ar-endicon">' + (isRecord ? "🏆" : reason === "cleared" ? "🎯" : esc(m.icon)) + '</div>' +
      '<h1>' + esc(head) + '</h1>' +
      '<div class="ar-big tnum">' + esc(line) + '</div>' +
      '<div class="ar-stats">' +
      '<div><b class="tnum">' + run.correct + '</b><span>richtig</span></div>' +
      '<div><b class="tnum">' + acc + '%</b><span>Trefferquote</span></div>' +
      '<div><b class="tnum">' + run.maxCombo + '</b><span>beste Serie</span></div>' +
      '<div><b class="tnum">' + Math.max(rec.best, score) + '</b><span>Bestwert</span></div>' +
      '</div>' +
      '<p class="ar-note">' + (coins ? "🪙 " + coins + " Münzen" : "Keine Münzen diesmal") +
      (rw.goalReached ? " · Tagesziel erreicht" : "") +
      (run.cleared ? " · " + run.cleared + " aus der Fehlerkartei befreit" : "") + '</p>' +
      (fresh.length ? '<p class="ar-note" style="color:var(--ar-gold)">🏅 Neu: ' + fresh.map(function (b) { return esc(b.n); }).join(", ") + '</p>' : "") +
      '<div class="ar-endbtns"><button class="ar-btn" data-a="again">Noch mal</button>' +
      '<button class="ar-btn ghost" data-a="quit">Zurück</button></div></div>';
    S.save(true);
    if (global.VTUI && global.VTUI.refreshHeader) global.VTUI.refreshHeader();
  }

  function close() {
    stopClock();
    var again = run && run.mode;
    run = null;
    el.hidden = true; el.innerHTML = "";
    document.documentElement.classList.remove("ar-open");
    if (global.VTUI && global.VTUI.afterArena) global.VTUI.afterArena();
    return again;
  }

  el.addEventListener("click", function (e) {
    if (!run) { var q0 = e.target.closest("[data-a]"); if (q0) close(); return; }
    var t = e.target.closest("[data-a]");
    if (t) {
      var a = t.getAttribute("data-a");
      if (a === "quit") { if (!run.done) finish("quit"); else close(); return; }
      if (a === "again") { var m = run.mode; close(); return start(m); }
    }
    if (run.done) return;
    var l = e.target.closest("[data-l]"), r = e.target.closest("[data-r]");
    if (l) return tapMatch(+l.getAttribute("data-l"), null);
    if (r) return tapMatch(null, +r.getAttribute("data-r"));
    var o = e.target.closest("[data-o]");
    if (o) return tapOpt(+o.getAttribute("data-o"));
  });
  document.addEventListener("keydown", function (e) {
    if (!run || el.hidden || run.done) return;
    if (/^[1-4]$/.test(e.key)) { var o = $$(".ar-opt")[+e.key - 1]; if (o) o.click(); }
    if (e.key === "Escape") finish("quit");
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && run && !run.done && run.mode !== "survival") finish("quit");
  });

  global.ARENA = { MODES: MODES, start: start, best: best, close: close, open: function () { return !el.hidden; } };
})(window);
</script>

</body>
</html>
