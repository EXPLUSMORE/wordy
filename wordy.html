<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6273">
<title>Wordy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#EEF2F8; --card:#FFFFFF; --card-2:#F7F9FC;
  --ink:#16223A; --ink-2:#4B5B78; --ink-3:#8593AB;
  --rule:#C9D7EA; --line:#DEE6F1; --shadow:0 1px 2px rgba(22,34,58,.06),0 8px 24px rgba(22,34,58,.06);
  --accent:#1E6273; --accent-ink:#ffffff; --accent-soft:#DCEDF1;
  --good:#2C7A57; --good-soft:#DCF0E6; --bad:#B8403B; --bad-soft:#FAE3E1;
  --gold:#A9781F; --margin:#C2413A;
  --r:14px;
}
:root[data-accent="mint"]{ --accent:#2E7357; --accent-soft:#DEEFE6; }
:root[data-accent="plum"]{ --accent:#6A3D70; --accent-soft:#EDE1EF; }
:root[data-accent="amber"]{ --accent:#8A5A1B; --accent-soft:#F4E7D2; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0E131C; --card:#161D29; --card-2:#1B2431;
  --ink:#E7EDF8; --ink-2:#A7B5CC; --ink-3:#74839B;
  --rule:#27344703; --rule:#253246; --line:#222C3B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --accent:#4FA8BE; --accent-ink:#06121A; --accent-soft:#16323C;
  --good:#63C79A; --good-soft:#152F26; --bad:#E7817B; --bad-soft:#331C1B;
  --gold:#D8A445; --margin:#E07A73;
}}
:root[data-theme="dark"]{
  --paper:#0E131C; --card:#161D29; --card-2:#1B2431;
  --ink:#E7EDF8; --ink-2:#A7B5CC; --ink-3:#74839B;
  --rule:#253246; --line:#222C3B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --accent:#4FA8BE; --accent-ink:#06121A; --accent-soft:#16323C;
  --good:#63C79A; --good-soft:#152F26; --bad:#E7817B; --bad-soft:#331C1B;
  --gold:#D8A445; --margin:#E07A73;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Karla,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;overflow:hidden}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.tnum{font-variant-numeric:tabular-nums}

/* Gerüst */
#app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;position:relative}
header#top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;-webkit-overflow-scrolling:touch}
nav#tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  border-top:1px solid var(--line);background:var(--card);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
nav#tabs button .ic{font-size:19px;line-height:1}
nav#tabs button{font-size:10.5px}
nav#tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}

/* Kopfzeile */
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.stat{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font-weight:700}
.spacer{flex:1 1 auto}

/* Bausteine */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;letter-spacing:.01em;
  transition:transform .08s ease,filter .15s ease}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--accent-soft);color:var(--accent);font-weight:700}
.btn.wide{width:100%}
.btn.lg{padding:16px 20px;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.l0{color:var(--ink-3)} .pill.l1{color:var(--ink-2)}
.pill.l2{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.pill.l3{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.l4{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:transparent}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Start */
.hero{position:relative;overflow:hidden;background:
   linear-gradient(180deg,transparent 0 22px,var(--rule) 22px 23px,transparent 23px) 0 0/100% 23px repeat-y,var(--card)}
.hero:before{content:"";position:absolute;inset:0 auto 0 30px;width:1px;background:var(--margin);opacity:.5}
.hero .inner{padding-left:18px}
.hero h1{font-size:26px;line-height:1.15}
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring>span{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;
  font-weight:700;font-size:15px;color:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quick button{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);
  font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.quick button small{font-weight:600;font-size:11px;color:var(--ink-3)}
.mission{display:flex;align-items:center;gap:10px;padding:9px 0}
.mission+.mission{border-top:1px solid var(--line)}
.mission .txt{flex:1 1 auto;min-width:0}
.mission .bar{margin-top:5px}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:transparent}
.mission.done .tick{background:var(--good);border-color:var(--good);color:#fff}

/* Einheiten */
.unit{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.unit+.unit{border-top:1px solid var(--line)}
.unit .ic{width:38px;height:38px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.unit .t{flex:1 1 auto;min-width:0}
.unit .t b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wordrow{display:flex;align-items:baseline;gap:10px;padding:10px 0}
.wordrow+.wordrow{border-top:1px solid var(--line)}
.wordrow .en{font-weight:700}
.mini-speak{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:inline-grid;place-items:center;font-size:12px;flex:0 0 auto;margin-right:2px;vertical-align:-6px}
.wordrow .de{color:var(--ink-2);flex:1 1 auto;font-size:14px}

/* Session */
#session{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:20}
#session .shead{display:flex;align-items:center;gap:10px;padding:10px 16px}
#session .sbody{flex:1 1 auto;overflow-y:auto;padding:8px 16px 20px}
#session .sfoot{flex:0 0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.prompt{font-family:Newsreader,Georgia,serif;font-size:32px;line-height:1.2;font-weight:600;text-wrap:balance}
.prompt.de{font-size:27px}
.sub{color:var(--ink-2);font-size:14px}
.opts{display:grid;gap:9px;margin-top:4px}
.opt{display:flex;align-items:center;gap:10px;padding:14px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);text-align:left;font-weight:600;transition:border-color .12s,background .12s}
.opt .k{width:22px;height:22px;border-radius:6px;background:var(--card-2);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--ink-3);flex:0 0 auto}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--card-2);border-radius:12px;border:1px solid var(--line)}
.seg button{padding:10px 8px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tiles{display:flex;flex-wrap:wrap;gap:7px}
.tile{min-width:38px;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-weight:700;font-size:17px;font-family:Karla,sans-serif}
.tile.used{opacity:.25;pointer-events:none}
.tile.word{font-size:15px;padding:10px 13px;min-width:0;font-weight:600}
.slot.build{min-height:58px;align-items:flex-end;font-size:19px;letter-spacing:0;line-height:1.5;padding-bottom:8px}
.slot{min-height:52px;border-bottom:2px dashed var(--rule);display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  font-size:22px;font-weight:700;letter-spacing:.04em;padding:6px 2px}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.matchgrid button{padding:13px 10px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.matchgrid button.sel{border-color:var(--accent);background:var(--accent-soft)}
.matchgrid button.ok{border-color:var(--good);background:var(--good-soft);opacity:.55;pointer-events:none}
.matchgrid button.no{border-color:var(--bad);background:var(--bad-soft)}
.gapline{font-family:Newsreader,Georgia,serif;font-size:24px;line-height:1.45;text-wrap:balance}
.gapline u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 22px;color:var(--accent)}
.speak{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:23px;flex:0 0 auto}
.speak.big{width:96px;height:96px;font-size:38px}
.verdict{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-weight:600}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict .cmp{display:block;font-weight:600;font-size:13px;opacity:.9;margin-top:3px}
.hearts{letter-spacing:1px;font-size:14px}

/* Fortschritt */
.tiles4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card-2);border-radius:12px;padding:12px 13px}
.kpi b{display:block;font-family:Newsreader,serif;font-size:27px;font-weight:600;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-3);font-weight:600}
.levelbar{display:flex;height:26px;border-radius:8px;overflow:hidden;gap:2px;background:var(--line)}
.levelbar i{display:block;height:100%}
.lv0{background:var(--line)} .lv1{background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.lv2{background:color-mix(in srgb,var(--accent) 45%,var(--card))} .lv3{background:color-mix(in srgb,var(--accent) 72%,var(--card))}
.lv4{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;align-items:end;height:92px}
.days .d{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px}
.days .d i{display:block;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:3px;opacity:.85}
.days .d i.zero{background:var(--line)}
.days .d small{font-size:9px;color:var(--ink-3);text-align:center;font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;background:var(--card-2)}
.badge.off{opacity:.38}
.badge b{display:block;font-size:12px;margin-top:4px}
.badge .g{font-size:22px}
.shopitem{display:flex;align-items:center;gap:10px;padding:10px 0}
.shopitem+.shopitem{border-top:1px solid var(--line)}

/* ---------- Arena ---------- */
html.ar-open, html.ar-open body{overflow:hidden}
#arena{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
  background:var(--ar-bg);color:var(--ar-ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:Karla,"Segoe UI",system-ui,sans-serif}
:root{
  --ar-bg:#0A111D; --ar-s:#16202F; --ar-s2:#1D293A; --ar-line:#2A3A52;
  --ar-ink:#EDF3FC; --ar-ink2:#8FA2BD;
  --ar-a:#4FC3D9; --ar-gold:#F2B94B; --ar-good:#5FD3A0; --ar-bad:#F2776E;
}
.ar-top{display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
.ar-x{width:36px;height:36px;border-radius:50%;background:var(--ar-s);color:var(--ar-ink2);
  display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.ar-clock{flex:1 1 auto;text-align:center;font-family:Newsreader,Georgia,serif;font-size:38px;font-weight:600;line-height:1}
.ar-score{text-align:right;flex:0 0 auto}
.ar-score b{display:block;font-family:Newsreader,serif;font-size:22px;font-weight:600;line-height:1.1}
.ar-score span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ar-ink2)}
.ar-time{height:6px;margin:0 16px;border-radius:99px;background:var(--ar-s);overflow:hidden}
.ar-time>i{display:block;height:100%;background:var(--ar-a);border-radius:99px}
.ar-time>i.mid{background:var(--ar-gold)} .ar-time>i.low{background:var(--ar-bad)}
.ar-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 16px 4px;font-size:12px;color:var(--ar-ink2);min-height:30px}
.ar-combo{font-weight:800;letter-spacing:.03em;color:var(--ar-a)}
.ar-combo.hot{color:var(--ar-gold)}
.ar-board{flex:1 1 auto;overflow-y:auto;padding:8px 16px 20px;position:relative}
.ar-match{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%;
  max-width:560px;margin:0 auto;align-content:center}
.ar-col{display:grid;grid-template-rows:repeat(5,minmax(52px,92px));gap:10px;min-height:0;align-content:center}
.ar-tile{display:flex;align-items:center;justify-content:center;text-align:center;
  padding:8px 9px;border-radius:13px;background:var(--ar-s);border:1px solid var(--ar-line);
  color:var(--ar-ink);font-weight:600;font-size:14px;line-height:1.25;min-height:56px;
  overflow:hidden;word-break:break-word;hyphens:auto}
.ar-tile.sel{border-color:var(--ar-a);background:var(--ar-s2);box-shadow:0 0 0 2px rgba(79,195,217,.28)}
.ar-tile.gone{background:transparent;border-color:transparent;pointer-events:none}
.ar-tile.bad{border-color:var(--ar-bad);background:rgba(242,119,110,.16);color:var(--ar-bad)}
.ar-card{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.ar-ask{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ar-ink2);text-align:center}
.ar-word{font-family:Newsreader,Georgia,serif;font-size:34px;font-weight:600;text-align:center;
  line-height:1.15;text-wrap:balance}
.ar-qbar{height:5px;border-radius:99px;background:var(--ar-s);overflow:hidden;margin:0 auto;width:min(320px,88%)}
.ar-qbar>i{display:block;height:100%;background:var(--ar-good);border-radius:99px}
.ar-qbar>i.mid{background:var(--ar-gold)} .ar-qbar>i.low{background:var(--ar-bad)}
.ar-opts{display:grid;gap:10px;margin-top:2px}
.ar-opt{padding:16px 14px;border-radius:13px;background:var(--ar-s);border:1px solid var(--ar-line);
  color:var(--ar-ink);font-weight:600;font-size:15.5px;text-align:center}
.ar-opt.right{border-color:var(--ar-good);background:rgba(95,211,160,.16);color:var(--ar-good)}
.ar-opt.wrong{border-color:var(--ar-bad);background:rgba(242,119,110,.16);color:var(--ar-bad)}
.ar-flash{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);
  font-family:Newsreader,serif;font-size:34px;font-weight:600;color:var(--ar-good);
  opacity:0;pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.ar-flash.combo{color:var(--ar-gold);font-size:40px}
.ar-end{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:24px 20px;text-align:center}
.ar-endicon{font-size:52px;line-height:1}
.ar-end h1{font-family:Newsreader,serif;font-size:27px;font-weight:600;margin:0}
.ar-big{font-family:Newsreader,serif;font-size:44px;font-weight:600;color:var(--ar-a);line-height:1}
.ar-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:440px;margin-top:6px}
.ar-stats div{background:var(--ar-s);border-radius:12px;padding:10px 6px}
.ar-stats b{display:block;font-family:Newsreader,serif;font-size:21px;font-weight:600;line-height:1.1}
.ar-stats span{font-size:10px;color:var(--ar-ink2);letter-spacing:.03em}
.ar-note{color:var(--ar-ink2);font-size:13px;margin:4px 0 0}
.ar-endbtns{display:flex;gap:10px;width:100%;max-width:440px;margin-top:10px}
.ar-btn{flex:1 1 auto;padding:15px 18px;border-radius:13px;background:var(--ar-a);color:#06131A;
  font-weight:800;font-size:16px}
.ar-btn.ghost{background:var(--ar-s);color:var(--ar-ink);border:1px solid var(--ar-line);font-weight:700}
#arena :focus-visible{outline:2px solid var(--ar-a);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .ar-tile,.ar-opt{transition:border-color .12s ease,background .12s ease,transform .12s ease}
  .ar-tile:active,.ar-opt:active{transform:scale(.97)}
  .ar-tile.pop{animation:arpop .18s ease forwards}
  @keyframes arpop{to{transform:scale(.8);opacity:0}}
  .ar-flash.show{animation:arflash .42s ease}
  @keyframes arflash{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
    100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
  .ar-board.shake{animation:arshake .32s ease}
  @keyframes arshake{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}100%{transform:none}}

<script>/* Vokabeltrainer v2 – Lernmotor: Speicherung, Spaced Repetition, Fehlerkartei,

(function (global) {

  var HEART_REGEN_MS = 8 * 60000;  // ein Herz alle 8 Minuten

  var LEVELS = [

  var AVATARS = ["🦊","🐼","🦉","🐙","🦕","🐝","🦁","🐧","🦄","🐢","🦈","🐨"];
  var SHOP = [
    { id: "av:🐼", kind: "avatar", label: "Panda",    cost: 40,  val: "🐼" },
    { id: "av:🦉", kind: "avatar", label: "Eule",     cost: 60,  val: "🦉" },
    { id: "av:🐙", kind: "avatar", label: "Krake",    cost: 80,  val: "🐙" },
    { id: "av:🦕", kind: "avatar", label: "Dino",     cost: 120, val: "🦕" },

    { id: "th:plum",  kind: "theme", label: "Pflaume",cost: 90,  val: "plum" },
    { id: "th:amber", kind: "theme", label: "Amber",  cost: 140, val: "amber" }
  ];

  var BADGES = [
    { id: "start",   n: "Erster Schritt",  d: "Die erste Übung abgeschlossen." },

    { id: "m100",    n: "100 gemeistert",  d: "100 Wörter sitzen langfristig." },
    { id: "streak7", n: "Eine Woche",      d: "7 Tage hintereinander geübt." },
    { id: "streak30",n: "Ein Monat",       d: "30 Tage hintereinander geübt." },
    { id: "clean",   n: "Fehlerfrei",      d: "Eine Runde ohne einen Fehler." },
    { id: "chain15", n: "15er-Serie",      d: "15 richtige Antworten in Folge." },
    { id: "box0",    n: "Kartei leer",     d: "Die Fehlerkartei einmal leer geräumt." },
    { id: "unit1",   n: "Einheit fertig",  d: "Alle Wörter einer Einheit gemeistert." },
    { id: "early",   n: "Dranbleiber",     d: "An 5 verschiedenen Tagen geübt." },
    { id: "sent20",  n: "Satzbauer",       d: "20 Sätze richtig zusammengesetzt." },
    { id: "sent75",  n: "Satzprofi",       d: "75 Sätze richtig zusammengesetzt." },
    { id: "arena1",  n: "Arena betreten",  d: "Eine Runde in der Arena gespielt." },
    { id: "combo15", n: "Serientäter",     d: "15 Treffer am Stück in der Arena." }
  ];

  /* ---------- Hilfsfunktionen ---------- */
  function today(d) { d = d || new Date(); return d.toISOString().slice(0, 10); }
  function dayDiff(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- Wortkatalog ---------- */
  var units = [], words = [], byId = {}, sentences = [];
  function trackOf(u) { return u.track || (u.k === 0 ? "eigen" : "schule"); }
  function buildCatalogue(state) {
    units = (global.VOCAB_UNITS || []).slice();
    if (state && state.custom) units = units.concat(state.custom);
    words = []; byId = {};
    units.forEach(function (u) {
      u.track = trackOf(u);
      u.words.forEach(function (w, i) {
        var item = {
          id: u.id + "#" + i, en: w[0], de: w[1], diff: w[2] || 1, ex: w[3] || "",
          unit: u.id, unitTitle: u.title, k: u.k, icon: u.icon || "📘", track: u.track
        };
        item.gap = gapToken(item);
        words.push(item); byId[item.id] = item;
      });
    });
    sentences = (global.SENTENCES || []).map(function (a, i) {
      return { id: "s" + i, track: a[0], k: a[1], en: a[2], de: a[3], rule: a[4] };
    });
    return words;
  }
  function gapToken(item) {
    if (!item.ex) return null;
    var base = item.en.replace(/^to\s+/i, "");
    var i = item.ex.toLowerCase().indexOf(base.toLowerCase());
    return i < 0 ? null : item.ex.substr(i, base.length);
  }

  /* ---------- Zustand ---------- */
  function freshState() {
    return {
      v: 2, created: Date.now(),
      profile: { name: "", avatar: "🦊", theme: "paper", owned: ["av:🦊", "th:paper"] },
      settings: { track: "schule", klassen: [6], bizGroups: ["Basis"], units: [], goalMin: 10, audio: true, hearts: true, newPerDay: 12 },
      xp: 0, coins: 0, hearts: 5, heartTs: Date.now(),
      streak: { count: 0, best: 0, last: null, freezes: 2, usedToday: false },
      daily: null, history: {}, w: {}, s: {}, arena: {}, custom: [], badges: [],
      totals: { items: 0, correct: 0, sec: 0, sentOk: 0 }
    };
  }
  var state = freshState();

  function load() {
    var raw = null;
    try { raw = global.localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) { try { var p = JSON.parse(raw); if (p && p.v === 2) state = Object.assign(freshState(), p); } catch (e) {} }
    buildCatalogue(state);
    rollDay();
    regenHearts();
    return state;
  }
  var saveTimer = null;
  function save(now) {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (!now) { saveTimer = setTimeout(function () { save(true); }, 400); return; }
    try { global.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- Tageswechsel, Streak, Herzen ---------- */
  function rollDay() {
    var t = today();
    if (!state.daily || state.daily.date !== t) {
      if (state.daily && state.daily.items > 0) state.history[state.daily.date] = {
        items: state.daily.items, correct: state.daily.correct, sec: state.daily.sec, xp: state.daily.xp
      };
      state.daily = { date: t, items: 0, correct: 0, sec: 0, xp: 0, newSeen: 0, missions: makeMissions(), done: false };
      state.streak.usedToday = false;
      var last = state.streak.last;
      if (last) {
        var gap = dayDiff(last, t);
        if (gap > 1) {
          var missed = gap - 1;
          if (state.streak.freezes >= missed) { state.streak.freezes -= missed; state.streak.usedToday = true; }
          else { state.streak.best = Math.max(state.streak.best, state.streak.count); state.streak.count = 0; }
        }
      }
      save(true);
    }
  }
  function makeMissions() {
    var pool = [
      { id: "m20", n: "20 Aufgaben lösen", goal: 20, type: "items", coins: 10 },
      { id: "m30", n: "30 Aufgaben lösen", goal: 30, type: "items", coins: 14 },
      { id: "mgoal", n: "Tagesziel erreichen", goal: 1, type: "goal", coins: 15 },
      { id: "mbox", n: "5 Wörter aus der Fehlerkartei", goal: 5, type: "box", coins: 12 },
      { id: "mchain", n: "10 richtige in Folge", goal: 10, type: "chain", coins: 12 },
      { id: "mnew", n: "6 neue Wörter kennenlernen", goal: 6, type: "new", coins: 10 },
      { id: "mmaster", n: "2 Wörter meistern", goal: 2, type: "master", coins: 18 },
      { id: "msent", n: "4 Sätze richtig bauen", goal: 4, type: "sent", coins: 14 }
    ];
    var picked = shuffle(pool.slice()).slice(0, 3);
    return picked.map(function (m) { return { id: m.id, n: m.n, goal: m.goal, type: m.type, coins: m.coins, p: 0, done: false }; });
  }
  function regenHearts() {
    if (!state.settings.hearts) { state.hearts = 5; return; }
    var gained = Math.floor((Date.now() - (state.heartTs || Date.now())) / HEART_REGEN_MS);
    if (gained > 0 && state.hearts < 5) {
      state.hearts = Math.min(5, state.hearts + gained);
      state.heartTs = Date.now();
      if (state.hearts >= 5) state.heartTs = Date.now();
    }
  }
  function heartsIn() {
    if (state.hearts >= 5) return 0;
    return Math.max(0, HEART_REGEN_MS - (Date.now() - state.heartTs));
  }

  /* ---------- Wortfortschritt ---------- */
  function rec(id) {
    var r = state.w[id];
    if (!r) { r = state.w[id] = { reps: 0, ef: 2.3, iv: 0, due: 0, lapses: 0, chain: 0, ok: 0, no: 0, last: 0 }; }
    return r;
  }
  function levelOf(id) {
    var r = state.w[id]; if (!r || !r.reps) return 0;
    if (r.iv >= 21 && r.chain >= 4) return 4;
    if (r.iv >= 7 || r.reps >= 4) return 3;
    if (r.reps >= 2) return 2;
    return 1;
  }
  // grade: 2 = sicher richtig, 1 = richtig mit Hilfe/langsam, 0 = falsch
  function grade(id, g) {
    var r = rec(id), before = levelOf(id);
    r.last = Date.now();
    if (g === 0) {
      r.no++; r.lapses++; r.chain = 0; r.reps = 0; r.iv = 0;
      r.ef = clamp(r.ef - 0.2, 1.3, 2.8);
      r.due = Date.now() + 60000;
    } else {
      r.ok++; r.chain++;
      r.ef = clamp(r.ef + (g === 2 ? 0.08 : -0.06), 1.3, 2.8);
      r.iv = r.reps === 0 ? 1 : r.reps === 1 ? 3 : Math.min(400, Math.round(r.iv * r.ef));
      r.reps++;
      r.due = Date.now() + r.iv * 86400000;
    }
    return { before: before, after: levelOf(id), rec: r };
  }
  function inErrorBox(id) { var r = state.w[id]; return !!r && r.lapses > 0 && levelOf(id) < 3; }

  /* ---------- Auswahl & Sessionplanung ---------- */
  function groupsOf() {
    var s = state.settings;
    return s.track === "business" ? (s.bizGroups || []) : (s.klassen || []);
  }
  function activeWords() {
    var s = state.settings, sel = groupsOf();
    return words.filter(function (w) {
      if (s.units && s.units.length) return s.units.indexOf(w.unit) >= 0;
      if (w.track === "eigen") return true;            // eigene Listen immer aktiv
      if (w.track !== s.track) return false;
      return sel.indexOf(w.k) >= 0;
    });
  }
  /* ---------- Sätze ---------- */
  function srec(id) {
    var r = state.s[id];
    if (!r) r = state.s[id] = { reps: 0, ef: 2.3, iv: 0, due: 0, ok: 0, no: 0, last: 0 };
    return r;
  }
  function activeSentences() {
    var s = state.settings, sel = groupsOf();
    return sentences.filter(function (x) { return x.track === s.track && sel.indexOf(x.k) >= 0; });
  }
  function planSentences(n) {
    if (n <= 0) return [];
    var now = Date.now(), act = activeSentences(), due = [], fresh = [];
    act.forEach(function (x) {
      var r = state.s[x.id];
      if (!r || !r.reps) fresh.push(x); else if (r.due <= now) due.push(x);
    });
    due.sort(function (a, b) { return state.s[a.id].due - state.s[b.id].due; });
    return shuffle(due.slice(0, n).concat(shuffle(fresh).slice(0, Math.max(0, n - due.length))));
  }
  function gradeSentence(id, g) {
    var r = srec(id); r.last = Date.now();
    if (g === 0) { r.no++; r.reps = 0; r.iv = 0; r.ef = clamp(r.ef - 0.2, 1.3, 2.8); r.due = Date.now() + 120000; }
    else {
      r.ok++; state.totals.sentOk++;
      r.ef = clamp(r.ef + (g === 2 ? 0.08 : -0.06), 1.3, 2.8);
      r.iv = r.reps === 0 ? 2 : r.reps === 1 ? 5 : Math.min(400, Math.round(r.iv * r.ef));
      r.reps++; r.due = Date.now() + r.iv * 86400000;
    }
    return r;
  }
  function sentenceStats() {
    var act = activeSentences(), seen = 0, mastered = 0;
    act.forEach(function (x) { var r = state.s[x.id]; if (r && r.reps) { seen++; if (r.iv >= 21) mastered++; } });
    return { total: act.length, seen: seen, mastered: mastered, ok: state.totals.sentOk };
  }
  function pools() {
    var now = Date.now(), act = activeWords();
    var due = [], box = [], fresh = [], learning = [];
    act.forEach(function (w) {
      var r = state.w[w.id];
      if (!r || !r.reps && !r.no) { fresh.push(w); return; }
      if (inErrorBox(w.id)) { box.push(w); return; }
      if (r.due <= now) due.push(w); else learning.push(w);
    });
    due.sort(function (a, b) { return state.w[a.id].due - state.w[b.id].due; });
    box.sort(function (a, b) { return (state.w[b.id].lapses - state.w[a.id].lapses) || (state.w[a.id].last - state.w[b.id].last); });
    return { due: due, box: box, fresh: fresh, learning: learning, all: act };
  }
  /* mode: "mix" | "box" | "new" | "unit" */
  function planSession(opts) {
    opts = opts || {};
    var minutes = opts.minutes || 5;
    var n = Math.max(5, Math.round(minutes * 60 / SEC_PER_ITEM));
    var p = pools(), out = [];
    if (opts.unit) {
      var list = words.filter(function (w) { return w.unit === opts.unit; });
      out = shuffle(list).slice(0, Math.max(n, 10));
      return out;
    }
    if (opts.mode === "box") { out = p.box.slice(0, n); if (out.length < 5) out = out.concat(p.due.slice(0, n - out.length)); return shuffle(out); }
    if (opts.mode === "new") {
      var left = Math.max(0, state.settings.newPerDay - state.daily.newSeen);
      out = p.fresh.slice(0, Math.min(n, left || n));
      return out;
    }
    var wantBox = Math.round(n * 0.25), wantNew = Math.round(n * 0.25);
    var newLeft = Math.max(0, state.settings.newPerDay - state.daily.newSeen);
    wantNew = Math.min(wantNew, newLeft, p.fresh.length);
    var takeBox = p.box.slice(0, Math.min(wantBox, p.box.length));
    var takeNew = p.fresh.slice(0, wantNew);
    var rest = n - takeBox.length - takeNew.length;
    var takeDue = p.due.slice(0, rest);
    if (takeDue.length < rest) takeDue = takeDue.concat(p.learning.slice(0, rest - takeDue.length));
    if (takeDue.length + takeBox.length + takeNew.length < Math.min(n, p.all.length))
      takeNew = takeNew.concat(p.fresh.slice(wantNew, wantNew + (n - takeDue.length - takeBox.length - takeNew.length)));
    out = shuffle(takeBox.concat(takeDue));
    // neue Wörter gleichmäßig einstreuen, nie zwei direkt hintereinander
    takeNew.forEach(function (w, i) {
      var pos = Math.min(out.length, Math.round((i + 0.5) * (out.length + takeNew.length) / Math.max(1, takeNew.length)));
      out.splice(pos, 0, w);
    });
    return out.slice(0, n);
  }

  /* ---------- Fortschritt, Level, Belohnungen ---------- */
  function rankOf(xp) {
    var r = RANKS[0], next = null;
    for (var i = 0; i < RANKS.length; i++) { if (xp >= RANKS[i].xp) { r = RANKS[i]; next = RANKS[i + 1] || null; } }
    return { rank: r, next: next, into: xp - r.xp, span: next ? next.xp - r.xp : 0 };
  }
  function addXp(v) { state.xp += v; state.daily.xp += v; }
  function addCoins(v) { state.coins += v; }

  function bumpMission(type, amount) {
    var hit = [];
    state.daily.missions.forEach(function (m) {
      if (m.done || m.type !== type) return;
      m.p = type === "chain" ? Math.max(m.p, amount) : m.p + amount;
      if (m.p >= m.goal) { m.done = true; addCoins(m.coins); hit.push(m); }
    });
    return hit;
  }
  function checkBadges() {
    var got = [], have = state.badges;
    function give(id) {
      var def = BADGES.filter(function (b) { return b.id === id; })[0];
      if (!def || have.indexOf(id) >= 0) return;
      have.push(id); got.push(def);
    }
    var seen = 0, mastered = 0;
    for (var id in state.w) { if (state.w[id].reps || state.w[id].no) seen++; if (levelOf(id) === 4) mastered++; }
    if (state.totals.sentOk >= 20) give("sent20");
    if (state.totals.sentOk >= 75) give("sent75");
    if (seen >= 1) give("start");
    if (seen >= 50) give("w50");
    if (seen >= 150) give("w150");
    if (mastered >= 25) give("m25");
    if (mastered >= 100) give("m100");
    if (state.streak.count >= 7) give("streak7");
    if (state.streak.count >= 30) give("streak30");
    if (Object.keys(state.history).length + 1 >= 5) give("early");
    if (seen > 20 && pools().box.length === 0) give("box0");
    var uDone = units.some(function (u) {
      return u.words.length > 0 && u.words.every(function (w, i) { return levelOf(u.id + "#" + i) === 4; });
    });
    if (uDone) give("unit1");
    return got;
  }
  function finishSession(res) {
    // res: {items, correct, sec, maxChain, newSeen, boxSolved}
    var d = state.daily;
    d.items += res.items; d.correct += res.correct; d.sec += res.sec; d.newSeen += res.newSeen || 0;
    state.totals.items += res.items; state.totals.correct += res.correct; state.totals.sec += res.sec;
    var rewards = { coins: 0, missions: [], badges: [], goalReached: false, streakUp: false };
    rewards.missions = rewards.missions
      .concat(bumpMission("items", res.items))
      .concat(bumpMission("box", res.boxSolved || 0))
      .concat(bumpMission("new", res.newSeen || 0))
      .concat(bumpMission("chain", res.maxChain || 0))
      .concat(bumpMission("master", res.mastered || 0))
      .concat(bumpMission("sent", res.sentOk || 0));
    var goalSec = state.settings.goalMin * 60;
    if (d.sec >= goalSec && !d.done) {
      d.done = true; rewards.goalReached = true; addCoins(20); rewards.coins += 20;
      rewards.missions = rewards.missions.concat(bumpMission("goal", 1));
      if (state.streak.last !== d.date) {
        state.streak.count += 1; state.streak.last = d.date;
        state.streak.best = Math.max(state.streak.best, state.streak.count);
        rewards.streakUp = true;
        if (state.streak.count % 5 === 0) state.streak.freezes = Math.min(3, state.streak.freezes + 1);
      }
    }
    if (res.items >= 8 && res.correct === res.items) {
      if (state.badges.indexOf("clean") < 0) { state.badges.push("clean"); rewards.badges.push(BADGES.filter(function (b) { return b.id === "clean"; })[0]); }
    }
    if ((res.maxChain || 0) >= 15 && state.badges.indexOf("chain15") < 0) {
      state.badges.push("chain15"); rewards.badges.push(BADGES.filter(function (b) { return b.id === "chain15"; })[0]);
    }
    rewards.badges = rewards.badges.concat(checkBadges());
    rewards.missions.forEach(function (m) { rewards.coins += m.coins; });
    save(true);
    return rewards;
  }

  /* ---------- Statistik ---------- */
  function stats() {
    var act = activeWords(), dist = [0, 0, 0, 0, 0], ok = 0, no = 0;
    act.forEach(function (w) { dist[levelOf(w.id)]++; var r = state.w[w.id]; if (r) { ok += r.ok; no += r.no; } });
    var d14 = [], t = new Date();
    for (var i = 13; i >= 0; i--) {
      var dt = new Date(t.getTime() - i * 86400000), k = today(dt);
      var h = (state.daily && state.daily.date === k) ? state.daily : state.history[k];
      d14.push({ date: k, label: ["So","Mo","Di","Mi","Do","Fr","Sa"][dt.getDay()], items: h ? h.items : 0, sec: h ? h.sec : 0, correct: h ? h.correct : 0 });
    }
    var perUnit = units.filter(function (u) { return u.track === state.settings.track || u.track === "eigen"; }).map(function (u) {
      var m = 0, s = 0;
      u.words.forEach(function (w, i) { var l = levelOf(u.id + "#" + i); if (l === 4) m++; if (l > 0) s++; });
      return { id: u.id, title: u.title, icon: u.icon || "📘", k: u.k, track: u.track, total: u.words.length, mastered: m, seen: s };
    });
    var weak = Object.keys(state.w).filter(function (id) { return byId[id] && state.w[id].no > 0 && levelOf(id) < 3; })
      .map(function (id) { return { w: byId[id], r: state.w[id] }; })
      .sort(function (a, b) { return (b.r.no - a.r.no) || (a.r.ok - b.r.ok); }).slice(0, 25);
    return {
      dist: dist, total: act.length, ok: ok, no: no,
      acc: ok + no ? Math.round(ok * 100 / (ok + no)) : 0,
      d14: d14, perUnit: perUnit, weak: weak,
      boxSize: pools().box.length, dueNow: pools().due.length, sent: sentenceStats(),
      days: Object.keys(state.history).length + (state.daily && state.daily.items ? 1 : 0)
    };
  }

  /* ---------- CSV-Import / Export ---------- */
  function parseCsv(text, title) {
    var lines = text.replace(/\r/g, "").split("\n").filter(function (l) { return l.trim().length; });
    var sep = (lines[0].split(";").length > lines[0].split(",").length) ? ";" : (lines[0].split("\t").length > 1 ? "\t" : ",");
    var out = [], skipped = 0;
    lines.forEach(function (l, i) {
      var c = l.split(sep).map(function (x) { return x.trim().replace(/^"|"$/g, ""); });
      if (i === 0 && /^(en|english|englisch)$/i.test(c[0])) return;
      if (c.length < 2 || !c[0] || !c[1]) { skipped++; return; }
      out.push([c[0], c[1], Number(c[3]) || 2, c[2] || ""]);
    });
    if (!out.length) return { error: "Keine gültigen Zeilen gefunden." };
    var unit = { k: 0, track: "eigen", id: "eigen-" + Date.now().toString(36), title: title || "Eigene Liste", icon: "📝", words: out };
    state.custom.push(unit); buildCatalogue(state); save(true);
    return { unit: unit, count: out.length, skipped: skipped };
  }
  function removeCustom(id) {
    state.custom = state.custom.filter(function (u) { return u.id !== id; });
    state.settings.units = state.settings.units.filter(function (u) { return u !== id; });
    buildCatalogue(state); save(true);
  }
  function exportProgress() { return JSON.stringify(state); }
  function importProgress(text) {
    try {
      var p = JSON.parse(text);
      if (!p || p.v !== 2) return { error: "Das ist kein gültiger Lernstand." };
      state = Object.assign(freshState(), p); buildCatalogue(state); rollDay(); save(true);
      return { ok: true };
    } catch (e) { return { error: "Die Datei konnte nicht gelesen werden." }; }
  }
  function exportCsv() {
    var rows = ["englisch;deutsch;einheit;stufe;richtig;falsch;naechste_wiederholung"];
    activeWords().forEach(function (w) {
      var r = state.w[w.id] || { ok: 0, no: 0, due: 0 };
      rows.push([w.en, w.de, w.unitTitle, LEVELS[levelOf(w.id)].n, r.ok, r.no,
        r.due ? new Date(r.due).toISOString().slice(0, 10) : "-"].join(";"));
    });
    return rows.join("\n");
  }
  function resetProgress() { var keep = state.custom, st = state.settings; state = freshState(); state.custom = keep; state.settings = st; buildCatalogue(state); rollDay(); save(true); }
  function setTrack(t) { state.settings.track = t; state.settings.units = []; save(true); }

  /* ---------- Shop ---------- */
  function buy(id) {
    var it = SHOP.filter(function (s) { return s.id === id; })[0];
    if (!it) return { error: "Unbekannt." };
    if (state.profile.owned.indexOf(id) >= 0) return { error: "Gehört dir schon." };
    if (state.coins < it.cost) return { error: "Dafür fehlen noch " + (it.cost - state.coins) + " Münzen." };
    state.coins -= it.cost; state.profile.owned.push(id);
    if (it.kind === "avatar") state.profile.avatar = it.val; else state.profile.theme = it.val;
    save(true); return { ok: true, item: it };
  }

  global.VT = {
    LEVELS: LEVELS, RANKS: RANKS, AVATARS: AVATARS, SHOP: SHOP, BADGES: BADGES,
    SEC_PER_ITEM: SEC_PER_ITEM,
    load: load, save: save, get state() { return state; },
    units: function () { return units; }, words: function () { return words; }, byId: function (id) { return byId[id]; },
    buildCatalogue: function () { return buildCatalogue(state); },
    levelOf: levelOf, grade: grade, inErrorBox: inErrorBox, rec: rec,
    pools: pools, planSession: planSession, activeWords: activeWords,
    sentences: function () { return sentences; }, activeSentences: activeSentences,
    planSentences: planSentences, gradeSentence: gradeSentence, sentenceStats: sentenceStats,
    srec: srec, groupsOf: groupsOf, setTrack: setTrack,

    stats: stats, today: today, shuffle: shuffle, regenHearts: regenHearts, heartsIn: heartsIn,

})(window);

<script>/* Wordbook – Oberfläche, Übungstypen, Session-Ablauf */
(function (global) {
  "use strict";
  var S = global.VT, view = document.getElementById("view"), tabs = document.getElementById("tabs"),
      sessionEl = document.getElementById("session"), tab = "home", detailUnit = null;

  /* ---------- Werkzeug ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function toast(msg, ms) {
    var t = document.createElement("div"); t.className = "toast pop"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, ms || 2600);
  }
  function plural(n, a, b) { return n === 1 ? a : b; }
  function fmtMin(sec) { var m = Math.round(sec / 60); return m < 1 ? "unter 1 Min" : m + " Min"; }

  /* ---------- Installation ---------- */
  var installPrompt = null;
  global.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); installPrompt = e;
    if (tab === "parent") render();
  });
  global.addEventListener("appinstalled", function () { installPrompt = null; toast("Wordy ist jetzt installiert."); });
  function isStandalone() {
    try {
      return global.matchMedia("(display-mode: standalone)").matches || global.navigator.standalone === true;
    } catch (e) { return false; }
  }
  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function installCard() {
    if (isStandalone()) return '<section class="card"><div class="eyebrow" style="color:var(--good)">Installiert</div>' +
      '<p class="small muted" style="margin:8px 0 0">Wordy läuft als App. Der Lernstand bleibt auf diesem Gerät gespeichert, auch offline.</p></section>';
    if (installPrompt) return '<section class="card"><div class="eyebrow">Als App installieren</div>' +
      '<p class="small muted" style="margin:8px 0 10px">Dann liegt Wordy als Symbol auf dem Startbildschirm, startet im Vollbild und funktioniert ohne Netz.</p>' +
      '<button class="btn" data-act="install">Auf dem Gerät installieren</button></section>';
    if (isIOS()) return '<section class="card"><div class="eyebrow">Als App installieren</div>' +
      '<p class="small muted" style="margin:8px 0 0">In Safari unten auf das Teilen-Symbol tippen und „Zum Home-Bildschirm“ wählen. Danach startet Wordy im Vollbild und läuft auch ohne Netz.</p></section>';
    return '<section class="card"><div class="eyebrow">Als App installieren</div>' +
      '<p class="small muted" style="margin:8px 0 0">Im Browsermenü gibt es dafür „Installieren“ oder „Zum Startbildschirm hinzufügen“. Offline funktioniert Wordy, sobald es über eine Adresse geöffnet wird und nicht als lose Datei.</p></section>';
  }

  /* ---------- Aussprache ---------- */
  var voice = null, voicesReady = false;
  function pickVoice() {
    if (!window.speechSynthesis) return null;
    var v = window.speechSynthesis.getVoices() || [];
    if (!v.length) return null;
    voice = v.filter(function (x) { return /^en[-_]GB/i.test(x.lang); })[0] ||
            v.filter(function (x) { return /^en/i.test(x.lang); })[0] || null;
    voicesReady = true; return voice;
  }
  if (window.speechSynthesis) {
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(text, rate) {
    if (!S.state.settings.audio || !window.speechSynthesis) return false;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text).replace(/^to\s+/i, ""));
      if (!voicesReady) pickVoice();
      if (voice) u.voice = voice;
      u.lang = (voice && voice.lang) || "en-GB";
      u.rate = rate || 0.92;
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  function audioAvailable() { return !!(window.speechSynthesis && S.state.settings.audio); }

  /* ---------- Textvergleich ---------- */
  function norm(s) {
    return String(s).toLowerCase().replace(/^to\s+/, "").replace(/^(a|an|the)\s+/, "")
      .replace(/[.,!?;:'"´`]/g, "").replace(/\s+/g, " ").trim();
  }
  function lev(a, b) {
    var m = a.length, n = b.length, d = [], i, j;
    for (i = 0; i <= m; i++) d[i] = [i];
    for (j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[m][n];
  }
  function judgeTyped(input, target) {
    var a = norm(input), alts = String(target).split(/\s*[\/,]\s*/).map(norm).filter(Boolean);
    if (!a) return 0;
    if (alts.indexOf(a) >= 0) return 2;
    for (var i = 0; i < alts.length; i++) {
      var d = lev(a, alts[i]);
      if (d <= (alts[i].length > 6 ? 2 : 1)) return 1;
    }
    return 0;
  }

  /* ---------- Kopfzeile ---------- */
  function renderHeader() {
    var st = S.state, r = S.rankOf(st.xp);

    if (!st.settings.hearts) { hEl.textContent = "∞"; hEl.title = "Ohne Herzen"; }
    else { S.regenHearts(); hEl.innerHTML = "<span style='color:var(--bad)'>" + "♥".repeat(st.hearts) + "</span><span style='color:var(--line)'>" + "♥".repeat(5 - st.hearts) + "</span>"; }
    document.documentElement.setAttribute("data-accent", st.profile.theme || "paper");
  }

  function trackSwitch() {
    var t = S.state.settings.track;
    return '<div class="seg" role="group" aria-label="Lernbereich">' +

  }
  function groupLabel(k) { return typeof k === "number" ? "Klasse " + k : k; }

  /* ================= START ================= */
  function viewHome() {

    var hour = new Date().getHours();
    var biz = st.settings.track === "business";
    var tip = pct >= 100 ? "Tagesziel geschafft. Alles Weitere ist Bonus."
      : st.daily.sec > 0 ? "Noch " + fmtMin(goalSec - st.daily.sec) + " bis zum Tagesziel."
      : biz ? (hour < 12 ? "Fünf Minuten vor dem ersten Termin?" : "Eine kurze Runde zwischen zwei Meetings.")
      : hour < 12 ? "Eine kurze Runde vor der Schule?" : "Fünf Minuten reichen für heute.";

    var html = '<div class="stack">';
    html += '<section class="card hero"><div class="inner"><div class="row" style="align-items:flex-start">' +
      '<div style="flex:1 1 auto;min-width:0"><div class="eyebrow">' + esc(S.today().split("-").reverse().join(".")) +
      ' · ' + (st.settings.track === "business" ? "Business English" : "Schule") + '</div>' +
      '<h1>' + greet + '</h1><p class="muted small" style="margin:6px 0 0">' + esc(tip) + '</p></div>' +
      '<div class="ring" style="--p:' + pct + '"><span class="tnum">' + pct + '%</span></div></div>' +
      '<div class="row wrap small muted" style="margin-top:12px;gap:14px">' +
      '<span>🔥 ' + st.streak.count + ' ' + plural(st.streak.count, "Tag", "Tage") + (st.streak.best > st.streak.count ? ' · Bestwert ' + st.streak.best : '') + '</span>' +
      '<span>🛡️ ' + st.streak.freezes + ' Streak-Schutz</span>' +
      (r.next ? '<span>Noch ' + toNext + ' XP bis ' + esc(r.next.n) + '</span>' : '<span>Höchster Rang erreicht</span>') +
      '</div></div></section>';

    html += '<section class="card"><div class="eyebrow">Wie viel Zeit hast du?</div>' +
      '<div class="quick" style="margin-top:10px">' +
      [3, 5, 10, 15].map(function (m) {
        return '<button data-act="start" data-min="' + m + '">' + m + ' Min<small>' + Math.round(m * 60 / S.SEC_PER_ITEM) + ' Aufgaben</small></button>';
      }).join("") + '</div>' +
      '<button class="btn wide lg" data-act="start" data-min="' + st.settings.goalMin + '" style="margin-top:12px">Weiterlernen</button>' +
      '<p class="small muted" style="margin:10px 0 0">' + (p.due.length ? p.due.length + ' ' + plural(p.due.length, "Wort ist", "Wörter sind") + ' zur Wiederholung dran' : "Keine Wiederholung fällig – du kannst neue Wörter kennenlernen") + '.</p>' +
      '</section>';

    if (p.box.length) {
      html += '<section class="card"><div class="row"><div style="flex:1 1 auto"><div class="eyebrow" style="color:var(--margin)">Fehlerkartei</div>' +
        '<h2 style="font-size:19px">' + p.box.length + ' ' + plural(p.box.length, "Wort macht", "Wörter machen") + ' noch Probleme</h2>' +
        '<p class="small muted" style="margin:4px 0 0">Diese Wörter kommen automatisch häufiger dran.</p></div></div>' +

    }

    html += '<section class="card"><div class="eyebrow">Heutige Missionen</div><div style="margin-top:6px">' +
      st.daily.missions.map(function (m) {
        var pc = Math.min(100, Math.round(m.p * 100 / m.goal));
        return '<div class="mission' + (m.done ? " done" : "") + '"><div class="tick">✓</div>' +
          '<div class="txt"><div class="small" style="font-weight:600">' + esc(m.n) + '</div>' +
          '<div class="bar"><i style="width:' + pc + '%"></i></div></div>' +
          '<div class="pill">🪙 ' + m.coins + '</div></div>';
      }).join("") + '</div></section>';

    var sn = stt.sent;
    html += '<section class="card"><div class="row"><div style="flex:1 1 auto"><div class="eyebrow">Satzbau</div>' +
      '<h2 style="font-size:19px">' + sn.seen + ' von ' + sn.total + ' Sätzen geübt</h2>' +
      '<p class="small muted" style="margin:4px 0 0">' + (st.settings.track === "business"
        ? "Wendungen aus Meetings, E-Mails und Verhandlungen – in der richtigen Wortstellung."

      '<button class="btn ghost wide" data-act="start" data-mode="sent" data-min="5" style="margin-top:12px">Nur Sätze üben</button></section>';

    var mastered = stt.dist[4], nextMile = Math.ceil((mastered + 1) / 25) * 25;
    html += '<section class="card"><div class="eyebrow">Dein Können</div>' +
      '<div class="row" style="margin-top:8px;gap:16px"><div><div style="font-family:Newsreader,serif;font-size:30px;font-weight:600" class="tnum">' + mastered + '</div>' +
      '<div class="small muted">Wörter sitzen langfristig</div></div>' +

  /* ================= ARENA ================= */
  function viewArena() {
    var st = S.state, p = S.pools(), few = p.all.length < 8;

    html += '<section class="card hero"><div class="inner">' +
      '<div class="eyebrow">Arena · ' + (st.settings.track === "business" ? "Business English" : "Schule") + '</div>' +

      '<p class="muted small" style="margin:6px 0 0">Vier kurze Modi für schnelles Wiederholen. Alles, was du hier triffst, zählt für deinen Lernstand mit – und die Zeit läuft aufs Tagesziel.</p>' +
      '</div></section>';

        '</button>';

      (plays ? '<p class="small muted" style="margin:10px 0 0">Bisher ' + plays + ' ' + plural(plays, "Runde", "Runden") + ' gespielt.</p>' : "") +
      '</section>';
    html += '</div>';
    view.innerHTML = html;
  }

  /* ================= EINHEITEN ================= */
  function viewUnits() {
    var st = S.state, stt = S.stats();
    if (detailUnit) return viewUnitDetail(detailUnit);
    var biz = st.settings.track === "business";
    var groups = biz ? ["Basis", "Aufbau", "Profi", "Smalltalk", "Redewendungen"] : [6, 7, 8];
    var sel = S.groupsOf();
    var html = '<div class="stack">';
    html += '<section class="card">' + trackSwitch() +
      '<div class="eyebrow" style="margin-top:14px">' + (biz ? "Stufe" : "Schuljahr") + '</div>' +

      groups.map(function (k) {

        : "Gewählte Jahrgänge kommen im Training vor. Einzelne Einheiten kannst du unten gezielt üben.") + '</p></section>';

    var byGroup = {}, order = [];

            '<span class="ic">' + esc(u.icon) + '</span><span class="t"><b>' + esc(u.title) + '</b>' +
            '<span class="bar" style="margin-top:6px;display:block"><i style="width:' + pc + '%"></i></span></span>' +
            '<span class="pill tnum">' + u.mastered + '/' + u.total + '</span></button>';
        }).join("") + '</div></section>';
    });
    html += '</div>';
    view.innerHTML = html;
  }
  function viewUnitDetail(id) {
    var u = S.units().filter(function (x) { return x.id === id; })[0];
    if (!u) { detailUnit = null; return viewUnits(); }
    var mastered = 0;
    var rows = u.words.map(function (w, i) {
      var wid = u.id + "#" + i, lv = S.levelOf(wid), r = S.state.w[wid];

        '<span class="en">' + esc(w[0]) + '</span><span class="de">' + esc(w[1]) + '</span>' +
        (r && r.no ? '<span class="pill" title="Fehler">✗ ' + r.no + '</span>' : '') +
        '<span class="pill l' + lv + '">' + esc(S.LEVELS[lv].n) + '</span></div>';
    }).join("");
    view.innerHTML = '<div class="stack">' +

  /* ================= SESSION ================= */
  var SS = null;
  function pickType(w) {
    var lv = S.levelOf(w.id), c;
    if (lv <= 1) c = ["mc_en_de", "mc_de_en", "listen", "odd"];
    else if (lv === 2) c = ["mc_de_en", "gap", "match", "listen", "spell", "odd"];
    else c = ["type", "spell", "gap", "match", "type"];
    c = c.filter(function (t) { return t !== "gap" || w.gap; });
    var plain = w.en.replace(/^to\s+/, "");
    if (plain.length > 16) c = c.filter(function (t) { return t !== "spell"; });
    if (plain.length > 24) c = c.filter(function (t) { return t !== "type"; });
    if (!audioAvailable()) c = c.filter(function (t) { return t !== "listen"; });
    if (!c.length) c = ["mc_en_de"];
    return c[Math.floor(Math.random() * c.length)];
  }
  function distractors(w, key, n) {
    var pool = S.words().filter(function (x) { return x.id !== w.id && x[key] !== w[key]; });
    var same = pool.filter(function (x) { return x.unit === w.unit; });
    var out = S.shuffle(same).slice(0, n);
    if (out.length < n) out = out.concat(S.shuffle(pool).slice(0, n - out.length));
    var seen = {}; return out.filter(function (x) { if (seen[x[key]]) return false; seen[x[key]] = 1; return true; }).slice(0, n);
  }
  function buildTasks(list, sentOnly) {
    var t = [];
    if (!sentOnly) list.forEach(function (w) {
      if (S.levelOf(w.id) === 0 && !(S.state.w[w.id] && S.state.w[w.id].no)) {
        t.push({ type: "intro", w: w }); t.push({ type: "mc_en_de", w: w, isNew: true });
      } else t.push({ type: pickType(w), w: w });
    });
    var want = sentOnly ? Math.max(4, list.length) : Math.round(t.length / 8);
    var sents = S.planSentences(want);
    if (sentOnly) return sents.map(function (x) { return { type: "build", s: x }; });
    sents.forEach(function (x, i) {
      var pos = Math.min(t.length, Math.round((i + 1) * t.length / (sents.length + 1)) + 1);
      t.splice(pos, 0, { type: "build", s: x });
    });
    return t;
  }
  function startSession(opts) {
    S.rollDay(); S.regenHearts();
    var sentOnly = opts.mode === "sent";
    var list = sentOnly ? S.planSentences(Math.max(5, Math.round((opts.minutes || 5) * 60 / 16))) : S.planSession(opts);
    if (!list.length) { toast(sentOnly ? "Alle Sätze dieses Bereichs sind gerade erledigt." : "Für diese Auswahl gibt es gerade nichts zu üben."); return; }
    var tasks = buildTasks(list, sentOnly);
    if (!tasks.length) { toast("Hier gibt es gerade nichts zu üben."); return; }
    SS = {
      tasks: tasks, i: 0, chain: 0, maxChain: 0, items: 0, correct: 0,
      newSeen: 0, boxSolved: 0, mastered: 0, sentOk: 0, start: Date.now(), answered: false,
      retry: [], mode: opts.mode || "mix", ended: false
    };
    sessionEl.hidden = false; document.body.style.overflow = "hidden";
    renderTask();
  }
  function endSession(reason) {
    if (!SS || SS.ended) return;
    SS.ended = true;
    var sec = Math.round((Date.now() - SS.start) / 1000);
    var rw = S.finishSession({ items: SS.items, correct: SS.correct, sec: sec, maxChain: SS.maxChain, newSeen: SS.newSeen, boxSolved: SS.boxSolved, mastered: SS.mastered, sentOk: SS.sentOk });
    var st = S.state, acc = SS.items ? Math.round(SS.correct * 100 / SS.items) : 0;
    var head = reason === "hearts" ? "Kurze Pause" : SS.correct === SS.items && SS.items > 3 ? "Fehlerfrei!" : "Runde geschafft";
    var msg = reason === "hearts"
      ? "Die Herzen sind alle. Dein Fortschritt ist gespeichert – die Herzen füllen sich von selbst wieder auf."
      : acc >= 90 ? "Das saß. Weiter so." : acc >= 70 ? "Solide Runde. Die Wackelkandidaten kommen bald wieder." : "Schwierige Wörter dabei – die landen jetzt in der Fehlerkartei und kommen häufiger dran.";
    var html = '<div class="sbody"><div class="stack" style="padding-top:20px">' +
      '<section class="card" style="text-align:center"><div style="font-size:40px">' + (reason === "hearts" ? "💤" : acc >= 90 ? "🌟" : "✅") + '</div>' +
      '<h1 style="font-size:26px;margin-top:6px">' + head + '</h1><p class="muted small" style="margin:8px 0 0">' + esc(msg) + '</p>' +
      '<div class="tiles4" style="margin-top:16px">' +
      '<div class="kpi"><b class="tnum">' + SS.items + '</b><span>Aufgaben</span></div>' +
      '<div class="kpi"><b class="tnum">' + acc + '%</b><span>richtig</span></div>' +
      '<div class="kpi"><b class="tnum">' + SS.maxChain + '</b><span>beste Serie</span></div>' +
      '<div class="kpi"><b class="tnum">' + fmtMin(sec).replace(" Min", "") + '</b><span>Minuten</span></div></div></section>';
    if (SS.sentOk) html += '<section class="card"><div class="eyebrow">Satzbau</div><p style="margin:6px 0 0">' + SS.sentOk + ' ' + plural(SS.sentOk, "Satz", "Sätze") + ' richtig zusammengesetzt.</p></section>';
    if (SS.mastered) html += '<section class="card"><div class="eyebrow" style="color:var(--gold)">Neu gemeistert</div><p style="margin:6px 0 0">' + SS.mastered + ' ' + plural(SS.mastered, "Wort sitzt", "Wörter sitzen") + ' jetzt langfristig.</p></section>';
    if (rw.goalReached) html += '<section class="card"><div class="eyebrow" style="color:var(--good)">Tagesziel erreicht</div><p style="margin:6px 0 0">' + (rw.streakUp ? "Streak steht bei " + st.streak.count + " " + plural(st.streak.count, "Tag", "Tagen") + "." : "Schon erledigt heute.") + '</p></section>';
    if (rw.missions.length) html += '<section class="card"><div class="eyebrow">Missionen erfüllt</div>' + rw.missions.map(function (m) { return '<div class="mission done"><div class="tick">✓</div><div class="txt small">' + esc(m.n) + '</div><span class="pill">🪙 ' + m.coins + '</span></div>'; }).join("") + '</section>';
    if (rw.badges.length) html += '<section class="card"><div class="eyebrow">Neue Abzeichen</div><div class="badges" style="margin-top:8px">' + rw.badges.map(function (b) { return '<div class="badge"><div class="g">🏅</div><b>' + esc(b.n) + '</b></div>'; }).join("") + '</div></section>';
    html += '<div class="row" style="gap:8px"><button class="btn wide" data-act="again">Noch eine Runde</button>' +
      '<button class="btn ghost" data-act="close">Fertig</button></div></div></div>';
    sessionEl.innerHTML = html;
    renderHeader();
  }
  function closeSession() {
    sessionEl.hidden = true; sessionEl.innerHTML = ""; SS = null;
    document.body.style.overflow = "";
    render();
  }

  function renderTask() {
    if (!SS) return;
    if (SS.i >= SS.tasks.length) {
      if (SS.retry.length) { SS.tasks = SS.tasks.concat(SS.retry); SS.retry = []; }
      else return endSession("done");
    }
    var t = SS.tasks[SS.i]; if (!t) return endSession("done");
    SS.answered = false; SS.pick = null;
    var st = S.state, total = SS.tasks.length, pc = Math.round(SS.i * 100 / total);
    var hearts = st.settings.hearts ? '<span class="hearts" style="color:var(--bad)">' + "♥".repeat(st.hearts) + '</span><span class="hearts" style="color:var(--line)">' + "♥".repeat(5 - st.hearts) + '</span>' : '<span class="pill">ohne Herzen</span>';
    var head = '<div class="shead"><button class="chip" data-act="quit">✕</button>' +
      '<div class="bar" style="flex:1 1 auto"><i style="width:' + pc + '%"></i></div>' + hearts + '</div>';
    sessionEl.innerHTML = head + '<div class="sbody" id="sbody"></div><div class="sfoot" id="sfoot"></div>';
    var body = $("#sbody"), foot = $("#sfoot");
    body.className = "sbody pop";
    (RENDER[t.type] || RENDER.mc_en_de)(t, body, foot);
  }

  function footCheck(label, act) {
    return '<button class="btn wide lg" data-act="' + (act || "check") + '" id="mainBtn" disabled>' + esc(label || "Prüfen") + '</button>';
  }
  function optionList(items, keyLabels) {
    return '<div class="opts">' + items.map(function (o, i) {
      return '<button class="opt" data-opt="' + i + '"><span class="k">' + (i + 1) + '</span><span>' + esc(o.label) + '</span></button>';
    }).join("") + '</div>';

  function speakBtn(text, big) {
    return '<button class="speak' + (big ? " big" : "") + '" data-act="say" data-text="' + esc(text) + '" aria-label="Wort anhören">🔊</button>';
  }

  var RENDER = {
    intro: function (t, body, foot) {
      var w = t.w;

    listen: function (t, body, foot) {

    gap: function (t, body, foot) {

        .concat([{ label: w.gap, ok: true }]));
