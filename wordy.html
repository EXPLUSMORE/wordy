<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6273">
<title>Wordy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#EEF2F8; --card:#FFFFFF; --card-2:#F7F9FC;
  --ink:#16223A; --ink-2:#4B5B78; --ink-3:#8593AB;
  --rule:#C9D7EA; --line:#DEE6F1; --shadow:0 1px 2px rgba(22,34,58,.06),0 8px 24px rgba(22,34,58,.06);
  --accent:#1E6273; --accent-ink:#ffffff; --accent-soft:#DCEDF1;
  --good:#2C7A57; --good-soft:#DCF0E6; --bad:#B8403B; --bad-soft:#FAE3E1;
  --gold:#A9781F; --margin:#C2413A;
  --r:14px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0E131C; --card:#161D29; --card-2:#1B2431;
  --ink:#E7EDF8; --ink-2:#A7B5CC; --ink-3:#74839B;
  --rule:#27344703; --rule:#253246; --line:#222C3B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --accent:#4FA8BE; --accent-ink:#06121A; --accent-soft:#16323C;
  --good:#63C79A; --good-soft:#152F26; --bad:#E7817B; --bad-soft:#331C1B;
  --gold:#D8A445; --margin:#E07A73;
}}
:root[data-theme="dark"]{
  --paper:#0E131C; --card:#161D29; --card-2:#1B2431;
  --ink:#E7EDF8; --ink-2:#A7B5CC; --ink-3:#74839B;
  --rule:#253246; --line:#222C3B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --accent:#4FA8BE; --accent-ink:#06121A; --accent-soft:#16323C;
  --good:#63C79A; --good-soft:#152F26; --bad:#E7817B; --bad-soft:#331C1B;
  --gold:#D8A445; --margin:#E07A73;
}
/* Farbwelten (Shop): färben Akzent, Hintergrund und Linien; Hell- und Dunkelvariante.
   Stehen nach den Grundfarben und sind spezifischer, damit sie auch im Dunkelmodus greifen. */
:root[data-accent="mint"]:not([data-x]){ --paper:#E8F4EC; --card-2:#F2FAF5; --rule:#BFDCCB; --line:#D6EBDF; --accent:#2E7357; --accent-soft:#D9EEE2; }
:root[data-accent="plum"]:not([data-x]){ --paper:#F2EAF5; --card-2:#FAF4FB; --rule:#D9C6DF; --line:#E8DCEB; --accent:#6A3D70; --accent-soft:#EBDDEE; }
:root[data-accent="amber"]:not([data-x]){ --paper:#F6EEDF; --card-2:#FBF6EC; --rule:#E2CFAE; --line:#EDE1C8; --accent:#8A5A1B; --accent-soft:#F3E4CA; }
@media (prefers-color-scheme:dark){
:root[data-accent="mint"]:not([data-theme="light"]):not([data-x]){ --paper:#0C1612; --card:#13211A; --card-2:#182A21; --rule:#24392E; --line:#1E3127; --accent:#5CC59A; --accent-ink:#06140E; --accent-soft:#163025; }
:root[data-accent="plum"]:not([data-theme="light"]):not([data-x]){ --paper:#140E17; --card:#1D1522; --card-2:#241A2A; --rule:#3A2941; --line:#2E2136; --accent:#C48BD0; --accent-ink:#1A0B1E; --accent-soft:#31203A; }
:root[data-accent="amber"]:not([data-theme="light"]):not([data-x]){ --paper:#16110A; --card:#201910; --card-2:#282015; --rule:#41321B; --line:#332814; --accent:#E0A34A; --accent-ink:#1C1205; --accent-soft:#3A2B13; }
}
:root[data-theme="dark"][data-accent="mint"]:not([data-x]){ --paper:#0C1612; --card:#13211A; --card-2:#182A21; --rule:#24392E; --line:#1E3127; --accent:#5CC59A; --accent-ink:#06140E; --accent-soft:#163025; }
:root[data-theme="dark"][data-accent="plum"]:not([data-x]){ --paper:#140E17; --card:#1D1522; --card-2:#241A2A; --rule:#3A2941; --line:#2E2136; --accent:#C48BD0; --accent-ink:#1A0B1E; --accent-soft:#31203A; }
:root[data-theme="dark"][data-accent="amber"]:not([data-x]){ --paper:#16110A; --card:#201910; --card-2:#282015; --rule:#41321B; --line:#332814; --accent:#E0A34A; --accent-ink:#1C1205; --accent-soft:#3A2B13; }
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Karla,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;overflow:hidden}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.tnum{font-variant-numeric:tabular-nums}

/* Gerüst */
#app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;position:relative}
header#top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;-webkit-overflow-scrolling:touch}
nav#tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  border-top:1px solid var(--line);background:var(--card);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
nav#tabs button .ic{font-size:19px;line-height:1}
nav#tabs button{font-size:10.5px}
nav#tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}

/* Kopfzeile */
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
/* Rahmen um den Avatar (Shop) */
.avatar{position:relative}
.avatar.fr-gold{box-shadow:0 0 0 2.5px #E8B22B,0 0 10px 1px rgba(255,211,77,.7)}
.avatar.fr-rainbow{isolation:isolate}
.avatar.fr-rainbow::before{content:"";position:absolute;inset:-4px;border-radius:50%;z-index:-1;
  background:conic-gradient(#ff5d7a,#ffb84d,#ffe55c,#5dd68f,#4db8ff,#9a7bff,#ff5d7a);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.avatar.fr-fire{animation:frFire 1.1s ease-in-out infinite alternate}
@keyframes frFire{from{box-shadow:0 0 0 2px #FF8A3D,0 0 6px 1px rgba(255,120,40,.7),0 -4px 10px rgba(255,200,60,.5)}
  to{box-shadow:0 0 0 2.5px #FF5A2B,0 0 12px 3px rgba(255,90,30,.8),0 -7px 14px rgba(255,210,70,.6)}}
@media (prefers-reduced-motion:reduce){.avatar.fr-fire{animation:none;box-shadow:0 0 0 2.5px #FF7A33,0 0 8px 2px rgba(255,120,40,.6)}}
/* Hintergründe (Shop): liegen als feine Muster über der Papierfarbe */
html[data-bg="stars"] body{background-image:
  radial-gradient(2.4px 2.4px at 12% 18%,var(--bgdot) 50%,transparent 55%),radial-gradient(1.8px 1.8px at 78% 12%,var(--bgdot) 50%,transparent 55%),
  radial-gradient(2.6px 2.6px at 38% 62%,var(--bgdot) 50%,transparent 55%),radial-gradient(1.8px 1.8px at 88% 70%,var(--bgdot) 50%,transparent 55%),
  radial-gradient(2.2px 2.2px at 22% 90%,var(--bgdot) 50%,transparent 55%),radial-gradient(1.6px 1.6px at 60% 38%,var(--bgdot) 50%,transparent 55%);
  background-size:190px 190px;background-attachment:fixed}
html[data-bg="clouds"] body{background-image:
  radial-gradient(ellipse 80px 26px at 20% 14%,var(--bgblob),transparent 70%),radial-gradient(ellipse 100px 30px at 80% 32%,var(--bgblob),transparent 70%),
  radial-gradient(ellipse 90px 28px at 35% 70%,var(--bgblob),transparent 70%),radial-gradient(ellipse 110px 32px at 90% 88%,var(--bgblob),transparent 70%);
  background-size:380px 380px;background-attachment:fixed}
html[data-bg="space"] body{background-image:
  radial-gradient(circle at 85% 8%,rgba(255,215,120,.45) 0,transparent 100px),linear-gradient(180deg,rgba(90,70,170,.30),rgba(40,60,150,.14)),
  radial-gradient(2px 2px at 15% 25%,var(--bgstar) 50%,transparent 55%),radial-gradient(1.6px 1.6px at 70% 15%,var(--bgstar) 50%,transparent 55%),
  radial-gradient(2.4px 2.4px at 45% 55%,var(--bgstar) 50%,transparent 55%),radial-gradient(1.6px 1.6px at 90% 75%,var(--bgstar) 50%,transparent 55%),
  radial-gradient(1.8px 1.8px at 28% 85%,var(--bgstar) 50%,transparent 55%);
  background-size:auto,auto,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px;background-attachment:fixed}
html[data-bg="stars"],html[data-bg="clouds"],html[data-bg="space"]{--bgdot:color-mix(in srgb,var(--accent) 65%,transparent);--bgblob:color-mix(in srgb,var(--accent) 16%,transparent);--bgstar:rgba(255,255,255,.9)}
@media (prefers-color-scheme:light){html[data-bg="space"]{--bgstar:rgba(60,50,140,.55)}}
html[data-bg="space"][data-theme="light"]{--bgstar:rgba(60,50,140,.55)}
html[data-bg="space"][data-theme="dark"]{--bgstar:rgba(255,255,255,.9)}
/* Karten lassen das Muster leicht durchscheinen */
html[data-bg="stars"] .card,html[data-bg="clouds"] .card,html[data-bg="space"] .card{background:color-mix(in srgb,var(--card) 88%,transparent)}

/* Lektionsfinale */
.fin-in{animation:finUp .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes finUp{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.fin-top{position:relative;overflow:hidden}
.fin-hero{position:relative;width:96px;height:96px;margin:6px auto 4px;display:grid;place-items:center}
.fin-rays{position:absolute;inset:-46px;border-radius:50%;opacity:.9;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gold) 55%,transparent) 0 8deg,transparent 8deg 20deg);
  -webkit-mask:radial-gradient(circle,transparent 34%,#000 36%,transparent 70%);mask:radial-gradient(circle,transparent 34%,#000 36%,transparent 70%);
  animation:finSpin 14s linear infinite,finFade 1s ease-out both}
@keyframes finSpin{to{transform:rotate(360deg)}}
@keyframes finFade{from{opacity:0;transform:scale(.4)}to{opacity:.9}}
.fin-av{width:92px;height:92px;font-size:54px;position:relative;animation:finPop .8s cubic-bezier(.3,1.6,.4,1) both .1s}
.fin-av svg{width:60px;height:60px}
@keyframes finPop{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.fin-stars{display:flex;justify-content:center;gap:6px;margin-top:6px}
.fin-star{width:38px;height:38px;fill:var(--line);stroke:var(--rule);stroke-width:1}
.fin-star.on{fill:#FFC93C;stroke:#E0A800;filter:drop-shadow(0 0 6px rgba(255,201,60,.7));
  animation:finStar .6s cubic-bezier(.3,1.7,.4,1) both;animation-delay:calc(.9s + var(--i) * .28s)}
@keyframes finStar{0%{transform:scale(0) rotate(-120deg);opacity:0}70%{transform:scale(1.35) rotate(12deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.fin-stamp{position:absolute;right:10px;top:12px;z-index:2;padding:4px 10px;border:3px solid var(--bad);color:var(--bad);border-radius:8px;
  font-weight:800;letter-spacing:.08em;font-size:15px;transform:rotate(-9deg);animation:finStamp .5s cubic-bezier(.2,1.4,.4,1) both 1.2s}
@keyframes finStamp{0%{transform:scale(3) rotate(-25deg);opacity:0}70%{transform:scale(.94) rotate(-9deg);opacity:1}100%{transform:scale(1) rotate(-9deg);opacity:1}}
.fin-rankup{margin-top:12px;padding:12px;border-radius:12px;text-align:center;color:var(--accent-ink);background:linear-gradient(100deg,var(--accent) 30%,color-mix(in srgb,var(--gold) 60%,var(--accent)) 50%,var(--accent) 70%);
  background-size:250% 100%;display:none}
.fin-rankup span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.fin-rankup b{font-family:Newsreader,Georgia,serif;font-size:24px}
.fin-rankup.show{display:block;animation:finBanner .7s cubic-bezier(.2,1.4,.4,1) both,finShine 1.6s ease-in-out .3s 2}
@keyframes finBanner{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes finShine{from{background-position:120% 0}to{background-position:-60% 0}}
.fin-coin b{font-weight:700}
.fin-flame{font-size:34px;text-align:center;transform-origin:50% 90%}
.fin-flame.go{animation:finFlame .9s ease-in-out 3 .5s}
@keyframes finFlame{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.35) rotate(-8deg)}60%{transform:scale(1.2) rotate(7deg)}}
@media (prefers-reduced-motion:reduce){.fin-in,.fin-rays,.fin-av,.fin-star.on,.fin-stamp,.fin-rankup.show,.fin-flame.go{animation:none!important}.fin-rankup.show{display:block}}

/* Sticker */
.stk{position:relative;display:inline-block;width:var(--s,64px);height:var(--s,64px);transform:rotate(var(--r,0deg));filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));flex:0 0 auto;vertical-align:middle}
.stk-cut{position:absolute;inset:calc(var(--s) * .1);display:grid;place-items:center;font-size:calc(var(--s) * .6)}
.stk-cut svg{width:calc(var(--s) * .8);height:calc(var(--s) * .8);display:block}
.stk-holo{position:absolute;inset:calc(var(--s) * .1);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:100% 100%;mask-size:100% 100%;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 46%,rgba(120,255,240,.5) 50%,rgba(255,150,230,.5) 54%,transparent 64%) -150% 0/250% 100%;
  mix-blend-mode:screen;animation:stShine 3s ease-in-out infinite}
@keyframes stShine{0%{background-position:150% 0}55%,100%{background-position:-60% 0}}
.stk-row{display:inline-flex;gap:0;align-items:center}
.stk-row .stk+.stk{margin-left:-14px}
.stk-corner{position:absolute;right:10px;bottom:6px;z-index:2;pointer-events:none}
.stkbook .art{min-height:62px;display:grid;place-items:center}
.stkbook .album-i.off .art{filter:grayscale(1) brightness(.75);opacity:.5}
@media (prefers-reduced-motion:reduce){.stk-holo{animation:none}}
.fin-parts .row{padding:3px 0;border-top:1px solid var(--line)}
.rank-i{padding:8px 0;border-top:1px solid var(--line)}
.rank-i.cur{background:var(--accent-soft);border-radius:12px;padding:10px;border-top-color:transparent;margin:2px 0}
.rank-i.off{opacity:.6}
/* How-to im Setup */
.how{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.how-sum{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none}
.how-sum::-webkit-details-marker{display:none}
.how .chev{font-size:20px;color:var(--accent);transition:transform .2s;width:18px;text-align:center}
.how[open] .chev{transform:rotate(90deg)}
.how-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.how-list li{display:flex;gap:12px;align-items:flex-start}
.how-list .hi{font-size:22px;width:28px;text-align:center;flex:0 0 auto}
.how-list .small{line-height:1.5}
/* Shop und Sammelalbum */
.shopitem .si{font-size:20px;width:30px;text-align:center;flex:0 0 auto;display:grid;place-items:center}
.shopitem .si svg{width:30px;height:30px}
.shopitem .dot{display:inline-block;width:22px;height:22px;border-radius:50%}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.album-i{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);font:inherit;cursor:pointer}
.album-i .art{font-size:40px;line-height:1}
.album-i .art svg{width:46px;height:46px}
.album-i small{font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album-i .sub{font-weight:500;color:var(--ink-3)}
.album-i.on{border-color:var(--accent);background:var(--accent-soft)}
.album-i.off .art{filter:grayscale(1) brightness(.75) contrast(.9);opacity:.55}
.album-i.off{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--ink) 4%,transparent) 8px 16px)}

.stat{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font-weight:700}
.spacer{flex:1 1 auto}

/* Bausteine */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;letter-spacing:.01em;
  transition:transform .08s ease,filter .15s ease}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--accent-soft);color:var(--accent);font-weight:700}
.btn.wide{width:100%}
.btn.lg{padding:16px 20px;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.l0{color:var(--ink-3)} .pill.l1{color:var(--ink-2)}
.pill.l2{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.pill.l3{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.l4{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:transparent}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Start */
.hero{position:relative;overflow:hidden;background:
   linear-gradient(180deg,transparent 0 22px,var(--rule) 22px 23px,transparent 23px) 0 0/100% 23px repeat-y,var(--card)}
.hero:before{content:"";position:absolute;inset:0 auto 0 30px;width:1px;background:var(--margin);opacity:.5}
.hero .inner{padding-left:18px}
.hero h1{font-size:26px;line-height:1.15}
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring>span{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;
  font-weight:700;font-size:15px;color:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quick button{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);
  font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.quick button small{font-weight:600;font-size:11px;color:var(--ink-3)}
.mission{display:flex;align-items:center;gap:10px;padding:9px 0}
.mission+.mission{border-top:1px solid var(--line)}
.mission .txt{flex:1 1 auto;min-width:0}
.mission .bar{margin-top:5px}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:transparent}
.mission.done .tick{background:var(--good);border-color:var(--good);color:#fff}

/* Einheiten */
.unit{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.unit+.unit{border-top:1px solid var(--line)}
.unit .ic{width:38px;height:38px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.unit .t{flex:1 1 auto;min-width:0}
.unit .t b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wordrow{display:flex;align-items:baseline;gap:10px;padding:10px 0}

.wordrow .en{font-weight:700}
.mini-speak{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);

.wordrow .de{color:var(--ink-2);flex:1 1 auto;font-size:14px}

/* Session */
#session{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:20}
#session .shead{display:flex;align-items:center;gap:10px;padding:10px 16px}
#session .sbody{flex:1 1 auto;overflow-y:auto;padding:8px 16px 20px}
#session .sfoot{flex:0 0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.prompt{font-family:Newsreader,Georgia,serif;font-size:32px;line-height:1.2;font-weight:600;text-wrap:balance}
.prompt.de{font-size:27px}
.sub{color:var(--ink-2);font-size:14px}
.opts{display:grid;gap:9px;margin-top:4px}
.opt{display:flex;align-items:center;gap:10px;padding:14px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);text-align:left;font-weight:600;transition:border-color .12s,background .12s}
.opt .k{width:22px;height:22px;border-radius:6px;background:var(--card-2);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--ink-3);flex:0 0 auto}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--card-2);border-radius:12px;border:1px solid var(--line)}
.seg button{padding:10px 8px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tiles{display:flex;flex-wrap:wrap;gap:7px}
.tile{min-width:38px;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-weight:700;font-size:17px;font-family:Karla,sans-serif}
.tile.used{opacity:.25;pointer-events:none}
.tile.word{font-size:15px;padding:10px 13px;min-width:0;font-weight:600}
.slot.build{min-height:58px;align-items:flex-end;font-size:19px;letter-spacing:0;line-height:1.5;padding-bottom:8px}
.slot{min-height:52px;border-bottom:2px dashed var(--rule);display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  font-size:22px;font-weight:700;letter-spacing:.04em;padding:6px 2px}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.matchgrid button{padding:13px 10px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.matchgrid button.sel{border-color:var(--accent);background:var(--accent-soft)}
.matchgrid button.ok{border-color:var(--good);background:var(--good-soft);opacity:.55;pointer-events:none}
.matchgrid button.no{border-color:var(--bad);background:var(--bad-soft)}
.gapline{font-family:Newsreader,Georgia,serif;font-size:24px;line-height:1.45;text-wrap:balance}
.gapline u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 22px;color:var(--accent)}
.vchev{color:var(--ink-3);width:14px;flex:0 0 auto}
/* Beispielsätze der Verben: serifenlos wie die App; Verbform als Pille, Zeitwort als Marker */
.gapline.vgap{font-family:inherit;font-size:21px;font-weight:500;line-height:1.7}
.vsp{font-family:inherit;font-size:17px;font-weight:500;line-height:1.75;margin:8px 0 4px}
.vform{background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:8px;font-weight:700}
.vtime{text-decoration:none;background:color-mix(in srgb,var(--gold) 28%,transparent);padding:1px 6px;border-radius:6px}
.cmp .vform{padding:0 6px;border-radius:6px}.cmp .vtime{padding:0 4px;border-radius:5px}
.gapline u.vtime{padding:1px 6px;border-bottom:0;color:inherit;text-decoration:none;background:color-mix(in srgb,var(--gold) 28%,transparent);border-radius:6px}
.gapline u.vblank{display:inline-block;min-width:60px;padding:0 6px}
.speak{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:23px;flex:0 0 auto}
.speak.big{width:96px;height:96px;font-size:38px}
.verdict{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-weight:600}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict .cmp{display:block;font-weight:600;font-size:13px;opacity:.9;margin-top:3px}
.hearts{letter-spacing:1px;font-size:14px}

/* Fortschritt */
.tiles4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card-2);border-radius:12px;padding:12px 13px}
.kpi b{display:block;font-family:Newsreader,serif;font-size:27px;font-weight:600;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-3);font-weight:600}
.levelbar{display:flex;height:26px;border-radius:8px;overflow:hidden;gap:2px;background:var(--line)}
.levelbar i{display:block;height:100%}
.lv0{background:var(--line)} .lv1{background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.lv2{background:color-mix(in srgb,var(--accent) 45%,var(--card))} .lv3{background:color-mix(in srgb,var(--accent) 72%,var(--card))}
.lv4{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;align-items:end;height:92px}
.days .d{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px}
.days .d i{display:block;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:3px;opacity:.85}
.days .d i.zero{background:var(--line)}
.days .d small{font-size:9px;color:var(--ink-3);text-align:center;font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;background:var(--card-2)}
.badge.off{opacity:.38}
.badge b{display:block;font-size:12px;margin-top:4px}
.badge .g{font-size:22px}
.shopitem{display:flex;align-items:center;gap:10px;padding:10px 0}
.shopitem+.shopitem{border-top:1px solid var(--line)}

/* ---------- Arena ---------- */
html.ar-open, html.ar-open body{overflow:hidden}
#arena{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
  background:var(--ar-bg);color:var(--ar-ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:Karla,"Segoe UI",system-ui,sans-serif}
:root{
  --ar-bg:#0A111D; --ar-s:#16202F; --ar-s2:#1D293A; --ar-line:#2A3A52;
  --ar-ink:#EDF3FC; --ar-ink2:#8FA2BD;
  --ar-a:#4FC3D9; --ar-gold:#F2B94B; --ar-good:#5FD3A0; --ar-bad:#F2776E;
}
.ar-top{display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
.ar-x{width:36px;height:36px;border-radius:50%;background:var(--ar-s);color:var(--ar-ink2);
  display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.ar-clock{flex:1 1 auto;text-align:center;font-family:Newsreader,Georgia,serif;font-size:38px;font-weight:600;line-height:1}
.ar-score{text-align:right;flex:0 0 auto}
.ar-score b{display:block;font-family:Newsreader,serif;font-size:22px;font-weight:600;line-height:1.1}
.ar-score span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ar-ink2)}
.ar-time{height:6px;margin:0 16px;border-radius:99px;background:var(--ar-s);overflow:hidden}
.ar-time>i{display:block;height:100%;background:var(--ar-a);border-radius:99px}
.ar-time>i.mid{background:var(--ar-gold)} .ar-time>i.low{background:var(--ar-bad)}
.ar-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 16px 4px;font-size:12px;color:var(--ar-ink2);min-height:30px}
.ar-combo{font-weight:800;letter-spacing:.03em;color:var(--ar-a)}
.ar-combo.hot{color:var(--ar-gold)}
.ar-board{flex:1 1 auto;overflow-y:auto;padding:8px 16px 20px;position:relative}
.ar-match{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%;
  max-width:560px;margin:0 auto;align-content:center}
.ar-col{display:grid;grid-template-rows:repeat(5,minmax(52px,92px));gap:10px;min-height:0;align-content:center}
.ar-tile{display:flex;align-items:center;justify-content:center;text-align:center;
  padding:8px 9px;border-radius:13px;background:var(--ar-s);border:1px solid var(--ar-line);
  color:var(--ar-ink);font-weight:600;font-size:14px;line-height:1.25;min-height:56px;
  overflow:hidden;word-break:break-word;hyphens:auto}
.ar-tile.sel{border-color:var(--ar-a);background:var(--ar-s2);box-shadow:0 0 0 2px rgba(79,195,217,.28)}
.ar-tile.gone{background:transparent;border-color:transparent;pointer-events:none}
.ar-tile.bad{border-color:var(--ar-bad);background:rgba(242,119,110,.16);color:var(--ar-bad)}
.ar-card{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.ar-ask{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ar-ink2);text-align:center}
.ar-word{font-family:Newsreader,Georgia,serif;font-size:34px;font-weight:600;text-align:center;
  line-height:1.15;text-wrap:balance}
.ar-qbar{height:5px;border-radius:99px;background:var(--ar-s);overflow:hidden;margin:0 auto;width:min(320px,88%)}
.ar-qbar>i{display:block;height:100%;background:var(--ar-good);border-radius:99px}
.ar-qbar>i.mid{background:var(--ar-gold)} .ar-qbar>i.low{background:var(--ar-bad)}
.ar-opts{display:grid;gap:10px;margin-top:2px}
.ar-opt{padding:16px 14px;border-radius:13px;background:var(--ar-s);border:1px solid var(--ar-line);
  color:var(--ar-ink);font-weight:600;font-size:15.5px;text-align:center}
.ar-opt.right{border-color:var(--ar-good);background:rgba(95,211,160,.16);color:var(--ar-good)}
.ar-opt.wrong{border-color:var(--ar-bad);background:rgba(242,119,110,.16);color:var(--ar-bad)}
.ar-flash{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);
  font-family:Newsreader,serif;font-size:34px;font-weight:600;color:var(--ar-good);
  opacity:0;pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.ar-flash.combo{color:var(--ar-gold);font-size:40px}
.ar-end{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:24px 20px;text-align:center}
.ar-endicon{font-size:52px;line-height:1}
.ar-end h1{font-family:Newsreader,serif;font-size:27px;font-weight:600;margin:0}
.ar-big{font-family:Newsreader,serif;font-size:44px;font-weight:600;color:var(--ar-a);line-height:1}
.ar-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:440px;margin-top:6px}
.ar-stats div{background:var(--ar-s);border-radius:12px;padding:10px 6px}
.ar-stats b{display:block;font-family:Newsreader,serif;font-size:21px;font-weight:600;line-height:1.1}
.ar-stats span{font-size:10px;color:var(--ar-ink2);letter-spacing:.03em}
.ar-note{color:var(--ar-ink2);font-size:13px;margin:4px 0 0}
.ar-endbtns{display:flex;gap:10px;width:100%;max-width:440px;margin-top:10px}
.ar-btn{flex:1 1 auto;padding:15px 18px;border-radius:13px;background:var(--ar-a);color:#06131A;
  font-weight:800;font-size:16px}
.ar-btn.ghost{background:var(--ar-s);color:var(--ar-ink);border:1px solid var(--ar-line);font-weight:700}
#arena :focus-visible{outline:2px solid var(--ar-a);outline-offset:2px}

  .ar-tile.pop{animation:arpop .18s ease forwards}
  @keyframes arpop{to{transform:scale(.8);opacity:0}}
  .ar-flash.show{animation:arflash .42s ease}
  @keyframes arflash{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}

}
/* Arena-Karten im Reiter */
.mode{display:flex;gap:12px;align-items:flex-start;padding:14px 0;width:100%;text-align:left}

}

.tile{display:flex;gap:10px;align-items:center;text-align:left;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);width:100%;min-width:0}

.tile .ti{font-size:24px;flex:none;width:30px;text-align:center}
.tile .tt{min-width:0}
.tile .tt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tt span.d{display:block;font-size:12px;line-height:1.3;color:var(--ink-3)}
.tile .tt .pill{margin-top:4px;white-space:nowrap}
.tile.rec{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
details.grp{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 16px}

.rec-card h2{font-size:21px;margin:6px 0 2px}
.nowrap{white-space:nowrap}
@media (min-width:520px){ .tiles4{grid-template-columns:repeat(4,1fr)} .quick{grid-template-columns:repeat(4,1fr)} }

<script>/* Wordbook – Oberfläche, Übungstypen, Session-Ablauf */
(function (global) {
  "use strict";
  var S = global.VT, view = document.getElementById("view"), tabs = document.getElementById("tabs"),
      sessionEl = document.getElementById("session"), tab = "home", detailUnit = null,
      uebenSeg = "modi", statsSeg = "ueb", shopSeg = "shop", startMin = null, lastRec = null, openGroups = {}, openFolds = {};

  /* ---------- Werkzeug ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function toast(msg, ms) {
    var t = document.createElement("div"); t.className = "toast pop"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, ms || 2600);
  }
  function plural(n, a, b) { return n === 1 ? a : b; }
  function fmtMin(sec) { var m = Math.round(sec / 60); return m < 1 ? "unter 1 Min" : m + " Min"; }

  /* ---------- Installation ---------- */
  var installPrompt = null;
  global.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); installPrompt = e;
    if (tab === "parent") render();
  });
  global.addEventListener("appinstalled", function () { installPrompt = null; toast("Wordy ist jetzt installiert."); });
  function isStandalone() {
    try {
      return global.matchMedia("(display-mode: standalone)").matches || global.navigator.standalone === true;
    } catch (e) { return false; }
  }
  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function installCard() {
    if (isStandalone()) return '<section class="card"><div class="eyebrow" style="color:var(--good)">Installiert</div>' +
      '<p class="small muted" style="margin:8px 0 0">Wordy läuft als App. Der Lernstand bleibt auf diesem Gerät gespeichert, auch offline.</p></section>';
    if (installPrompt) return '<section class="card"><div class="eyebrow">Als App installieren</div>' +
      '<p class="small muted" style="margin:8px 0 10px">Dann liegt Wordy als Symbol auf dem Startbildschirm, startet im Vollbild und funktioniert ohne Netz.</p>' +
      '<button class="btn" data-act="install">Auf dem Gerät installieren</button></section>';
    if (isIOS()) return '<section class="card"><div class="eyebrow">Als App installieren</div>' +
      '<p class="small muted" style="margin:8px 0 0">In Safari unten auf das Teilen-Symbol tippen und „Zum Home-Bildschirm“ wählen. Danach startet Wordy im Vollbild und läuft auch ohne Netz.</p></section>';
    return '<section class="card"><div class="eyebrow">Als App installieren</div>' +
      '<p class="small muted" style="margin:8px 0 0">Im Browsermenü gibt es dafür „Installieren“ oder „Zum Startbildschirm hinzufügen“. Offline funktioniert Wordy, sobald es über eine Adresse geöffnet wird und nicht als lose Datei.</p></section>';
  }

  /* ---------- Aussprache ---------- */
  var voice = null, voiceDe = null, voicesReady = false;
  function pickVoice() {
    if (!window.speechSynthesis) return null;
    var v = window.speechSynthesis.getVoices() || [];
    if (!v.length) return null;
    voice = v.filter(function (x) { return /^en[-_]GB/i.test(x.lang); })[0] ||
            v.filter(function (x) { return /^en/i.test(x.lang); })[0] || null;
    voiceDe = v.filter(function (x) { return /^de[-_]DE/i.test(x.lang); })[0] ||
              v.filter(function (x) { return /^de/i.test(x.lang); })[0] || null;
    voicesReady = true; return voice;
  }
  if (window.speechSynthesis) {
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  /* Handy-Browser öffnen den Audiokanal erst beim Sprechen und verlieren dabei den Anfang des Satzes
     (nur beim ersten Vorlesen nach einer Pause). Deshalb: war die Ausgabe länger still, wird zuerst eine
     kaum hörbare Silbe gesprochen und der eigentliche Satz erst nach einem Vorlauf gestartet.
     Die Länge des Vorlaufs ist unter Setup einstellbar (Standard 500 ms). */
  var lastSpoke = 0;
  function speechLead() { var v = S.state.settings.speechLead; return v == null ? 500 : v; }
  /* Wärmt die Ausgabe mit einem echten, aber unhörbaren Wort an (Lautstärke fast 0; bei exakt 0 überspringen
     manche Stimmen die Ausgabe). done() läuft, sobald es fertig ist oder spätestens nach maxMs. */
  function primeSpeech(done, maxMs) {
    var synth = window.speechSynthesis, fired = false;
    function fin() { if (fired) return; fired = true; if (done) setTimeout(done, 40); }
    if (!synth) return fin();
    try {
      var w = new SpeechSynthesisUtterance("Okay");
      w.volume = 0.001; w.rate = 3;
      w.onend = fin; w.onerror = fin;
      synth.speak(w);
      setTimeout(fin, maxMs || 500);
    } catch (e) { fin(); }
  }
  /* Englischen Text für die Sprachausgabe aufbereiten: Abkürzungen ausschreiben, Klammern und Schrägstriche glätten */
  function speechClean(t) {
    return String(t)
      .replace(/\bsb\.?\s*\/\s*sth\.?/gi, "somebody or something")
      .replace(/\bsth\.?\s*\/\s*sb\.?/gi, "something or somebody")
      .replace(/\bsb\.?(?=\W|$)/gi, "somebody")
      .replace(/\bsth\.?(?=\W|$)/gi, "something")
      .replace(/\be\.\s?g\.?/gi, "for example")
      .replace(/\bi\.\s?e\.?/gi, "that is")
      .replace(/\betc\.?/gi, "et cetera")
      .replace(/£\s?(\d+(?:[.,]\d+)?)/g, "$1 pounds")
      .replace(/\bthe (\d)0s\b/gi, function (m, d) { return "the " + ({ 6: "sixties", 7: "seventies", 8: "eighties", 9: "nineties" }[d] || m.slice(4)); })
      .replace(/\s*\((Nomen|Verb|Adjektiv|Vergangenheit|überhören|Stufe|klein|zum Beispiel)\)/g, "")   // deutsche Hinweise nicht vorlesen
      .replace(/\bat (\d{1,2})\.(\d{2})\b/g, "at $1:$2")
      .replace(/\s*(…|\.\.\.)\s*/g, " ")
      .replace(/[()]/g, "")
      .replace(/\s*\/\s*/g, ", ")
      .replace(/\s*[;:]\s*/g, ", ")
      .replace(/([.!?]),/g, "$1")
      .replace(/\s+/g, " ").trim();
  }
  function speak(text, rate, lang, forceCold, onEnd) {
    if (!S.state.settings.audio || !window.speechSynthesis) return false;
    try {
      var synth = window.speechSynthesis, now = Date.now();
      var busy = synth.speaking || synth.pending, cold = !busy && (forceCold || now - lastSpoke > 8000);
      if (busy) synth.cancel();
      var de = lang === "de";
      var u = new SpeechSynthesisUtterance(de ? String(text) : speechClean(String(text)).replace(/^to\s+/i, ""));
      if (!voicesReady) pickVoice();
      var vo = de ? voiceDe : voice;
      if (vo) u.voice = vo;
      u.lang = (vo && vo.lang) || (de ? "de-DE" : "en-GB");
      u.rate = rate || (de ? 1 : 0.92);
      if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
      lastSpoke = now;
      var lead = speechLead();
      if (busy) setTimeout(function () { synth.speak(u); }, 150);
      else if (cold && lead > 0) primeSpeech(function () { synth.speak(u); }, lead);
      else synth.speak(u);
      return true;
    } catch (e) { return false; }
  }
  /* Beim ersten Tippen die Sprachausgabe unhörbar anwerfen, damit schon der erste Satz vollständig kommt. */
  document.addEventListener("pointerdown", function warm() {
    document.removeEventListener("pointerdown", warm);
    if (S.state.settings.audio && window.speechSynthesis) { try { primeSpeech(null, 300); lastSpoke = Date.now(); } catch (e) {} }
  }, { passive: true });
  function audioAvailable() { return !!(window.speechSynthesis && S.state.settings.audio); }

  /* ---------- Textvergleich ---------- */
  function norm(s) {
    return String(s).toLowerCase().replace(/^to\s+/, "").replace(/^(a|an|the)\s+/, "")
      .replace(/[.,!?;:'"´`]/g, "").replace(/\s+/g, " ").trim();
  }
  function lev(a, b) {
    var m = a.length, n = b.length, d = [], i, j;
    for (i = 0; i <= m; i++) d[i] = [i];
    for (j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[m][n];
  }
  function judgeTyped(input, target) {
    var a = norm(input), alts = String(target).split(/\s*[\/,]\s*/).map(norm).filter(Boolean);
    if (!a) return 0;
    if (alts.indexOf(a) >= 0) return 2;
    for (var i = 0; i < alts.length; i++) {
      var d = lev(a, alts[i]);
      if (d <= (alts[i].length > 6 ? 2 : 1)) return 1;
    }
    return 0;
  }

  /* ---------- Kopfzeile ---------- */
  /* Avatare sind Emojis oder, mit "svg:"-Präfix, Zeichnungen aus cosmetics.js */
  function avatarHtml(v) { return global.VTC.avatarHtml(v, esc); }
  function playerName() {
    var d = S.profiles(), x = d.list.filter(function (y) { return y.id === d.active; })[0];
    return x ? x.name : "";
  }
  function renderHeader() {
    var st = S.state, r = S.rankOf(st.xp);
    $("#hAvatar").innerHTML = avatarHtml(st.profile.avatar);
    $("#hAvatar").className = ("avatar " + global.VTC.frameClass(st.profile)).trim();
    var pd = S.profiles(); var pn = pd.list.filter(function (x) { return x.id === pd.active; })[0];
    $("#hAvatar").title = pn ? pn.name : "";
    $("#hRank").textContent = r.rank.n + (st.profile.title ? " · " + st.profile.title : "");
    $("#hXp").textContent = st.xp;
    $("#hCoins").textContent = st.coins;
    $("#hStreak").textContent = st.streak.count;
    var hEl = $("#hHearts");
    if (!st.settings.hearts) { hEl.textContent = "∞"; hEl.title = "Ohne Herzen"; }
    else { S.regenHearts(); hEl.innerHTML = "<span style='color:var(--bad)'>" + "♥".repeat(st.hearts) + "</span><span style='color:var(--line)'>" + "♥".repeat(5 - st.hearts) + "</span>"; }
    global.VTC.applyLook(st.profile, st.settings.themeMode);
  }

  function trackSwitch() {
    var t = S.state.settings.track;
    return '<div class="seg" role="group" aria-label="Lernbereich">' +
      '<button data-act="track" data-t="schule" aria-pressed="' + (t === "schule") + '">🎒 Schule</button>' +
      '<button data-act="track" data-t="business" aria-pressed="' + (t === "business") + '">💼 Business</button></div>';
  }
  function groupLabel(k) { return typeof k === "number" ? "Klasse " + k : k; }

  /* ---------- Wunsch ---------- */
  function wishCard() {
    var st = S.state, it = S.wish();
    if (!it) return '<section class="card"><div class="row" style="gap:12px;align-items:center"><div style="font-size:30px">⭐</div>' +
      '<div style="flex:1 1 auto"><b>Was wünschst du dir?</b><p class="small muted" style="margin:2px 0 0">Wähle im Shop einen Wunsch, auf den du Münzen sammelst. Hier siehst du, wie weit du schon bist.</p></div></div>' +
      '<button class="btn soft wide" data-act="goshop" style="margin-top:10px">Zum Shop</button></section>';
    var have = Math.min(st.coins, it.cost), pc = it.cost ? Math.round(have * 100 / it.cost) : 100, left = Math.max(0, it.cost - st.coins);
    var needXp = Math.max(0, S.minXp(it) - st.xp);
    var icon = it.kind === "sticker" ? stickerHtml(it, 46) : it.kind === "avatar" ? '<div class="avatar" style="width:46px;height:46px;font-size:26px">' + avatarHtml(it.val) + '</div>' : shopIcon(it);
    var line = needXp ? "Du brauchst noch " + needXp + " XP bis Rang " + esc(it.rank) + (left ? " und " + left + " 🪙." : ".")
      : left ? "Noch " + left + " 🪙 – das schaffst du." : "Genug Münzen! Jetzt im Shop holen.";
    return '<section class="card"><div class="eyebrow">Dein Wunsch</div><div class="row" style="gap:12px;align-items:center;margin-top:8px"><div style="width:50px;display:grid;place-items:center">' + icon + '</div>' +
      '<div style="flex:1 1 auto;min-width:0"><b>' + esc(it.label) + '</b><div class="bar" style="margin:6px 0 4px"><i style="width:' + pc + '%"></i></div>' +
      '<div class="small muted tnum">' + have + ' / ' + it.cost + ' 🪙 · ' + line + '</div></div></div>' +
      '<div class="row" style="gap:8px;margin-top:10px">' + (!needXp && !left ? '<button class="btn" data-act="buy" data-id="' + esc(it.id) + '">Jetzt kaufen</button>' : "") +
      '<button class="btn ghost" data-act="goshop">Anderen Wunsch wählen</button></div></section>';
  }
  /* ---------- Unregelmäßige Verben: Karte, Liste ---------- */
  function verbCard() {
    var vs = S.verbStats(), vp = S.verbPools(), due = vp.box.length + vp.due.length;
    return '<section class="card"><div class="row"><div style="flex:1 1 auto"><div class="eyebrow">Unregelmäßige Verben</div>' +
      '<h2 style="font-size:19px">' + vs.seen + ' von ' + vs.total + ' geübt · ' + vs.mastered + ' sitzen</h2>' +
      '<p class="small muted" style="margin:4px 0 0">' + (due ? due + " " + plural(due, "Verb ist", "Verben sind") + " zur Wiederholung dran. " : "") +
      'Go – went – gone: alle Formen, die man in der Schule braucht. In normalen Runden kommen sie immer wieder zwischendurch.</p></div></div>' +
      '<div class="row wrap" style="margin-top:12px;gap:8px"><button class="btn" data-act="start" data-mode="verbs" data-min="5">Verben üben</button>' +
      '<button class="btn soft" data-act="start" data-mode="verbs" data-vtype="1" data-min="5">Nur Tippen</button>' +
      '<button class="btn ghost" data-act="verblist">Alle Verben ansehen</button></div>' +
      '<p class="small muted" style="margin:8px 0 0">„Verben üben“ mischt Einführung, Lückenaufgabe und Tippen. „Nur Tippen“ fragt immer beide Formen zum Schreiben ab.</p></section>';
  }
  function viewVerbList() {
    var vs = S.verbStats(), list = S.verbs();
    var rows = list.map(function (v) {
      var lv = S.levelOf(v.id), r = S.state.w[v.id];
      return '<div class="wordrow" data-act="vtoggle" style="cursor:pointer">' +
        (audioAvailable() ? '<button class="mini-speak" data-act="say" data-text="' + esc(v.en) + '" aria-label="' + esc(v.inf) + ' anhören">🔊</button>' : '') +
        '<span class="vchev" aria-hidden="true">▸</span>' +

  /* ================= START ================= */

  /* ---------- Ziele und Lernpläne der Eltern (Startseite) ---------- */
  function parentCards(skipPlans) {
    var W = window.WordySync; if (!W || !W.connected()) return "";
    var h = "", goals = W.currentGoals(), plans = W.activePlans(), st = S.state;
    (skipPlans ? [] : plans).forEach(function (pl) {
      var i = W.planInfo(pl), done = st.goalsDone && st.goalsDone["p" + pl.id];
      var when = i.days > 1 ? "in " + i.days + " Tagen" : i.days === 1 ? "morgen" : "heute";
      var newToday = (st.daily && st.daily.newSeen) || 0, left = Math.max(0, i.quota - newToday);
      h += '<section class="card"><div class="eyebrow">📅 Lernplan</div>' +
        '<div style="margin-top:6px"><b>' + esc(pl.title) + '</b> <span class="small muted">· Arbeit ' + when + '</span></div>' +
        '<div class="bar" style="margin:10px 0 6px"><i style="width:' + i.pct + '%"></i></div>' +
        '<p class="small muted" style="margin:0 0 10px">' + i.pct + ' % sicher (' + i.ok + ' von ' + i.total + ' Wörtern)' +
        (done ? ' · ✅ Ziel erreicht' : pl.coins ? ' · Bonus ' + pl.coins + ' Münzen bei 90 %' : '') + '</p>' +
        (i.total - i.ok > 0 ? '<p class="small" style="margin:0 0 10px">Heute dran: ' + (left > 0 ? '<b>' + left + ' neue ' + plural(left, "Wort", "Wörter") + '</b> und ' : '') + 'Wiederholung.</p>' : '') +
        '<button class="btn wide" data-act="startplan" data-id="' + esc(pl.id) + '">Lernplan üben</button></section>';
    });
    if (goals.length) {
      h += '<section class="card"><div class="eyebrow">🎯 Deine persönlichen Wochenziele</div><div style="margin-top:8px">' + goals.map(function (g) {
        var pr = W.progress(g), done = st.goalsDone && st.goalsDone["g" + g.id];
        return '<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="row"><b class="small" style="flex:1 1 auto">' + (done ? "✅ " : "") + esc(g.title) + '</b>' +
          '<span class="pill tnum">' + Math.min(pr.cur, g.target) + ' / ' + g.target + (g.kind === "unit" ? " %" : "") + '</span></div>' +
          '<div class="bar" style="margin-top:6px"><i style="width:' + (done ? 100 : pr.pct) + '%"></i></div>' +
          (g.coins ? '<div class="small muted" style="margin-top:4px">' + (done ? 'Geschafft, ' + g.coins + ' Münzen sind gutgeschrieben.' : 'Belohnung: 🪙 ' + g.coins) + '</div>' : '') + '</div>';
      }).join("") + '</div></section>';
    }
    return h;
  }

  /* ---------- Segment-Umschalter und Kacheln ---------- */
  function segBar(group, cur, items) {
    return '<div class="segs">' + items.map(function (x) {
      return '<button data-act="seg" data-g="' + group + '" data-v="' + x[0] + '" aria-pressed="' + (cur === x[0]) + '">' + x[1] + '</button>';
    }).join("") + '</div>';
  }
  function tile(icon, title, desc, attrs, extra, cls) {
    return '<button class="tile' + (cls ? " " + cls : "") + '" ' + attrs + '><span class="ti">' + icon + '</span><span class="tt"><b>' + title + '</b><span class="d">' + desc + '</span>' + (extra || "") + '</span></button>';
  }

  /* ---------- Start: eine Empfehlung, ein Knopf ---------- */
  function recommend() {
    var st = S.state, p = S.pools(), W = window.WordySync, mins = startMin || st.settings.goalMin;
    var plans = (W && W.connected()) ? W.activePlans().filter(function (pl) { var d = W.planInfo(pl).days; return d >= 0 && d <= 14; }) : [];
    if (plans.length) {
      plans.sort(function (a, b) { return a.exam < b.exam ? -1 : 1; });
      var pl = plans[0], pi = W.planInfo(pl), newToday = (st.daily && st.daily.newSeen) || 0, left = Math.max(0, pi.quota - newToday);
      return { plan: true, icon: "📅", title: esc(pl.title),
        sub: "Arbeit " + (pi.days > 1 ? "in " + pi.days + " Tagen" : pi.days === 1 ? "morgen" : "heute") + " · " + pi.pct + " % sicher" + (left ? " · heute " + left + " neue " + plural(left, "Wort", "Wörter") : ""),
        opts: { minutes: mins, scope: pl.units, newMax: Math.max(pi.quota, newToday), mode: "plan" } };
    }
    if (p.box.length >= 8) return { icon: "♻️", title: "Fehlerkartei", sub: p.box.length + " Wörter warten darauf, endlich zu sitzen.", opts: { minutes: mins, mode: "box" } };
    if (p.due.length) return { icon: "🧠", title: "Wiederholen", sub: p.due.length + " " + plural(p.due.length, "Wort ist", "Wörter sind") + " fällig.", opts: { minutes: mins, mode: "mix" } };
    if (p.fresh.length) return { icon: "✨", title: "Neue Wörter", sub: "Nichts ist fällig. Zeit für etwas Neues.", opts: { minutes: mins, mode: "new" } };
    return { icon: "🧠", title: "Weiterlernen", sub: "Eine bunte Runde aus allem.", opts: { minutes: mins, mode: "mix" } };
  }
  function viewHome() {

      '<span>🛡️ ' + st.streak.freezes + ' Streak-Schutz</span>' +

      st.daily.missions.map(function (m) {

          '<div class="bar"><i style="width:' + Math.min(100, Math.round(st.coins * 100 / Math.max(1, wish.cost))) + '%"></i></div></div>' +

  /* ================= ÜBEN: Spielmodi und Einheiten ================= */
  function modiHtml() {

    var learn = tile("🧠", 'Weiterlernen <span style="color:var(--gold)">★</span>', "Mix aus allem, was dran ist", 'data-act="start" data-min="' + mins + '"') +

      tile("♻️", "Fehlerkartei", p.box.length ? p.box.length + " " + plural(p.box.length, "Wort", "Wörter") + " üben" : "Leer, sehr gut!", 'data-act="start" data-mode="box" data-min="5"' + (p.box.length ? "" : " disabled")) +
      tile("💬", "Sätze", stt.sent.total ? stt.sent.seen + " von " + stt.sent.total + " geübt" : "Für diesen Bereich noch keine", 'data-act="start" data-mode="sent" data-min="5"' + (stt.sent.total ? "" : " disabled")) +

      plans.map(function (pl) {
        var pi = W.planInfo(pl);
        return tile("📅", esc(pl.title), (pi.days > 1 ? "in " + pi.days + " Tagen" : pi.days === 1 ? "morgen" : pi.days === 0 ? "heute" : "vorbei") + " · " + pi.pct + " %", 'data-act="startplan" data-id="' + esc(pl.id) + '"');
      }).join("");
    var modes = global.ARENA ? global.ARENA.MODES : [];
    var play = modes.map(function (m) {

    var plays = 0, arena = st.arena || {};

    var focusT = [["👂", "Hören", "Wort hören und finden", "listen", !aud], ["⌨️", "Tippen", "Wort selbst schreiben", "type"], ["🧩", "Lücken", "Satz vervollständigen", "gap"], ["🔗", "Zuordnen", "Paare verbinden", "match"]];

      '<section class="card"><div class="eyebrow">Spielen</div>' +
      (few ? '<p class="small muted" style="margin:6px 0 0">Für die Spiele brauchst du mindestens acht Wörter im gewählten Bereich. Schalte unter „Einheiten“ ein weiteres Schuljahr dazu.</p>' : '') +
      '<div class="tiles">' + play + '</div>' +
      '<details style="margin-top:12px"><summary class="small" style="cursor:pointer;font-weight:700">Wie die Spiele zählen</summary>' +
      '<p class="small muted" style="margin:8px 0 0">Ein Treffer unter Zeitdruck wird als sichere, aber flache Wiederholung gewertet. Er schiebt ein Wort eine Stufe weiter, ersetzt aber nicht das ruhige Training. Ein Fehlgriff landet sofort in der Fehlerkartei. Die Zeit läuft aufs Tagesziel.' + (plays ? ' Bisher ' + plays + ' ' + plural(plays, "Runde", "Runden") + ' gespielt.' : '') + '</p></details></section>' +

  /* ================= EINHEITEN ================= */
  function unitsHtml() {
    var st = S.state, stt = S.stats();
    var biz = st.settings.track === "business";
    var groups = biz ? ["Basis", "Aufbau", "Profi", "Smalltalk", "Redewendungen"] : ["Headlight 2", 6, 7, 8];
    var sel = S.groupsOf();
    var html = '';
    html += '<section class="card">' +
      '<div class="eyebrow">' + (biz ? "Stufe" : "Schuljahr") + '</div>' +
      '<div class="row wrap" style="margin-top:8px">' +
      groups.map(function (k) {
        return '<button class="chip" data-act="klasse" data-k="' + esc(k) + '" aria-pressed="' + (sel.indexOf(k) >= 0) + '">' + esc(groupLabel(k)) + '</button>';
      }).join("") +
      '</div><p class="small muted" style="margin:10px 0 0">' + (biz
        ? "Wähle, was im Training vorkommen soll. Unten stehen die Einheiten dazu."

    if (!biz) {
      var vs0 = S.verbStats();
      html += '<details class="grp" data-k="__verbs"' + (openGroups.__verbs ? " open" : "") + '><summary><span class="chev">▸</span><span style="flex:1 1 auto;min-width:0"><b>🔀 Unregelmäßige Verben</b>' +
        '<span class="small muted" style="display:block">' + vs0.seen + ' von ' + vs0.total + ' geübt · ' + vs0.mastered + ' sitzen</span></span></summary>' +
        verbCard().replace(/^<section class="card"[^>]*>(<div class="row"><div style="flex:1 1 auto"><div class="eyebrow">[^<]*<\/div>)/, '<div class="row"><div style="flex:1 1 auto">').replace(/<\/section>$/, "") + '</details>';
    }
    var byGroup = {}, order = [];
    stt.perUnit.forEach(function (u) {
      if (u.track !== "eigen" && sel.indexOf(u.k) < 0) return;   // nur die gewählten Stufen bzw. Jahrgänge

      if (!byGroup[key]) { byGroup[key] = []; order.push(key); }

    });
    order.sort(function (a, b) { var ia = groups.indexOf(/^\d+$/.test(a) ? +a : a), ib = groups.indexOf(/^\d+$/.test(b) ? +b : b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    order.forEach(function (k) {
      var title = k === "0" ? "Eigene Listen" : groupLabel(byGroup[k][0].k);

      function unitRow(u) {

            '<span class="ic">' + esc(u.icon) + '</span><span class="t"><b>' + esc(BOOKS.some(function (b) { return u.id.indexOf(b.pre) === 0; }) ? u.title.replace(/^Headlight 2 · /, "") : u.title) + '</b>' +
            '<span class="bar" style="margin-top:6px;display:block"><i style="width:' + pc + '%"></i></span></span>' +
            '<span class="pill tnum">' + u.mastered + '/' + u.total + '</span></button>';
      }
      var tot = 0, mas = 0; byGroup[k].forEach(function (u) { tot += u.total; mas += u.mastered; });
      var isOpen = openGroups[k] === undefined ? order.indexOf(k) === 0 : openGroups[k];
      html += '<details class="grp" data-k="' + esc(k) + '"' + (isOpen ? " open" : "") + '><summary><span class="chev">▸</span><span style="flex:1 1 auto;min-width:0"><b>' + esc(title) + '</b>' +
        '<span class="small muted" style="display:block">' + byGroup[k].length + ' ' + plural(byGroup[k].length, "Einheit", "Einheiten") + ' · ' + mas + ' / ' + tot + ' Wörter gemeistert</span></span></summary>' +
        '<div>' + rest.map(unitRow).join("") + '</div>' +

    });
    return html;
  }

      '<div class="small muted">von ' + vst.total + ' Verben geübt</div></div>' +
      '<div style="flex:1 1 auto"><div class="bar"><i style="width:' + Math.round(vst.seen * 100 / Math.max(1, vst.total)) + '%"></i></div>' +
      '<div class="small muted" style="margin-top:6px">' + vst.mastered + ' sitzen langfristig</div></div></div>' +
      '<button class="btn ghost" data-act="verblist" style="margin-top:10px">Verbenliste öffnen</button></section>';

      '<div class="kpi"><b class="tnum">' + s.boxSize + '</b><span>in der Fehlerkartei</span></div>' +
      '<div class="kpi"><b class="tnum">' + s.sent.seen + '/' + s.sent.total + '</b><span>Sätze geübt</span></div>' +
      '<div class="kpi"><b class="tnum">' + s.dist[4] + '</b><span>Wörter gemeistert</span></div></div></section>';
    var secBox = '<section class="card"><div class="eyebrow">Fehlerkartei</div>' +
      '<p style="margin:8px 0 0"><b class="tnum">' + s.boxSize + '</b> ' + plural(s.boxSize, "Wort macht", "Wörter machen") + ' noch Probleme. Sie kommen automatisch häufiger dran.</p>' +

    else if (statsSeg === "verlauf") html += secDays + secSent;
    else html += secTiles + secDist + secOverview + secBehind;

  function playersCard() {

  function pickPlayer() {
    var d = S.profiles();
    if (d.list.length < 2) return;
    try { if (global.sessionStorage.getItem("wordy.picked")) return; } catch (e) {}
    var ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px";
    var h = '<div class="card" style="max-width:380px;width:100%"><div class="eyebrow">Wer lernt heute?</div><div class="stack" style="margin-top:12px;gap:10px">';
    d.list.forEach(function (x) { h += '<button class="btn" data-pick="' + x.id + '" style="font-size:1.1rem">' + esc(x.name) + '</button>'; });
    ov.innerHTML = h + '</div></div>';
    ov.addEventListener("click", function (e) {
      var b = e.target.closest("[data-pick]"); if (!b) return;
      S.switchProfile(b.getAttribute("data-pick"));
      try { global.sessionStorage.setItem("wordy.picked", "1"); } catch (er) {}
      global.location.reload();
    });
    document.body.appendChild(ov);
  }

  function paintSlot(t, words) {

    } else {
      el.innerHTML = '<span>' + esc(t.built.join("")) + '</span>' +
        '<span style="color:var(--ink-3);letter-spacing:.18em">' + "·".repeat(rest) + '</span>';

  /* ---------- Antwort prüfen ---------- */
  function applyGrade(w, g, extra) {
    var before = S.levelOf(w.id), wasBox = S.inErrorBox(w.id);
    var res = S.grade(w.id, g);
    SS.items++;
    if (g > 0) {
      SS.correct++; SS.chain++; SS.maxChain = Math.max(SS.maxChain, SS.chain);
      S.addXp(g === 2 ? 10 : 6);
      if (wasBox) SS.boxSolved++;   // zählt für die Mission "Fehlerkartei-Wörter richtig beantworten"
      if (res.after === 4 && before < 4) SS.mastered++;
    } else {
      SS.chain = 0; S.addXp(2);
      if (S.state.settings.hearts) { S.state.hearts = Math.max(0, S.state.hearts - 1); S.state.heartTs = Date.now(); }
    }
    if (before === 0) SS.newSeen++;
    S.save();
    renderHeader();
    return res;
  }
  function verdict(ok, w, res, note) {
    var foot = $("#sfoot"); if (!foot) return;
    feedback(ok);
    var lvl = res ? S.levelOf(w.id) : 0;
    var comp = "";
    if (ok && res) {
      var r = S.state.w[w.id];
      comp = res.after > res.before && res.after === 4 ? "Dieses Wort sitzt jetzt langfristig. ★"
        : res.after > res.before ? "Stufe erreicht: " + S.LEVELS[res.after].n + "."
        : r.iv >= 1 ? "Kommt in " + r.iv + " " + plural(r.iv, "Tag", "Tagen") + " wieder." : "";
    } else if (!ok) comp = "Kommt gleich noch einmal – und häufiger, bis es sitzt.";
    foot.innerHTML = '<div class="verdict ' + (ok ? "ok" : "no") + ' pop">' + (ok ? "Richtig" : "Noch nicht") +
      (note ? " · " + esc(note) : "") +
      '<span class="cmp">' +
      (audioAvailable() ? '<button class="mini-speak" data-act="say" data-text="' + esc(w.en) + '" aria-label="' + esc(w.en) + ' anhören">🔊</button>' : '') +
      esc(w.en) + " – " + esc(w.de) + (comp ? " · " + comp : "") + '</span>' +
      (w.exHtml ? w.exHtml : (w.ex && audioAvailable() ? '<span class="cmp"><button class="mini-speak" data-act="say" data-text="' + esc(w.ex) + '" aria-label="Beispielsatz anhören">🔊</button>' + esc(w.ex) + '</span>' : "")) +
      '</div>' +
      '<button class="btn wide lg" data-act="next" id="mainBtn">Weiter</button>';
    var b = $("#mainBtn"); if (b) b.focus();
  }
  /* Effekt und Ton der gewählten Sammelobjekte bei einer Antwort */
  function feedback(ok) {
    var p = S.state.profile;
    if (S.state.settings.audio) global.VTC.sound(p.snd, ok);
    if (ok) global.VTC.burst(p.fx, global.innerWidth / 2, global.innerHeight * .55, 16, 1);
  }
  function verdictSentence(ok, x) {
    var foot = $("#sfoot"); if (!foot) return;
    feedback(ok);
    foot.innerHTML = '<div class="verdict ' + (ok ? "ok" : "no") + ' pop">' + (ok ? "Richtig gebaut" : "So heißt es richtig") +
      '<span class="cmp" style="font-family:Newsreader,Georgia,serif;font-size:16px;margin-top:6px">' + esc(x.en) + '</span>' +
      '<span class="cmp">Regel: ' + esc(x.rule) + '</span></div>' +
      (audioAvailable() ? '<button class="btn ghost wide" data-act="say" data-text="' + esc(x.en) + '" style="margin-bottom:8px">🔊 Satz anhören</button>' : "") +
      '<button class="btn wide lg" data-act="next" id="mainBtn">Weiter</button>';
    if (ok) speak(x.en, 0.9);
    var b = $("#mainBtn"); if (b) b.focus();
  }
  function check() {
    if (!SS || SS.answered) return;
    var t = SS.tasks[SS.i], w = t.w;
    var inl = $("#inlineCheck"); if (inl) inl.remove();
    if (t.type === "verbgap") {
      if (SS.pick == null) return;
      var vg = t.v, gx = vg.s[t.idx], okG = !!t.opts[SS.pick].ok, vgw = verbWord(vg);
      SS.answered = true;
      $$(".opt").forEach(function (b, i) { b.disabled = true; if (t.opts[i].ok) b.classList.add("right"); else if (i === SS.pick) b.classList.add("wrong"); });
      var rg = applyGrade(vgw, okG ? 1 : 0);
      if (!okG) SS.retry.push({ type: "verbgap", v: vg, idx: t.idx });
      verdict(okG, vgw, rg, "Zeitwort „" + gx.time + "“ → " + TENSES[t.idx].name);
      return;
    }
    if (t.type === "verb") {
      var v = t.v, vw = verbWord(v);
      var ga = judgeTyped($("#vPast").value, v.past), gb = judgeTyped($("#vPp").value, v.pp);
      var gv = ga === 0 || gb === 0 ? 0 : (ga === 2 && gb === 2 ? 2 : 1);
      SS.answered = true;
      var rv = applyGrade(vw, gv);
      if (gv === 0) SS.retry.push({ type: "verb", v: v });
      verdict(gv > 0, vw, rv, gv === 1 ? "fast – achte auf die Schreibweise"
        : gv === 0 ? "Deine Antwort: " + ($("#vPast").value.trim() || "–") + " / " + ($("#vPp").value.trim() || "–") : null);
      $("#vPast").disabled = true; $("#vPp").disabled = true;
      return;
    }
    if (t.type === "type") {
      var val = $("#typeIn").value, g = judgeTyped(val, w.en);
      SS.answered = true;
      var res = applyGrade(w, g);
      if (g === 0) SS.retry.push({ type: "mc_en_de", w: w });
      verdict(g > 0, w, res, g === 1 ? "fast – achte auf die Schreibweise" : null);
      var inp = $("#typeIn"); if (inp) inp.disabled = true;
      return;
    }
    if (t.type === "build") {
      SS.answered = true;
      var okB = t.built.join(" ") === t.target.join(" ");
      S.gradeSentence(t.s.id, okB ? 2 : 0);
      SS.items++;
      if (okB) { SS.correct++; SS.sentOk++; SS.chain++; SS.maxChain = Math.max(SS.maxChain, SS.chain); S.addXp(14); }
      else {
        SS.chain = 0; S.addXp(3); SS.retry.push({ type: "build", s: t.s });
        if (S.state.settings.hearts) { S.state.hearts = Math.max(0, S.state.hearts - 1); S.state.heartTs = Date.now(); }
      }
      S.save(); renderHeader();
      verdictSentence(okB, t.s);
      return;
    }
    if (t.type === "spell") {
      var built = t.built.join(""); SS.answered = true;
      var okS = built === t.target;
      var resS = applyGrade(w, okS ? 2 : 0);
      if (!okS) SS.retry.push({ type: "spell", w: w });
      verdict(okS, w, resS);
      return;
    }
    if (SS.pick == null) return;
    SS.answered = true;
    var ok = !!t.opts[SS.pick].ok;
    $$(".opt").forEach(function (b, i) {
      b.disabled = true;
      if (t.opts[i].ok) b.classList.add("right");
      else if (i === SS.pick) b.classList.add("wrong");
    });
    var res2 = applyGrade(w, ok ? 2 : 0);
    if (!ok) SS.retry.push({ type: t.type === "odd" ? "mc_en_de" : t.type, w: w });
    if (ok && (t.type === "listen" || t.type === "mc_en_de")) speak(w.en);
    verdict(ok, w, res2);
  }
  function next() {
    if (!SS) return;
    if (S.state.settings.hearts && S.state.hearts <= 0) return endSession("hearts");
    SS.i++; renderTask();
  }

  /* ---------- Ereignisse ---------- */
  sessionEl.addEventListener("click", function (e) {
    var t = SS && SS.tasks[SS.i];
    var say = e.target.closest("[data-act='say']");
    if (say) { speak(say.getAttribute("data-text"), 0, say.getAttribute("data-lang")); return; }
    var opt = e.target.closest(".opt");
    if (opt && !SS.answered) {
      SS.pick = +opt.getAttribute("data-opt");
      $$(".opt").forEach(function (b) { b.setAttribute("aria-pressed", b === opt); });
      var mb = $("#mainBtn"); if (mb) mb.disabled = false;
      return;
    }
    var tile = e.target.closest(".tile");
    if (tile && t && (t.type === "spell" || t.type === "build") && !SS.answered) {
      tile.classList.add("used"); t.built.push(tile.getAttribute("data-ch"));
      t.usedTiles = (t.usedTiles || []); t.usedTiles.push(tile);
      paintSlot(t);
      $("#mainBtn").disabled = t.built.length !== t.target.length;
      return;
    }
    var mg = e.target.closest("#mg button");
    if (mg && t && t.type === "match" && !SS.answered) return matchTap(t, mg);
    var act = e.target.closest("[data-act]"); if (!act) return;
    var a = act.getAttribute("data-act");
    if (a === "check") check();
    else if (a === "next") next();
    else if (a === "quit") { if (SS && SS.items) endSession("quit"); else closeSession(); }
    else if (a === "close") closeSession();
    else if (a === "again") { closeSession(); startSession({ minutes: S.state.settings.goalMin }); }
    else if (a === "undo" && t && (t.type === "spell" || t.type === "build") && !SS.answered) {
      if (!t.built.length) return;
      t.built.pop(); var el = t.usedTiles.pop(); if (el) el.classList.remove("used");
      paintSlot(t); $("#mainBtn").disabled = true;
    }
  });
  function matchTap(t, btn) {
    var side = btn.getAttribute("data-side"), wid = btn.getAttribute("data-wid");
    if (side === "en") {
      $$("#mg button[data-side='en']").forEach(function (b) { b.classList.remove("sel"); });
      btn.classList.add("sel"); t.sel = { wid: wid, el: btn };
      if (audioAvailable()) speak(S.byId(wid).en);
      return;
    }
    if (!t.sel) return;
    var ok = t.sel.wid === wid;
    if (ok) {
      btn.classList.add("ok"); t.sel.el.classList.add("ok"); t.sel.el.classList.remove("sel");
      t.pairs++; t.sel = null;
      var left = 4 - t.pairs; var lEl = $("#mgLeft"); if (lEl) lEl.textContent = left;
      if (t.pairs === 4) {
        SS.answered = true;
        var g = t.errors === 0 ? 2 : 1;
        t.set.forEach(function (x) { if (x.id !== t.w.id) S.grade(x.id, g); });
        var res = applyGrade(t.w, g);
        verdict(true, t.w, res, t.errors ? t.errors + " Fehlversuch" + (t.errors > 1 ? "e" : "") : null);
      }
    } else {
      t.errors++; btn.classList.add("no");
      setTimeout(function () { btn.classList.remove("no"); }, 500);
    }
  }
  document.addEventListener("keydown", function (e) {
    if (sessionEl.hidden || !SS) return;
    var t = SS.tasks[SS.i];
    if (e.key === "Enter") { var b = $("#mainBtn"); if (b && !b.disabled) { e.preventDefault(); b.click(); } return; }
    if (!SS.answered && t && t.opts && /^[1-4]$/.test(e.key)) {
      var o = $$(".opt")[+e.key - 1]; if (o) o.click();
    }
  });

  view.addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]"); if (!act) return;
    var a = act.getAttribute("data-act"), st = S.state;
    if (a === "say") { if (!speak(act.getAttribute("data-text"), 0, act.getAttribute("data-lang"))) toast("Dieses Gerät hat keine Sprachausgabe bereit."); return; }
    if (a === "install") {
      if (!installPrompt) return toast("Dein Browser bietet die Installation gerade nicht an.");
      installPrompt.prompt();

    } else if (a === "unit") { detailUnit = act.getAttribute("data-id"); render(); }

    else if (a === "restorego") {
      var sel = $("#restoreDay"), dayv = sel ? sel.value : "";
      if (!dayv || !confirm("Lernstand vom " + dayv.split("-").reverse().join(".") + " wiederherstellen? Der Stand auf diesem Gerät wird ersetzt.")) return;

  });

  document.addEventListener("click", function (e) {
