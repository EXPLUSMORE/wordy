<script>/* Arena – vier Zeitmodi zum schnellen Üben.
   Eigene Spielfläche, eigene Optik, angebunden an die Wiederholungslogik. */
(function (global) {
  "use strict";
  var S = global.VT, el = document.getElementById("arena");

  var MODES = [
    { id: "match", icon: "⚡", name: "Match-Rausch",
      tag: "60 Sekunden", claim: "Fünf gegen fünf, so schnell du kannst.",
      desc: "Links fünf Wörter, rechts fünf Übersetzungen in zufälliger Reihenfolge. Jedes Paar, das sitzt, macht Platz für ein neues. Ein Fehlgriff kostet zwei Sekunden." },
    { id: "blitz", icon: "🔥", name: "Blitzrunde",
      tag: "Zeit sammeln", claim: "Jede richtige Antwort kauft dir Zeit.",
      desc: "Du startest mit 40 Sekunden. Richtig bringt anderthalb Sekunden zurück, falsch kostet drei. Die Runde endet, wenn die Uhr leer ist." },
    { id: "survival", icon: "💠", name: "Letztes Herz",
      tag: "Ein Fehler genügt", claim: "Wie weit kommst du ohne Patzer?",
      desc: "Pro Wort läuft ein kurzer Balken ab, und er wird alle fünf Treffer schneller. Ein Fehler oder eine abgelaufene Zeit beendet die Runde sofort." },
    { id: "hunt", icon: "🎯", name: "Fehlerjagd",
      tag: "90 Sekunden", claim: "Nur die Wörter, die dich ärgern.",
      desc: "Gespielt wird ausschließlich mit der Fehlerkartei. Jedes Wort muss zweimal sitzen, dann ist es erledigt. Schaffst du die Kartei leer?" }
  ];

  var run = null, timer = null;

  /* ---------- Hilfen ---------- */
  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function $(s, r) { return (r || el).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || el).querySelectorAll(s)); }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function key(id) { return id + ":" + S.state.settings.track; }
  function best(id) { var a = S.state.arena || {}; return a[key(id)] || { best: 0, plays: 0 }; }

  /* Wortpool: Fehlerkartei und fällige Wörter zuerst, dann der Rest */
  function pool(mode) {
    var p = S.pools(), list;
    if (mode === "hunt") {
      list = p.box.slice();
      if (list.length < 6) {
        var weak = p.all.filter(function (w) { var r = S.state.w[w.id]; return r && r.no > 0; });
        list = list.concat(weak.filter(function (w) { return list.indexOf(w) < 0; }));
      }
      if (list.length < 6) list = list.concat(S.shuffle(p.all.slice()).slice(0, 12 - list.length));
    } else {
      list = S.shuffle(p.box.slice()).concat(S.shuffle(p.due.slice()), S.shuffle(p.learning.slice()), S.shuffle(p.fresh.slice()));
    }
    var seenDe = {}, seenEn = {};
    return list.filter(function (w) {
      if (seenDe[w.de] || seenEn[w.en]) return false;
      seenDe[w.de] = seenEn[w.en] = 1; return true;
    });
  }
  function nextWord() {
    if (!run.queue.length) run.queue = pool(run.mode);
    return run.queue.shift();
  }
  function distractors(w, n) {
    var all = run.all.filter(function (x) { return x.id !== w.id && x.de !== w.de && x.en !== w.en; });
    var same = all.filter(function (x) { return x.unit === w.unit; });
    return S.shuffle(same).slice(0, n).concat(S.shuffle(all).slice(0, n)).slice(0, n);
  }

  /* ---------- Punkte ---------- */
  function hit(w, weight) {
    run.combo++; run.maxCombo = Math.max(run.maxCombo, run.combo);
    var mult = Math.min(3, 1 + run.combo * 0.1);
    var pts = Math.round(10 * mult * (weight || 1));
    run.score += pts; run.correct++; run.items++;
    if (w) { if (global.WordySync) global.WordySync.ctx = { mode: "arena" }; S.grade(w.id, 1); }            // Tempo zählt als sichere, nicht als tiefe Wiederholung
    S.addXp(2);
    flash("+" + pts, run.combo >= 5 ? "combo" : "ok");
    var pr = S.state.profile;
    if (S.state.settings.audio) global.VTC.sound(pr.snd, true);
    global.VTC.burst(pr.fx, global.innerWidth / 2, global.innerHeight * .5, 10, .9);
    return pts;
  }
  function miss(w) {
    run.combo = 0; run.items++; run.wrong++;
    if (w) { if (global.WordySync) global.WordySync.ctx = { mode: "arena" }; S.grade(w.id, 0); }
    buzz(35);
    shake();
    if (S.state.settings.audio) global.VTC.sound(S.state.profile.snd, false);
  }
  function flash(text, kind) {
    var f = $("#arFlash"); if (!f) return;
    f.textContent = text; f.className = "ar-flash " + (kind || "ok") + " show";
    setTimeout(function () { if (f) f.className = "ar-flash " + (kind || "ok"); }, 420);
  }
  function shake() {
    var b = $("#arBoard"); if (!b) return;
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  }

  /* ---------- Rahmen ---------- */
  function chrome(inner) {
    var t = run.mode === "survival" ? "" :
      '<div class="ar-time"><i id="arBar" style="width:100%"></i></div>';
    return '<div class="ar-top">' +
      '<button class="ar-x" data-a="quit" aria-label="Arena verlassen">✕</button>' +
      '<div class="ar-clock tnum" id="arClock">' + fmt(run.left) + '</div>' +
      '<div class="ar-score"><b class="tnum" id="arScore">0</b><span>Punkte</span></div>' +
      '</div>' + t +
      '<div class="ar-sub"><span id="arCombo" class="ar-combo"></span><span id="arNote">' + esc(run.note || "") + '</span></div>' +
      '<div class="ar-board" id="arBoard">' + inner + '</div>' +
      '<div class="ar-flash" id="arFlash"></div>';
  }
  function fmt(ms) {
    var s = Math.max(0, ms / 1000);
    return s >= 10 ? s.toFixed(0) : s.toFixed(1);
  }
  function paintHud() {
    var c = $("#arClock"); if (c) c.textContent = fmt(run.left);
    var sc = $("#arScore"); if (sc) sc.textContent = run.score;
    var cb = $("#arCombo");
    if (cb) {
      cb.textContent = run.combo >= 3 ? "×" + (Math.min(3, 1 + run.combo * 0.1)).toFixed(1) + " Serie " + run.combo : "";
      cb.className = "ar-combo" + (run.combo >= 8 ? " hot" : "");
    }
    var bar = $("#arBar");
    if (bar) {
      var pct = Math.max(0, Math.min(100, run.left / run.total * 100));
      bar.style.width = pct + "%";
      bar.className = pct < 20 ? "low" : pct < 45 ? "mid" : "";
    }
    if (run.mode === "hunt") { var n = $("#arNote"); if (n) n.textContent = "Noch " + run.targets.length + " in der Kartei"; }
  }

  /* ---------- Takt ---------- */
  function startClock() {
    var last = Date.now();
    timer = setInterval(function () {
      if (!run) return stopClock();
      var now = Date.now(), d = now - last; last = now;
      run.left -= d;
      if (run.mode === "survival") {
        run.qLeft -= d;
        var qb = $("#arQbar");
        if (qb) {
          var p = Math.max(0, run.qLeft / run.qTotal * 100);
          qb.style.width = p + "%";
          qb.className = p < 30 ? "low" : p < 60 ? "mid" : "";
        }
        if (run.qLeft <= 0) { miss(run.cur); return finish("timeout"); }
        var c = $("#arClock"); if (c) c.textContent = run.correct;
        return;
      }
      if (run.left <= 0) { run.left = 0; paintHud(); return finish("time"); }
      paintHud();
    }, 90);
  }
  function stopClock() { if (timer) clearInterval(timer); timer = null; }

  /* ================= Modus 1: Match-Rausch ================= */
  function renderMatch() {
    run.left = run.total = 60000;
    run.dir = Math.random() < 0.5 ? "de2en" : "en2de";
    run.note = run.dir === "de2en" ? "Deutsch → Englisch" : "Englisch → Deutsch";
    run.left5 = []; run.right5 = []; run.sel = null;
    for (var i = 0; i < 5; i++) { var w = nextWord(); run.left5.push(w); run.right5.push(w); }
    run.right5 = S.shuffle(run.right5);
    el.innerHTML = chrome('<div class="ar-match" id="arMatch"></div>');
    paintMatch(); startClock();
  }
  function side(w, which) {
    return run.dir === "de2en" ? (which === "l" ? w.de : w.en) : (which === "l" ? w.en : w.de);
  }
  function paintMatch() {
    var m = $("#arMatch"); if (!m) return;
    m.innerHTML =
      '<div class="ar-col">' + run.left5.map(function (w, i) {
        return w ? '<button class="ar-tile' + (run.sel === i ? " sel" : "") + '" data-l="' + i + '">' + esc(side(w, "l")) + '</button>'
                 : '<span class="ar-tile gone"></span>';
      }).join("") + '</div>' +
      '<div class="ar-col">' + run.right5.map(function (w, i) {
        return w ? '<button class="ar-tile" data-r="' + i + '">' + esc(side(w, "r")) + '</button>'
                 : '<span class="ar-tile gone"></span>';
      }).join("") + '</div>';
  }
  function tapMatch(l, r) {
    if (l != null) {
      run.sel = run.sel === l ? null : l;
      $$("[data-l]").forEach(function (t) { t.classList.toggle("sel", +t.getAttribute("data-l") === run.sel); });
      return;
    }
    if (run.sel == null) return;
    var lw = run.left5[run.sel], rw = run.right5[r];
    if (!lw || !rw) return;
    if (lw.id === rw.id) {
      hit(lw, 1);
      var li = run.sel, ri = r;
      run.sel = null;
      var tiles = $$("[data-l='" + li + "'],[data-r='" + ri + "']");
      tiles.forEach(function (t) { t.classList.add("pop"); });
      setTimeout(function () {
        if (!run || run.mode !== "match") return;
        var nw = nextWord();
        run.left5[li] = nw; run.right5[ri] = nw;
        var swap = Math.floor(Math.random() * 5);        // neue Übersetzung nicht auf Höhe des Partners lassen
        var tmp = run.right5[ri]; run.right5[ri] = run.right5[swap]; run.right5[swap] = tmp;
        paintMatch();
      }, 150);
      paintHud();
    } else {
      miss(lw);
      run.left -= 2000;
      run.sel = null;
      var wrongTile = $("[data-r='" + r + "']");
      if (wrongTile) { wrongTile.classList.add("bad"); setTimeout(function () { wrongTile.classList.remove("bad"); }, 320); }
      $$("[data-l]").forEach(function (t) { t.classList.remove("sel"); });
      paintHud();
    }
  }

  /* ================= Modus 2 & 4: Karten mit Auswahl ================= */
  function renderCard() {
    var w = nextWord();
    if (run.mode === "hunt") {
      if (!run.targets.length) return finish("cleared");
      w = run.targets[Math.floor(Math.random() * run.targets.length)];
    }
    run.cur = w;
    var ask = Math.random() < 0.5 ? "en" : "de";
    run.ask = ask;
    var opts = S.shuffle(distractors(w, 3).map(function (x) { return { t: ask === "en" ? x.de : x.en, ok: false }; })
      .concat([{ t: ask === "en" ? w.de : w.en, ok: true }]));
    run.opts = opts;
    var qbar = run.mode === "survival"
      ? '<div class="ar-qbar"><i id="arQbar" style="width:100%"></i></div>' : "";
    var inner = '<div class="ar-card">' +
      '<div class="ar-ask">' + (ask === "en" ? "auf Deutsch" : "auf Englisch") + '</div>' +
      '<div class="ar-word">' + esc(ask === "en" ? w.en : w.de) + '</div>' + qbar +
      '<div class="ar-opts">' + opts.map(function (o, i) {
        return '<button class="ar-opt" data-o="' + i + '">' + esc(o.t) + '</button>';
      }).join("") + '</div></div>';
    if ($("#arBoard")) { $("#arBoard").innerHTML = inner; }
    else el.innerHTML = chrome(inner);
    if (run.mode === "survival") { run.qLeft = run.qTotal; var c = $("#arClock"); if (c) c.textContent = run.correct; }
    paintHud();
  }
  function tapOpt(i) {
    if (!run || run.locked) return;
    var o = run.opts[i], w = run.cur;
    var btns = $$(".ar-opt");
    if (o.ok) {
      btns[i].classList.add("right");
      hit(w, run.mode === "hunt" ? 1.4 : 1);
      if (run.mode === "blitz") run.left = Math.min(run.cap, run.left + 1500);
      if (run.mode === "survival") {
        if (run.correct % 5 === 0) run.qTotal = Math.max(2800, run.qTotal - 300);
      }
      if (run.mode === "hunt") {
        run.hits[w.id] = (run.hits[w.id] || 0) + 1;
        if (run.hits[w.id] >= 2) {
          run.targets = run.targets.filter(function (x) { return x.id !== w.id; });
          run.cleared++;
          flash("erledigt!", "combo");
          if (!run.targets.length) { paintHud(); return setTimeout(function () { finish("cleared"); }, 250); }
        }
      }
    } else {
      btns[i].classList.add("wrong");
      btns.forEach(function (b, j) { if (run.opts[j].ok) b.classList.add("right"); });
      miss(w);
      if (run.mode === "blitz") run.left -= 3000;
      if (run.mode === "hunt") { run.hits[w.id] = 0; run.left -= 2000; }
      if (run.mode === "survival") { paintHud(); run.locked = true; return setTimeout(function () { finish("dead"); }, 600); }
    }
    paintHud();
    run.locked = true;
    setTimeout(function () {
      if (!run) return;
      run.locked = false;
      if (run.left > 0 || run.mode === "survival") renderCard();
    }, o.ok ? 150 : 550);
  }

  /* ---------- Start & Ende ---------- */
  function start(mode) {
    var p = S.pools();
    if (p.all.length < 8) return global.VTUI.toast("Für die Arena brauchst du mindestens acht Wörter im gewählten Bereich.");
    if (mode === "hunt" && !p.box.length) global.VTUI.toast("Fehlerkartei ist leer – gespielt wird mit deinen wackeligsten Wörtern.");
    S.rollDay();
    run = {
      mode: mode, score: 0, combo: 0, maxCombo: 0, items: 0, correct: 0, wrong: 0,
      start: Date.now(), left: 0, total: 0, queue: [], all: p.all, locked: false,
      qTotal: 7000, qLeft: 7000, targets: [], hits: {}, cleared: 0, note: ""
    };
    run.queue = pool(mode);
    el.hidden = false;
    document.documentElement.classList.add("ar-open");
    if (mode === "match") return renderMatch();
    if (mode === "blitz") { run.left = 40000; run.total = 60000; run.cap = 60000; run.note = "Richtig bringt Zeit, bis 60 Sekunden"; }
    if (mode === "survival") { run.left = run.total = 0; run.note = "Ein Fehler beendet die Runde"; }
    if (mode === "hunt") {
      run.left = run.total = 90000;
      run.targets = run.queue.slice(0, 10);
      run.note = "Noch " + run.targets.length + " in der Kartei";
    }
    el.innerHTML = chrome("");
    if (mode === "survival") { var c = $("#arClock"); if (c) c.textContent = "0"; }
    renderCard(); startClock();
  }

  function finish(reason) {
    if (!run || run.done) return;
    run.done = true; stopClock();
    var sec = Math.round((Date.now() - run.start) / 1000);
    var m = MODES.filter(function (x) { return x.id === run.mode; })[0];
    var score = run.mode === "survival" ? run.correct : run.score;
    var rec = best(run.mode), isRecord = score > rec.best;
    if (!S.state.arena) S.state.arena = {};
    S.state.arena[key(run.mode)] = { best: Math.max(rec.best, score), plays: rec.plays + 1 };
    var coins = Math.min(40, Math.floor(score / 40)) + (isRecord ? 10 : 0);
    if (global.WordySync) { global.WordySync.sessionEnd({ sec: sec, items: run.items, correct: run.correct, mode: "arena", sub: run.mode, score: score, coins: coins }); global.WordySync.ctx = null; }
    S.rollDay();
    var left = Math.max(0, 30 - (S.state.daily.arenaCoins || 0));   // Tageslimit, damit dieselben Wörter nicht endlos Münzen bringen
    var capped = coins > left; coins = Math.min(coins, left);
    S.state.daily.arenaCoins = (S.state.daily.arenaCoins || 0) + coins;
    S.addCoins(coins);
    S.addXp(Math.min(60, Math.round(score / 8)));
    var rw = S.finishSession({ items: run.items, correct: run.correct, sec: sec, maxChain: run.maxCombo, newSeen: 0, boxSolved: run.cleared, mastered: 0, sentOk: 0 });
    var fresh = [];
    function give(id) {
      if (S.state.badges.indexOf(id) < 0) {
        S.state.badges.push(id);
        var b = S.BADGES.filter(function (x) { return x.id === id; })[0];
        if (b) fresh.push(b);
      }
    }
    give("arena1");
    if (run.maxCombo >= 15) give("combo15");
    var acc = run.items ? Math.round(run.correct * 100 / run.items) : 0;
    var head = reason === "cleared" ? "Kartei leer geräumt!"
      : isRecord ? "Neuer Bestwert!"
      : reason === "dead" ? "Erwischt."
      : reason === "timeout" ? "Zeit abgelaufen."
      : "Runde vorbei";
    var line = run.mode === "survival"
      ? run.correct + " " + (run.correct === 1 ? "Wort" : "Wörter") + " am Stück"
      : score + " Punkte";
    el.innerHTML = '<div class="ar-end">' +
      '<div class="ar-endicon">' + (isRecord ? "🏆" : reason === "cleared" ? "🎯" : esc(m.icon)) + '</div>' +
      '<h1>' + esc(head) + '</h1>' +
      '<div class="ar-big tnum">' + esc(line) + '</div>' +
      '<div class="ar-stats">' +
      '<div><b class="tnum">' + run.correct + '</b><span>richtig</span></div>' +
      '<div><b class="tnum">' + acc + '%</b><span>Trefferquote</span></div>' +
      '<div><b class="tnum">' + run.maxCombo + '</b><span>beste Serie</span></div>' +
      '<div><b class="tnum">' + Math.max(rec.best, score) + '</b><span>Bestwert</span></div>' +
      '</div>' +
      '<p class="ar-note">' + (coins ? "🪙 " + coins + " Münzen" + (capped ? " (Tageslimit der Arena erreicht)" : "") : (capped ? "Arena-Münzen für heute sind voll – lerne neue Wörter für mehr" : "Keine Münzen diesmal")) +
      (rw.goalReached ? " · Tagesziel erreicht" : "") +
      (run.cleared ? " · " + run.cleared + " aus der Fehlerkartei befreit" : "") + '</p>' +
      (fresh.length ? '<p class="ar-note" style="color:var(--ar-gold)">🏅 Neu: ' + fresh.map(function (b) { return esc(b.n); }).join(", ") + '</p>' : "") +
      '<div class="ar-endbtns"><button class="ar-btn" data-a="again">Noch mal</button>' +
      '<button class="ar-btn ghost" data-a="quit">Zurück</button></div></div>';
    S.save(true);
    if (global.VTUI && global.VTUI.refreshHeader) global.VTUI.refreshHeader();
  }

  function close() {
    stopClock();
    var again = run && run.mode;
    run = null;
    el.hidden = true; el.innerHTML = "";
    document.documentElement.classList.remove("ar-open");
    if (global.VTUI && global.VTUI.afterArena) global.VTUI.afterArena();
    return again;
  }

  el.addEventListener("click", function (e) {
    if (!run) { var q0 = e.target.closest("[data-a]"); if (q0) close(); return; }
    var t = e.target.closest("[data-a]");
    if (t) {
      var a = t.getAttribute("data-a");
      if (a === "quit") { if (!run.done) finish("quit"); else close(); return; }
      if (a === "again") { var m = run.mode; close(); return start(m); }
    }
    if (run.done) return;
    var l = e.target.closest("[data-l]"), r = e.target.closest("[data-r]");
    if (l) return tapMatch(+l.getAttribute("data-l"), null);
    if (r) return tapMatch(null, +r.getAttribute("data-r"));
    var o = e.target.closest("[data-o]");
    if (o) return tapOpt(+o.getAttribute("data-o"));
  });
  document.addEventListener("keydown", function (e) {
    if (!run || el.hidden || run.done) return;
    if (/^[1-4]$/.test(e.key)) { var o = $$(".ar-opt")[+e.key - 1]; if (o) o.click(); }
    if (e.key === "Escape") finish("quit");
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && run && !run.done && run.mode !== "survival") finish("quit");
  });

  global.ARENA = { MODES: MODES, start: start, best: best, close: close, open: function () { return !el.hidden; } };
})(window);
</script>
<script>/* Sync: sendet den Lernverlauf an den Wordy-Server (Dashboard).
   Offline-zuerst: Ereignisse landen in einer Warteschlange und gehen raus, sobald es Netz gibt.
   Ohne Verbindung zum Server passiert nichts, die App arbeitet wie bisher. */
(function (g) {
  "use strict";
  var VT = g.VT, W = g.WordySync = { ctx: null }, timer = null, busy = false, lastSnap = 0;
  var MAX_Q = 4000, BATCH = 200;

  function pid() { try { return VT.profiles().active; } catch (e) { return "p1"; } }
  function lsGet(k) { try { return JSON.parse(g.localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { g.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function cfg() { return lsGet("wordy.sync." + pid()); }
  function queue() { return lsGet("wordy.q." + pid()) || []; }
  function saveQ(a) { lsSet("wordy.q." + pid(), a.slice(-MAX_Q)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  W.connected = function () { var c = cfg(); return !!(c && c.url && c.token); };
  W.info = function () { var c = cfg() || {}; return { connected: W.connected(), name: c.name || "", url: c.url || "", last: c.last || 0, pending: queue().length, error: c.err || "", stateAt: c.stateAt || 0, stateErr: c.stateErr || "", hidden: !!c.hidden }; };

  /* Ereignis vormerken (nur wenn verbunden) */
  W.log = function (kind, d) {
    if (!W.connected() || (cfg() || {}).hidden) return;   // "nur sichern": keine Lernereignisse senden
    var q = queue(), data = d || {};
    if (W.ctx && W.ctx.mode && !data.m) data.m = W.ctx.mode;
    q.push({ i: uid(), t: Date.now(), k: kind, d: data });
    saveQ(q);
    if (q.length >= 25) flush(); else if (!timer) timer = setTimeout(function () { timer = null; flush(); }, 20000);
  };

  function post(c, path, body, keep) {
    return g.fetch(c.url + path, { method: "POST", keepalive: !!keep, headers: { "Content-Type": "application/json", Authorization: "Bearer " + c.token }, body: JSON.stringify(body) });
  }
  function setCfg(patch) { var c = cfg(); if (!c) return; for (var k in patch) c[k] = patch[k]; lsSet("wordy.sync." + pid(), c); }

  function flush(keep) {
    var c = cfg();
    if (!c || !c.token || busy || !g.fetch) return Promise.resolve(false);
    var q = queue(); if (!q.length) return Promise.resolve(true);
    busy = true;
    var batch = q.slice(0, BATCH);
    return post(c, "/api/events", { events: batch }, keep).then(function (r) {
      if (r.status === 401) { setCfg({ err: "Die Verbindung wurde von den Eltern getrennt." }); throw new Error("401"); }
      if (!r.ok) throw new Error(String(r.status));
      var cur = queue(), sent = {}; batch.forEach(function (e) { sent[e.i] = 1; });
      saveQ(cur.filter(function (e) { return !sent[e.i]; }));
      setCfg({ last: Date.now(), err: "" });
      busy = false;
      return queue().length ? flush(keep) : true;
    }).catch(function (e) { busy = false; if (String(e.message) !== "401") setCfg({ err: "Server gerade nicht erreichbar, es wird später erneut versucht." }); return false; });
  }
  W.flush = function () { return flush(false); };

  /* Stand der Wörter, Einheiten und Münzen: damit sieht man auch, was schon vor der Verbindung gelernt war */
  W.snapshot = function () {
    var c = cfg(); if (!c || !c.token || !g.fetch) return Promise.resolve(false);
    var st = VT.state, words = {}, units = {}, id;
    if (c.hidden) return Promise.resolve(false);
    if (VT.isFresh()) return Promise.resolve(false);   // ein leerer Stand (neues Gerät) darf die Übersicht auf dem Server nicht überschreiben
    for (id in st.w) { var r = st.w[id]; if (r && r.reps != null) words[id] = [VT.levelOf(id), r.ok || 0, r.no || 0, r.last || 0]; }
    VT.units().forEach(function (u) { if (u.track === "schule") units[u.id] = { id: u.id, title: u.title, k: u.k, total: u.words.length }; });
    var rk = VT.rankOf(st.xp), d = st.daily || {};
    var meta = {
      name: st.profile.name || "", coins: st.coins, xp: st.xp, rank: rk.rank ? rk.rank.n : "", streak: st.streak.count, best: st.streak.best,
      goalMin: st.settings.goalMin, todaySec: d.sec || 0, todayItems: d.items || 0, owned: (st.profile.owned || []).length,
      wish: (VT.wish && VT.wish()) ? VT.wish().label || VT.wish().id : "", klassen: st.settings.klassen, version: g.WORDY_VERSION || "", totals: st.totals
    };
    lastSnap = Date.now();
    var body = { words: words, catalog: Object.keys(units).map(function (k) { return units[k]; }), meta: meta }, tp = textsPayload();
    if (tp.sig !== c.textsSig) body.texts = tp.texts;
    return post(c, "/api/snapshot", body).then(function (r) { if (r.ok && body.texts) setCfg({ textsSig: tp.sig }); return r.ok; }).catch(function () { return false; });
  };


  /* ---------- Ziele und Lernpläne der Eltern ---------- */
  var lastPull = 0;
  function addDays(d, n) { var a = d.split("-").map(Number); return new Date(Date.UTC(a[0], a[1] - 1, a[2] + n)).toISOString().slice(0, 10); }
  function monday(d) { var a = d.split("-").map(Number), wd = (new Date(Date.UTC(a[0], a[1] - 1, a[2])).getUTCDay() + 6) % 7; return addDays(d, -wd); }
  function dayDiff(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000); }
  function dayStat(k) { var st = VT.state; return st.daily && st.daily.date === k ? st.daily : st.history[k]; }
  W.remote = function () { return lsGet("wordy.cfg." + pid()) || { goals: [], plans: [] }; };

  W.progress = function (goal) {
    var cur = 0, i, h;
    if (goal.kind === "unit") {
      var total = 0, ok = 0;
      VT.units().forEach(function (u) {
        if (goal.scope.indexOf(u.id) < 0) return;
        total += u.words.length;
        for (i = 0; i < u.words.length; i++) if (VT.levelOf(u.id + "#" + i) >= 3) ok++;
      });
      cur = total ? Math.round(ok * 100 / total) : 0;
    } else {
      for (i = 0; i < 7; i++) {
        h = dayStat(addDays(goal.week, i)); if (!h) continue;
        if (goal.kind === "minutes") cur += (h.sec || 0) / 60;
        else if (goal.kind === "days") { if ((h.sec || 0) >= 300) cur++; }
        else if (goal.kind === "newwords") cur += h.newSeen || 0;
      }
      cur = Math.round(cur);
    }
    return { cur: cur, pct: Math.min(100, Math.round(cur * 100 / Math.max(1, goal.target))) };
  };
  W.planInfo = function (pl) {
    var total = 0, ok = 0, today = VT.today();
    VT.words().forEach(function (w) { if (pl.units.indexOf(w.unit) >= 0) { total++; if (VT.levelOf(w.id) >= 3) ok++; } });
    var days = dayDiff(today, pl.exam), learnDays = Math.max(1, days);
    return { total: total, ok: ok, pct: total ? Math.round(ok * 100 / total) : 0, days: days, quota: Math.ceil((total - ok) / learnDays) };
  };
  W.currentGoals = function () { var mon = monday(VT.today()); return W.remote().goals.filter(function (g) { return g.week === mon; }); };
  W.activePlans = function () { var t = VT.today(); return W.remote().plans.filter(function (p) { return p.exam >= t; }); };

  /* Prüft Ziele und Pläne; vergibt Bonusmünzen genau einmal */
  W.check = function () {
    if (!W.connected()) return;
    var st = VT.state, got = [];
    if (!st.goalsDone) st.goalsDone = {};
    W.currentGoals().forEach(function (g) {
      var key = "g" + g.id; if (st.goalsDone[key]) return;
      if (W.progress(g).cur >= g.target) { st.goalsDone[key] = 1; VT.parentCoins(g.coins); W.log("goal", { id: g.id, done: 1 }); got.push({ title: g.title, coins: g.coins, kind: "goal" }); }
    });
    W.activePlans().forEach(function (pl) {
      var key = "p" + pl.id; if (st.goalsDone[key]) return;
      if (W.planInfo(pl).pct >= 90) { st.goalsDone[key] = 1; VT.parentCoins(pl.coins); W.log("plan", { id: pl.id, done: 1 }); got.push({ title: pl.title, coins: pl.coins, kind: "plan" }); }
    });
    if (got.length) { VT.save(true); if (g.WordyHooks && g.WordyHooks.onReward) g.WordyHooks.onReward(got); }
  };

  W.pull = function (force) {
    var c = cfg(); if (!c || !c.token || !g.fetch || c.hidden) return Promise.resolve(false);
    if (!force && Date.now() - lastPull < 3 * 60000) return Promise.resolve(false);
    lastPull = Date.now();
    return g.fetch(c.url + "/api/sync", { headers: { Authorization: "Bearer " + c.token } })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (j) { lsSet("wordy.cfg." + pid(), { goals: j.goals || [], plans: j.plans || [], t: Date.now() }); W.check(); if (g.WordyHooks && g.WordyHooks.onChange) g.WordyHooks.onChange(); return true; })
      .catch(function () { return false; });
  };

  /* Wörter der Einheiten im Klartext, damit das Dashboard sie anzeigen kann (nur wenn sich etwas geändert hat) */
  function textsPayload() {
    var st = VT.state, sel = st.settings.klassen || [], out = {}, sig = "";
    VT.units().forEach(function (u) {
      if (u.track !== "schule") return;
      var touched = false, i;
      if (sel.indexOf(u.k) < 0) { for (i = 0; i < u.words.length && !touched; i++) if (st.w[u.id + "#" + i]) touched = true; if (!touched) return; }
      out[u.id] = u.words.map(function (w) { return [w[0], w[1]]; }); sig += u.id + ":" + u.words.length + ";";
    });
    return { texts: out, sig: sig };
  }


  /* ---------- Vollständige Sicherung des Lernstands auf dem Server ---------- */
  var lastState = 0;
  function api(c, method, path, body) {
    return g.fetch(c.url + path, { method: method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + c.token }, body: body ? JSON.stringify(body) : undefined });
  }
  W.pushState = function (force) {
    var c = cfg(); if (!c || !c.token || !g.fetch) return Promise.resolve(false);
    if (VT.isFresh()) return Promise.resolve(false);
    if (!force && Date.now() - lastState < 10 * 60000) return Promise.resolve(false);
    lastState = Date.now();
    return api(c, "PUT", "/api/state", { state: VT.state }).then(function (r) {
      if (r.status === 409) { setCfg({ stateErr: "Der Server hat einen Lernstand mit Fortschritt. Bitte unter Setup zuerst wiederherstellen." }); return false; }
      if (!r.ok) throw new Error(String(r.status));
      setCfg({ stateAt: Date.now(), stateErr: "" }); return true;
    }).catch(function () { lastState = 0; return false; });
  };
  W.stateList = function () {
    var c = cfg(); if (!c || !c.token) return Promise.resolve([]);
    return api(c, "GET", "/api/state/list").then(function (r) { return r.ok ? r.json() : { items: [] }; }).then(function (j) { return j.items || []; }).catch(function () { return []; });
  };
  W.restore = function (day) {
    var c = cfg(); if (!c || !c.token) return Promise.resolve({ error: "Nicht verbunden." });
    return api(c, "GET", "/api/state" + (day ? "?day=" + encodeURIComponent(day) : "")).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (!x.ok) return { error: x.j && x.j.error || "Wiederherstellen hat nicht geklappt." };
        var res = VT.restoreState(x.j.state); if (res.error) return res;
        setCfg({ stateErr: "" }); lastState = 0;
        return W.snapshot().then(function () { return W.pull(true); }).then(function () { return { ok: true, ts: x.j.ts, coins: x.j.coins }; });
      }).catch(function () { return { error: "Der Server ist nicht erreichbar." }; });
  };

  /* Verbinden mit dem Code der Eltern: "https://server#ABCD-EFGH" */
  W.pair = function (text) {
    var s = String(text || "").trim(), m = s.match(/^(https?:\/\/[^\s#]+?)\/?#?\s*([A-Za-z0-9]{4}-?[A-Za-z0-9]{4})$/);
    if (!m) return Promise.resolve({ error: "Bitte den ganzen Code einfügen, so wie ihn das Dashboard zeigt (Adresse und Code)." });
    var url = m[1].replace(/\/+$/, "");
    return g.fetch(url + "/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: m[2], device: (g.navigator && g.navigator.userAgent || "").slice(0, 70) }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (!x.ok) return { error: x.j && x.j.error || "Verbinden hat nicht geklappt." };
        lsSet("wordy.sync." + pid(), { url: url, token: x.j.token, name: x.j.name, last: 0, hidden: !!x.j.hidden });
        W.log("hello", { v: g.WORDY_VERSION || "" });
        if (VT.isFresh()) return flush(false).then(function () { return W.pull(true); }).then(function () { return W.stateList(); }).then(function (l) { return { ok: true, name: x.j.name, backups: l }; });
        return W.snapshot().then(function () { return flush(false); }).then(function () { return W.pull(true); }).then(function () { W.pushState(true); return { ok: true, name: x.j.name }; });
      }).catch(function () { return { error: "Der Server ist nicht erreichbar. Gibt es Netz, und stimmt die Adresse?" }; });
  };
  W.disconnect = function () { try { g.localStorage.removeItem("wordy.sync." + pid()); g.localStorage.removeItem("wordy.q." + pid()); g.localStorage.removeItem("wordy.cfg." + pid()); } catch (e) {} };

  /* Aus der App: Ende einer Lernrunde */
  W.sessionEnd = function (d) {
    if (!W.connected()) return;
    if ((cfg() || {}).hidden) { W.pushState(true); return; }
    W.log("ss", d);
    W.check();
    flush(false).then(function () { return W.snapshot(); }).then(function () { return W.pull(true); }).then(function () { return W.pushState(true); });
  };
  W.maybeSnapshot = function () { if (W.connected() && Date.now() - lastSnap > 10 * 60000) W.snapshot(); };

  g.addEventListener("visibilitychange", function () { if (g.document.visibilityState === "hidden") { flush(true); W.pushState(false); } else { flush(false); W.pull(false); } });
  g.addEventListener("online", function () { flush(false); });
  setTimeout(function () { flush(false); W.maybeSnapshot(); W.pull(true); }, 4000);
})(window);
</script>
