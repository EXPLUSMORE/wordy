<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wordy Lernfortschritt</title>
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#16222B;--ink2:#52606B;--line:#E1E6EA;--acc:#1E6273;--acc2:#2E8BA0;--good:#2E8B57;--bad:#C0392B;--warn:#D9962B;--l1:#E2B93B;--l2:#E69A3A;--l3:#4FA6B8;--l4:#2E8B57}
@media (prefers-color-scheme:dark){:root{--bg:#10171C;--card:#18222A;--ink:#E8EEF2;--ink2:#9AA9B4;--line:#26333D;--acc:#5BB6CA;--acc2:#7CC8D9;--good:#58C48B;--bad:#EF6F62;--warn:#E8B054;--l1:#C9A233;--l2:#D18A33;--l3:#4698AA;--l4:#4DB380}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;overflow-x:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.muted{color:var(--ink2)}.small{font-size:13px}
button,input{font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button.tab{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.ghost[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
button.tab[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--ink2);font-weight:600;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.code{font:600 15px ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;word-break:break-all}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--ink2);font-size:10px}
.err{color:var(--bad)}
select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-top:12px}
.form label{font-size:12px;color:var(--ink2);display:block;margin-bottom:3px}
.form input,.form select{width:100%}
.pick{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px;background:var(--bg)}
.pick label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);padding:2px 0;margin:0}
.pick b.g{display:block;font-size:12px;color:var(--ink2);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.06em}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.goal{flex-wrap:wrap}.goal .t{flex:1 1 220px;min-width:0}
input[type=checkbox]{width:auto;padding:0;margin:0;flex:none}
.goal .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}.mini i{display:block;height:100%;background:var(--acc2)}.mini i.d{background:var(--good)}
button.sm{padding:5px 10px;font-size:13px}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--bg)}
.pill.l0{color:var(--ink2)}.pill.l1{border-color:var(--l1)}.pill.l2{border-color:var(--l2)}.pill.l3{border-color:var(--l3)}.pill.l4{border-color:var(--l4);color:var(--good)}
</style>
</head>
<body>
<main>
  <h1>📚 Wordy · Lernfortschritt</h1>
  <div id="tabs" class="row" style="margin-bottom:12px"></div>
  <div id="view"></div>
</main>
<script>
(function () {
  var view = document.getElementById("view"), tabs = document.getElementById("tabs");
  var players = [], cur = null, days = 14;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function api(path, opt) {
    return fetch(path, Object.assign({ credentials: "same-origin" }, opt || {})).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }
  function post(path, body) { return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); }
  function fmtMin(s) { var m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + " Std. " + (m % 60) + " Min." : m + " Min."; }
  function fmtAgo(t) {
    if (!t) return "noch nie";
    var m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? "gerade eben" : m < 60 ? "vor " + m + " Min." : m < 1440 ? "vor " + Math.round(m / 60) + " Std." : "vor " + Math.round(m / 1440) + " Tagen";
  }
  function fmtDate(ts) { return new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
  function pct(a, b) { return b ? Math.round(a * 100 / b) + " %" : "–"; }
  var MODE = { mix: "Gemischt", new: "Neue Wörter", box: "Fehlerkartei", sent: "Sätze", verbs: "Verben", arena: "Arena", unit: "Einheit", plan: "Lernplan", focus: "Gezielt üben" };

  function loadPlayers(keep) {
    return api("/api/admin/players").then(function (l) {
      players = l; if (!cur || !players.some(function (p) { return p.id === cur; })) cur = players[0] ? players[0].id : "new";
      if (keep) cur = keep;
      drawTabs(); return show();
    }).catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
  }
  function drawTabs() {
    tabs.innerHTML = players.map(function (p) { return '<button class="tab" data-p="' + p.id + '" aria-pressed="' + (cur === p.id) + '">' + esc(p.name) + "</button>"; }).join("") +
      '<button class="tab" data-p="new" aria-pressed="' + (cur === "new") + '">＋ Spieler</button>';
  }
  tabs.onclick = function (e) { var b = e.target.closest("button[data-p]"); if (!b) return; cur = b.getAttribute("data-p") === "new" ? "new" : +b.getAttribute("data-p"); drawTabs(); show(); };

  function show() {
    if (cur === "new" || !players.length) return Promise.resolve(viewNew());
    var p = players.filter(function (x) { return x.id === cur; })[0];
    view.innerHTML = '<div class="card muted">Lade …</div>';
    return api("/api/admin/players/" + cur + "/report?days=" + days).then(function (r) { viewPlayer(p, r); })
      .catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
  }

  function viewNew(inv, name) {
    var h = '<div class="card"><h2>Neuen Spieler anlegen</h2><div class="row"><input id="nn" class="grow" maxlength="20" placeholder="Name, z. B. Magnus"><button id="mk">Anlegen</button></div>' +
      '<label class="row" style="margin-top:10px;gap:8px;font-size:14px"><input type="checkbox" id="nh"> <span>Nur sichern, nicht anzeigen <span class="muted">(zum Beispiel für dich selbst: der Lernstand wird gesichert, aber es gibt keine Zahlen, Ziele oder Mails dazu)</span></span></label>' +
      '<p class="small muted" style="margin:10px 0 0">Es reicht ein Vorname. Danach erscheint ein Code, den du in der App unter Setup → Auto-Save / Lernfortschritt einfügst.</p></div>';
    if (inv) h = inviteCard(name, inv) + h;
    h += '<div id="hiddenList"></div>';
    view.innerHTML = h;
    var b = document.getElementById("mk");
    if (b) b.onclick = function () {
      var n = document.getElementById("nn").value.trim(); if (!n) return;
      var hid = document.getElementById("nh").checked;
      post("/api/admin/players", { name: n, hidden: hid }).then(function (r) {
        if (hid) { viewNew(r.invite, r.name); loadHidden(); return; }
        return loadPlayers(r.id).then(function () { showInvite(r.name, r.invite); });
      }).catch(function (e) { alert(e.message); });
    };
    var cp = document.getElementById("cp"); if (cp) wireCopy();
    loadHidden();
  }
  function wireCopy() {
    document.getElementById("cp").onclick = function () {
      var t = document.getElementById("ic").textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { document.getElementById("cp").textContent = "Kopiert ✓"; }, function () { prompt("Code kopieren:", t); });
    };
  }
  function loadHidden() {
    api("/api/admin/players?hidden=1").then(function (l) {
      var el = document.getElementById("hiddenList"); if (!el || !l.length) return;
      el.innerHTML = '<div class="card"><h2>Nur gesicherte Spieler</h2><p class="small muted" style="margin:0 0 6px">Sie sind in der Übersicht und in der Wochenmail nicht zu sehen. Der Server hält nur ihren Lernstand als Sicherung bereit.</p>' + l.map(function (p) {
        return '<div class="goal"><div class="t"><b>' + esc(p.name) + '</b><div class="small muted">' + (p.backup ? "Letzte Sicherung " + fmtAgo(p.backup.ts) + " · " + p.backup.words + " Wörter · " + p.backup.coins + " Münzen" : "Noch keine Sicherung") + " · " + p.devices.length + " Gerät" + (p.devices.length === 1 ? "" : "e") + '</div></div>' +
          '<div class="acts"><button class="ghost sm" data-hi="' + p.id + '">Neuer Code</button>' + (p.backup ? '<a class="small" href="/api/admin/players/' + p.id + '/state" download>Herunterladen</a>' : "") +
          '<button class="ghost sm" data-hs="' + p.id + '">Anzeigen</button><button class="ghost sm" data-hd="' + p.id + '">Löschen</button></div></div>';
      }).join("") + "</div>";
      Array.prototype.forEach.call(el.querySelectorAll("button[data-hi]"), function (b) { b.onclick = function () { var pl = l.filter(function (x) { return String(x.id) === b.getAttribute("data-hi"); })[0]; post("/api/admin/players/" + pl.id + "/invite").then(function (i) { viewNew(i, pl.name); loadHidden(); }); }; });
      Array.prototype.forEach.call(el.querySelectorAll("button[data-hs]"), function (b) { b.onclick = function () { post("/api/admin/players/" + b.getAttribute("data-hs") + "/hidden", { hidden: false }).then(function () { loadPlayers(+b.getAttribute("data-hs")); }); }; });
      Array.prototype.forEach.call(el.querySelectorAll("button[data-hd]"), function (b) { b.onclick = function () { if (confirm("Diesen Spieler und seine Sicherung endgültig löschen?")) api("/api/admin/players/" + b.getAttribute("data-hd"), { method: "DELETE" }).then(function () { viewNew(); }); }; });
    }).catch(function () {});
  }
  function inviteString(inv) { return location.origin + "#" + inv.code; }
  function inviteCard(name, inv) {
    return '<div class="card"><h2>Verbindungscode für ' + esc(name) + "</h2><div class=\"code\" id=\"ic\">" + esc(inviteString(inv)) + "</div>" +
      '<div class="row" style="margin-top:10px"><button id="cp">Kopieren</button></div>' +
      '<p class="small muted" style="margin:10px 0 0">In der App: Setup → Auto-Save / Lernfortschritt → Code einfügen → Verbinden. Der Code gilt ' + inv.validDays + " Tage und nur für ein Gerät.</p></div>";
  }
  function showInvite(name, inv) {
    view.insertAdjacentHTML("afterbegin", inviteCard(name, inv));
    document.getElementById("cp").onclick = function () {
      var t = document.getElementById("ic").textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { document.getElementById("cp").textContent = "Kopiert ✓"; }, function () { prompt("Code kopieren:", t); });
    };
  }

  function bars(list) {
    var w = 640, h = 130, pad = 18, n = list.length, bw = (w - pad * 2) / n, max = Math.max(600, Math.max.apply(null, list.map(function (d) { return d.sec; })));
    var s = '<svg viewBox="0 0 ' + w + " " + (h + 22) + '" width="100%" role="img" aria-label="Übungszeit pro Tag">';
    [0, 0.5, 1].forEach(function (f) { var y = h - f * (h - 8); s += '<line x1="' + pad + '" x2="' + (w - pad) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/>'; });
    s += '<text x="0" y="' + (h - (h - 8) + 3) + '">' + Math.round(max / 60) + "</text>";
    list.forEach(function (d, i) {
      var bh = Math.max(d.sec ? 2 : 0, d.sec / max * (h - 8)), x = pad + i * bw + bw * 0.15, bwi = bw * 0.7;
      s += '<rect x="' + x + '" y="' + (h - bh) + '" width="' + bwi + '" height="' + bh + '" rx="3" fill="' + (d.sec >= 600 ? "var(--good)" : d.sec ? "var(--acc2)" : "var(--line)") + '"><title>' + d.date + ": " + fmtMin(d.sec) + ", " + d.items + " Aufgaben</title></rect>";
      if (n <= 16 || i % 5 === 0) s += '<text x="' + (x + bwi / 2) + '" y="' + (h + 14) + '" text-anchor="middle">' + d.date.slice(8) + "." + d.date.slice(5, 7) + "</text>";
    });
    return s + "</svg>";
  }
  function stack(lv, total) {
    var cols = ["", "var(--l1)", "var(--l2)", "var(--l3)", "var(--l4)"], s = "";
    for (var i = 4; i >= 1; i--) if (lv[i]) s += '<i style="width:' + (lv[i] * 100 / Math.max(1, total)) + "%;background:" + cols[i] + '"></i>';
    return '<div class="bar">' + s + "</div>";
  }
  var LV = ["Neu", "Angefangen", "Geübt", "Sitzt", "Gemeistert"];

  var WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  function dparts(k) { var x = k.split("-"); return { y: +x[0], m: +x[1], d: +x[2], wd: new Date(Date.UTC(+x[0], +x[1] - 1, +x[2])).getUTCDay() }; }
  function dShort(k) { var p = dparts(k); return p.d + "." + p.m + "."; }
  function dLong(k) { var p = dparts(k); return WD[p.wd] + ", " + p.d + "." + p.m + "." + p.y; }
  function delta(a, b, fmt) { if (!b && !a) return ""; var d = a - b; return "<br>" + (d === 0 ? "= wie Vorwoche" : (d > 0 ? "▲ " : "▼ ") + fmt(Math.abs(d)) + " zur Vorwoche"); }
  function probList(l) {
    return l.length ? "<table><tr><th>Wort</th><th>Bedeutung</th><th class=\"n\">Fehler</th></tr>" + l.map(function (x) { return "<tr><td><b>" + esc(x.en) + "</b></td><td>" + esc(x.de) + '</td><td class="n">' + x.n + "</td></tr>"; }).join("") + "</table>" : '<p class="muted small" style="margin:6px 0 0">Keine Fehler.</p>';
  }
  function heuteCard(r, m) {
    var t = r.today, goal = (m.goalMin || 0) * 60, h = '<div class="card"><h2>Heute · ' + dLong(t.date) + "</h2>";
    if (!t.items && !t.sec) return h + '<p class="muted small" style="margin:0">Heute wurde noch nicht geübt.' + (goal ? " Tagesziel: " + m.goalMin + " Min." : "") + "</p></div>";
    h += '<div class="kpis">' + kpi(fmtMin(t.sec), "geübt" + (goal ? " · Ziel " + m.goalMin + " Min." : "")) +
      kpi(t.items, "Aufgaben · " + pct(t.correct, t.items) + " richtig") + kpi(t.neu, "neue Wörter") + kpi("🪙 " + t.coins, t.sessions + (t.sessions === 1 ? " Runde" : " Runden")) + "</div>";
    if (goal) h += '<div class="mini" style="margin-top:10px"><i class="' + (t.sec >= goal ? "d" : "") + '" style="width:' + Math.min(100, Math.round(t.sec * 100 / goal)) + '%"></i></div><div class="small muted" style="margin-top:4px">' + (t.sec >= goal ? "Tagesziel geschafft ✅" : "Noch " + fmtMin(goal - t.sec) + " bis zum Tagesziel") + "</div>";
    if (t.runs.length) h += '<h3 style="margin:14px 0 4px;font-size:14px">Runden heute</h3><table><tr><th>Uhr</th><th>Art</th><th class="n">Dauer</th><th class="n">Aufgaben</th><th class="n">Richtig</th></tr>' + t.runs.map(function (s) {
      return "<tr><td>" + new Date(s.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + "</td><td>" + esc(MODE[s.mode] || s.mode) + '</td><td class="n">' + fmtMin(s.sec) + '</td><td class="n">' + s.items + '</td><td class="n">' + pct(s.correct, s.items) + "</td></tr>";
    }).join("") + "</table>";
    if (t.problems.length) h += '<h3 style="margin:14px 0 4px;font-size:14px">Fehlerwörter heute</h3>' + probList(t.problems);
    return h + "</div>";
  }
  function wocheCard(r, m) {
    var w = r.calWeek, pv = w.prev, goal = (m.goalMin || 0) * 60, h = '<div class="card"><h2>Woche · ' + dLong(w.from) + " bis " + dLong(w.to) + "</h2>";
    h += '<div class="kpis">' + kpi(fmtMin(w.sec), w.activeDays + " von 7 Tagen aktiv" + delta(w.sec, pv.sec, fmtMin)) +
      kpi(w.items, "Aufgaben · " + pct(w.correct, w.items) + " richtig" + delta(w.items, pv.items, String)) +
      kpi(w.neu, "neue Wörter" + delta(w.neu, pv.neu, String)) + kpi("🪙 " + w.coins, w.sessions + (w.sessions === 1 ? " Runde" : " Runden")) + "</div>";
    var mx = Math.max.apply(null, w.days.map(function (d) { return d.sec; }).concat([goal, 60])), todayK = r.today.date;
    h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;align-items:end;height:90px">' + w.days.map(function (d) {
      var hh = d.sec ? Math.max(6, Math.round(d.sec * 100 / mx)) : 3, ok = goal && d.sec >= goal, fut = d.date > todayK;
      return '<div title="' + dLong(d.date) + ": " + fmtMin(d.sec) + '" style="height:100%;display:flex;align-items:flex-end"><i style="display:block;width:100%;height:' + hh + "%;border-radius:4px;background:" + (d.sec ? (ok ? "var(--good)" : "var(--acc2)") : "var(--line)") + (fut ? ";opacity:.4" : "") + '"></i></div>';
    }).join("") + "</div>";
    h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center" class="small muted">' + w.days.map(function (d) {
      return "<div" + (d.date === todayK ? ' style="font-weight:700;color:var(--ink)"' : "") + ">" + WD[dparts(d.date).wd] + "<br>" + fmtMin(d.sec).replace(" Min.", "") + "</div>";
    }).join("") + "</div>";
    h += '<div class="small muted" style="margin-top:6px">Minuten pro Tag' + (goal ? " · grün = Tagesziel (" + m.goalMin + " Min.) erreicht" : "") + ". Vorwoche: " + dShort(pv.from) + " – " + dShort(pv.to) + ", " + fmtMin(pv.sec) + ", " + pv.activeDays + " aktive Tage.</div>";
    h += '<h3 style="margin:14px 0 4px;font-size:14px">Fehlerwörter der Woche</h3>' + probList(w.problems);
    return h + "</div>";
  }
  function hhmm(ts) { return new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); }
  function muster(r, m) {
    var ds = r.days, act = ds.filter(function (d) { return d.items > 0 || d.sec > 0; }), goal = (m.goalMin || 0) * 60, runs = [], modes = {}, hours = {}, gap = 0, best = 0;
    ds.forEach(function (d) { gap = d.items || d.sec ? 0 : gap + 1; best = Math.max(best, gap); d.runs.forEach(function (s) { runs.push(s); modes[s.mode] = (modes[s.mode] || 0) + 1; var hr = new Date(s.ts).getHours(); hours[hr] = (hours[hr] || 0) + 1; }); });
    var out = [act.length + " von " + ds.length + " Tagen aktiv"];
    if (act.length) out.push("im Schnitt " + fmtMin(act.reduce(function (a, d) { return a + d.sec; }, 0) / act.length) + " an aktiven Tagen");
    if (goal) out.push("Tagesziel an " + ds.filter(function (d) { return d.sec >= goal; }).length + " Tagen erreicht");
    if (runs.length) {
      out.push("Ø " + Math.round(runs.reduce(function (a, s) { return a + s.items; }, 0) / runs.length) + " Aufgaben und " + fmtMin(runs.reduce(function (a, s) { return a + s.sec; }, 0) / runs.length) + " pro Runde");
      var hk = Object.keys(hours).sort(function (a, b) { return hours[b] - hours[a]; })[0]; out.push("meist gegen " + hk + " Uhr");
      out.push("Arten: " + Object.keys(modes).sort(function (a, b) { return modes[b] - modes[a]; }).slice(0, 3).map(function (k) { return (MODE[k] || k) + " " + Math.round(modes[k] * 100 / runs.length) + " %"; }).join(", "));
    }
    if (best >= 2) out.push("längste Pause: " + best + " Tage");
    return out.join(" · ");
  }
  function tageCard(r, m) {
    var goal = (m.goalMin || 0) * 60, mx = Math.max.apply(null, r.days.map(function (d) { return d.sec; }).concat([goal, 60]));

  var catCache = {};

    order.sort(function (a, b) { return (rk(a) - rk(b)) || (a < b ? -1 : 1); });
    return '<div class="pick" id="' + id + '">' + order.map(function (g) {
      return '<b class="g">' + esc(/^\d+$/.test(g) ? "Klasse " + g : g) + "</b>" + groups[g].map(function (u) {

      var all = r.words, wk = Date.now() - 7 * 86400000;
      var F = [["alle", "Alle"], ["schwer", "Schwierig"], ["woche", "Diese Woche gemeistert"], ["sitzt", "Gemeistert"], ["offen", "Noch nicht geübt"]];
      function rate(x) { return x.ok + x.no ? x.no / (x.ok + x.no) : 0; }
      function rows() {
        var q = wq.trim().toLowerCase();
        var l = all.filter(function (x) {

          if (wfil === "schwer") return x.no > 0 && x.lv < 3;
          if (wfil === "woche") return x.lv === 4 && x.m > wk;
          if (wfil === "sitzt") return x.lv === 4;
          if (wfil === "offen") return x.lv === 0 && !x.ok && !x.no;
          return true;
        });
        l.sort(function (a, b) { return wsort === "rate" ? (rate(b) - rate(a)) || (b.no - a.no) : wsort === "last" ? b.last - a.last : wsort === "en" ? (a.en || "~").localeCompare(b.en || "~") : (b.no - a.no) || (rate(b) - rate(a)); });
        return l;
      }

          l.slice(0, 200).map(function (x) {
            return "<tr><td><b>" + esc(x.en || "#" + (x.i + 1)) + "</b></td><td>" + esc(x.de) + '</td><td class="small muted">' + esc(x.ut) + '</td><td><span class="pill l' + x.lv + '">' + LV[x.lv] + '</span></td><td class="n">' + x.ok + '</td><td class="n">' + (x.no ? '<b class="err">' + x.no + "</b>" : 0) + '</td><td class="n">' + (x.ok + x.no ? Math.round(rate(x) * 100) + " %" : "–") + "</td><td>" + (x.last ? fmtAgo(x.last) : "–") + "</td></tr>";
          }).join("") + "</table>" + (l.length > 200 ? '<p class="small muted">Es werden die ersten 200 gezeigt. Mit Suche oder Filter eingrenzen.</p>' : "");
      }
      box.innerHTML = '<div class="form" style="margin-top:10px"><input id="wq" type="search" placeholder="Wort oder Einheit suchen"><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">' +
        F.map(function (f) { return '<button class="ghost sm" data-wf="' + f[0] + '" aria-pressed="' + (wfil === f[0]) + '">' + f[1] + "</button>"; }).join("") +
        '<select id="ws" style="width:auto"><option value="no">Sortiert: meiste Fehler</option><option value="rate">Sortiert: Fehlerquote</option><option value="last">Sortiert: zuletzt geübt</option><option value="en">Sortiert: A–Z</option></select></div></div><div id="wlist" style="margin-top:8px"></div>';
      var qi = document.getElementById("wq"); qi.value = wq; qi.oninput = function () { wq = qi.value; draw(); };
      var ws = document.getElementById("ws"); ws.value = wsort; ws.onchange = function () { wsort = ws.value; draw(); };
      Array.prototype.forEach.call(box.querySelectorAll("[data-wf]"), function (b) { b.onclick = function () { wfil = b.getAttribute("data-wf"); Array.prototype.forEach.call(box.querySelectorAll("[data-wf]"), function (o) { o.setAttribute("aria-pressed", o === b); }); draw(); }; });
      draw();
    }).catch(function (e) { box.innerHTML = '<p class="err small">' + esc(e.message) + "</p>"; });
  }

  function showUnit(p, uid) {
    var el = document.getElementById("unitdetail"); if (!el) return;
    el.innerHTML = '<p class="muted small">Lade …</p>';
    api("/api/admin/players/" + p.id + "/unit/" + encodeURIComponent(uid)).then(function (u) {
      var h = '<div style="margin-top:14px"><div class="row"><b class="grow">' + esc(u.title) + '</b><button class="ghost sm" id="udx">Schließen</button></div>';
      if (!u.hasTexts) h += '<p class="small muted">Die Wörter selbst kommen mit der nächsten Übertragung der App (App öffnen, eine Runde lernen).</p>';
      h += '<table><tr><th>Wort</th><th>Bedeutung</th><th>Stand</th><th class="n">✓</th><th class="n">✗</th><th>Zuletzt</th></tr>' + u.words.map(function (w) {
        return "<tr><td><b>" + esc(w.en || "#" + (w.i + 1)) + "</b></td><td>" + esc(w.de) + '</td><td><span class="pill l' + w.lv + '">' + LV[w.lv] + '</span></td><td class="n">' + w.ok + '</td><td class="n">' + (w.no ? '<b class="err">' + w.no + "</b>" : 0) + "</td><td>" + (w.last ? fmtAgo(w.last) : "–") + "</td></tr>";
      }).join("") + "</table></div>";
      el.innerHTML = h; el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      document.getElementById("udx").onclick = function () { el.innerHTML = ""; };
    }).catch(function (e) { el.innerHTML = '<p class="err small">' + esc(e.message) + "</p>"; });
  }

  function kpi(v, l) { return '<div class="kpi"><b>' + v + "</b><span>" + l + "</span></div>"; }

  loadPlayers();
  setInterval(function () { if (cur !== "new" && !document.hidden && !document.getElementById("nn") && !document.getElementById("ic") && !document.querySelector("details[open]") && !document.getElementById("unitdetail").innerHTML) show(); }, 120000);
})();
</script>
</body>
</html>
