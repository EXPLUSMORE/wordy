<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><link rel="manifest" href="/app/manifest.webmanifest"><link rel="icon" href="/app/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/app/apple-touch-icon.png"><meta name="theme-color" content="#0E1320"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Track Wordy"><meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Track Wordy</title>
<style>
.WFX .opcoin{display:none!important}
:root{--bg:#F6F1E6;--card:#fff;--ink:#10151F;--ink2:#3B4656;--line:#E9E1CD;--acc:#1E6273;--acc2:#2E8BA0;--good:#2C7A57;--bad:#B8403B;--warn:#A9781F;--on-acc:#fff;--btn-sh:#134552;--l1:#E2B93B;--l2:#E69A3A;--l3:#4FA6B8;--l4:#2E8B57}
@media (prefers-color-scheme:dark){:root{--bg:#0E1320;--card:#171F30;--ink:#F6EFE0;--ink2:#B9C0CE;--line:#243049;--acc:#E9BD62;--acc2:#F4C45E;--good:#63C79A;--bad:#E7817B;--warn:#E9BD62;--on-acc:#2a1c00;--btn-sh:#9b6f1c;--l1:#C9A233;--l2:#D18A33;--l3:#4698AA;--l4:#4DB380}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:24px;font-weight:800;letter-spacing:-.015em;margin:4px 0 14px;font-family:ui-rounded,"SF Pro Rounded","Nunito","DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h2{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(16,21,31,.05),0 8px 22px rgba(60,45,10,.06);padding:16px;margin:0 0 14px;overflow-x:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.muted{color:var(--ink2)}.small{font-size:13px}
button,input{font:inherit}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:700;box-shadow:0 3px 0 var(--btn-sh)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-sh)}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line);box-shadow:none;font-weight:600}
button.tab{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600}
button.ghost[aria-pressed=true]{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
button.tab[aria-pressed=true]{background:var(--acc);color:var(--on-acc);border-color:var(--acc);box-shadow:0 3px 0 var(--btn-sh)}
input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--ink2);font-weight:600;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.code{font:600 15px ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;word-break:break-all}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--ink2);font-size:10px}
.err{color:var(--bad)}
select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-top:12px}
.form label{font-size:12px;color:var(--ink2);display:block;margin-bottom:3px}
.form input,.form select{width:100%}
.pick{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px;background:var(--bg)}
.pick label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);padding:2px 0;margin:0}
.pick b.g{display:block;font-size:12px;color:var(--ink2);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.06em}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.goal{flex-wrap:wrap}.goal .t{flex:1 1 220px;min-width:0}
input[type=checkbox]{width:auto;padding:0;margin:0;flex:none}
.goal .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}.mini i{display:block;height:100%;background:var(--acc2)}.mini i.d{background:var(--good)}
button.sm{padding:5px 10px;font-size:13px}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--bg)}
.pill.l0{color:var(--ink2)}.pill.l1{border-color:var(--l1)}.pill.l2{border-color:var(--l2)}.pill.l3{border-color:var(--l3)}.pill.l4{border-color:var(--l4);color:var(--good)}
@media (prefers-color-scheme:dark){.card{border-color:rgba(233,189,98,.16)}}

.tabs2{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.tabs2 button{flex:1 1 0;min-width:110px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}.tabs2.sub button{min-width:0;font-size:13px;padding:6px 8px;font-weight:600}
details.sg{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 14px}details.sg[hidden]{display:none}
details.sg>summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none;padding:12px 0}details.sg>summary::-webkit-details-marker{display:none}
details.sg .chev{color:var(--acc);transition:transform .2s}details.sg[open] .chev{transform:rotate(90deg)}
details.sg .sgb{padding:0 0 12px}details.sg .sgb>.card{box-shadow:none;border:0;padding:8px 0 4px;margin:0 0 4px;border-top:1px solid var(--line);border-radius:0}details.sg .sgb>.card:empty{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1><img src="/app/icon-192.png" alt="" width="34" height="34" style="border-radius:9px;vertical-align:-9px;margin-right:8px">Track Wordy · <span id="ttl">Lernfortschritt</span></h1>
  <div id="tabs" class="row" style="margin-bottom:12px"></div>
  <div id="view"></div>
</main>
<script>
(function () {
  var view = document.getElementById("view"), tabs = document.getElementById("tabs");
  if (window.WF) { document.getElementById("ttl").textContent = "Eltern"; document.documentElement.classList.add("WFX"); }
  var pendingPair = (function () { var c = ""; try { c = new URLSearchParams(location.search).get("koppeln") || localStorage.getItem("wf.koppeln") || ""; localStorage.removeItem("wf.koppeln"); } catch (e) {} return String(c).slice(0, 10); })();
  var players = [], cur = null, days = 14, mainTab = "dash", subTab = "over", setOpen = {};
  function nm() { var p = players.filter(function (x) { return x.id === cur; })[0]; return p ? p.name : "das Kind"; }   // Name des gewählten Spielers für die Texte
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function api(path, opt) {
    opt = Object.assign({}, opt || {}); opt.headers = Object.assign({ "X-Wordy": "1" }, opt.headers || {});
    return fetch(path, Object.assign({ credentials: "same-origin" }, opt)).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }
  function post(path, body) { return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); }
  function fmtExact(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " Min."; }   // wenn gerundet „10 Min.“ erscheint, das Ziel aber knapp fehlt
  function fmtMin(s) { var m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + " Std. " + (m % 60) + " Min." : m + " Min."; }
  function fmtAgo(t) {
    if (!t) return "noch nie";
    var m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? "gerade eben" : m < 60 ? "vor " + m + " Min." : m < 1440 ? "vor " + Math.round(m / 60) + " Std." : "vor " + Math.round(m / 1440) + " Tagen";
  }
  /* Uhrzeit dazu: „heute 14:32 Uhr“, „gestern 21:05 Uhr“, sonst „Mo 5.10., 14:32 Uhr“ */
  function fmtAt(t) {
    if (!t) return "";
    var d = new Date(t), n = new Date(), hm = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
    var day0 = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); }, diff = Math.round((day0(n) - day0(d)) / 86400000);
    return (diff === 0 ? "heute" : diff === 1 ? "gestern" : ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"][d.getDay()] + " " + d.getDate() + "." + (d.getMonth() + 1) + ".") + (diff === 0 || diff === 1 ? " " : ", ") + hm;
  }
  function fmtDate(ts) { return new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
  function pct(a, b) { return b ? Math.round(a * 100 / b) + " %" : "–"; }
  var MODE = { mix: "Gemischt", new: "Neue Wörter", box: "Fehlerkartei", sent: "Sätze", verbs: "Verben", arena: "Arena", unit: "Einheit", plan: "Lernplan", focus: "Gezielt üben", master: "Meistern", path: "Lernpfad" };

  var classes = [], unitCat = null;
  function loadPlayers(keep) {
    if (window.WT) return api("/api/admin/classes").then(function (l) {
      classes = l; if (keep) cur = keep; else if (!cur || cur === "new" || (cur.charAt(0) === "c" && !classes.some(function (c) { return "c" + c.id === cur; }) && cur !== "newc" && cur !== "fam" && cur !== "fb")) cur = classes[0] ? "c" + classes[0].id : "newc";
      drawTabs(); return show();
    }).catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
    return api("/api/admin/players").then(function (l) {
      players = l; if (!cur || !players.some(function (p) { return p.id === cur; })) cur = players[0] ? players[0].id : "new";
      if (pendingPair && !keep) cur = "new";
      if (keep) cur = keep;
      drawTabs(); return show();
    }).catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
  }
  function drawTabs() {
    if (window.WT) { tabs.innerHTML = classes.map(function (c) { return '<button class="tab" data-p="c' + c.id + '" aria-pressed="' + (cur === "c" + c.id) + '">🏫 ' + esc(c.name) + (c.pending ? " (" + c.pending + ")" : "") + "</button>"; }).join("") +
      '<button class="tab" data-p="newc" aria-pressed="' + (cur === "newc") + '">＋ Klasse</button><button class="tab" data-p="fb" aria-pressed="' + (cur === "fb") + '">💬 Feedback</button><button class="tab" data-p="fam" aria-pressed="' + (cur === "fam") + '">⚙️ Konto</button>'; return; }
    tabs.innerHTML = players.map(function (p) { return '<button class="tab" data-p="' + p.id + '" aria-pressed="' + (cur === p.id) + '">' + esc(p.name) + "</button>"; }).join("") +
      '<button class="tab" data-p="new" aria-pressed="' + (cur === "new") + '">＋ Spieler</button>' +
      '<button class="tab" data-p="fam" aria-pressed="' + (cur === "fam") + '">' + (window.WF ? "⚙️ Konto" : "👪 Familien") + '</button>';
  }
  tabs.onclick = function (e) { var b = e.target.closest("button[data-p]"); if (!b) return; var v = b.getAttribute("data-p"); cur = v === "new" || v === "fam" || v === "fb" || v === "newc" || (window.WT && v.charAt(0) === "c") ? v : +v; drawTabs(); show(); };

  function show() {
    if (window.WT && cur === "fb") { view.innerHTML = '<div id="fbBox"></div>'; drawFeedback(document.getElementById("fbBox")); return Promise.resolve(); }
    if (window.WT) { if (cur === "fam") return Promise.resolve(viewFam()); if (cur === "newc" || !classes.length) return Promise.resolve(viewNewClass()); return viewClass(+String(cur).slice(1)); }
    if (cur === "fam") return Promise.resolve(viewFam());
    if (cur === "new" || !players.length) return Promise.resolve(viewNew());
    var p = players.filter(function (x) { return x.id === cur; })[0];
    view.innerHTML = '<div class="card muted">Lade …</div>';
    return api("/api/admin/players/" + cur + "/report?days=" + days).then(function (r) { viewPlayer(p, r); })
      .catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
  }

  /* Betreiber: Familien und Einladungslinks. Eltern: eigenes Konto (E-Mail, Wochenmail, Daten exportieren, Konto löschen). */
  function viewFam() {
    if (window.WF) {
      view.innerHTML = '<div class="card muted">Lade …</div>';
      return api("/api/admin/me").then(function (m) {
        view.innerHTML = '<div class="card"><h2>Mein Konto</h2><p style="margin:0 0 8px">Angemeldet als <b>' + esc(m.email) + '</b>.' + (window.WT ? " Lehrkraft-Konto." : " Kinder: <b>" + m.children + " von " + m.max + "</b>.") + '</p>' +
          '<label class="row" style="gap:8px;margin-top:10px"><input type="checkbox" id="fw"' + (m.weekly ? " checked" : "") + '><span>Wochenzusammenfassung per Mail (' + ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"][m.day] + " um " + m.hour + ' Uhr)</span></label><p id="fmsg" class="small muted" style="margin:8px 0 0"></p></div>' +
          '<div class="card"><h2>Passwort</h2><p class="small muted" style="margin:0 0 10px">' + (m.hasPassword ? "Du kannst dich mit E-Mail und Passwort anmelden. Hier kannst du es ändern." : "Lege ein Passwort fest, dann meldest du dich künftig mit E-Mail und Passwort an. Der Anmeldelink per Mail bleibt als Alternative.") + '</p>' +
          (m.hasPassword ? '<label class="small" for="pwc">Aktuelles Passwort</label><input id="pwc" type="password" autocomplete="current-password" style="width:100%;margin-bottom:8px">' : "") +
          '<label class="small" for="pwn">Neues Passwort (mindestens 10 Zeichen)</label><input id="pwn" type="password" autocomplete="new-password" style="width:100%"><div class="row" style="gap:8px;margin-top:8px;align-items:center"><button id="pws">' + (m.hasPassword ? "Passwort ändern" : "Passwort festlegen") + '</button><span id="pwm" class="small"></span></div></div>' +
          '<div class="card"><h2>Meine Daten</h2><p class="small muted" style="margin:0 0 10px">Du kannst alle gespeicherten Daten ' + (window.WT ? "deines Kontos (Klassen und Aufgaben)" : "deiner Familie") + ' als Datei herunterladen oder das Konto ' + (window.WT ? "samt aller Klassen" : "samt aller Kinder und Lernstände") + ' endgültig löschen.</p>' +
          '<div class="row" style="gap:8px"><a class="ghost sm" href="/api/fam/me/export" download style="padding:8px 12px;border-radius:8px;text-decoration:none">Daten herunterladen</a><button class="ghost sm" id="flo">Abmelden</button><button class="ghost sm" id="fdel" style="color:var(--bad)">Konto löschen …</button></div>' +
          '<p class="small muted" style="margin:10px 0 0"><a href="/f/datenschutz" target="_blank">Datenschutzerklärung</a></p></div>';
        document.getElementById("pws").onclick = function () { var msg = document.getElementById("pwm"), body = { password: document.getElementById("pwn").value }, c = document.getElementById("pwc"); if (c) body.current = c.value; post("/api/admin/me/password", body).then(function () { msg.className = "small"; msg.textContent = "Gespeichert."; document.getElementById("pwn").value = ""; if (c) c.value = ""; }).catch(function (e) { msg.className = "small err"; msg.textContent = e.message; }); };
        document.getElementById("fw").onchange = function () { post("/api/admin/me", { weekly: this.checked }).then(function () { document.getElementById("fmsg").textContent = "Gespeichert."; }); };
        document.getElementById("flo").onclick = function () { post("/api/family/logout").then(function () { location.href = "/f/"; }); };
        document.getElementById("fdel").onclick = function () { var c = prompt("Das löscht dein Konto, alle Kinder und alle Lernstände endgültig. Zur Bestätigung deine E-Mail-Adresse eintippen:"); if (c) api("/api/admin/me", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ confirm: c }) }).then(function () { location.href = "/f/"; }).catch(function (e) { alert(e.message); }); };
      }).catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
    }
    view.innerHTML = '<div class="card muted">Lade …</div>';
    return Promise.all([api("/api/admin/families"), api("/api/admin/families/invites")]).then(function (r) {
      var fs = r[0], inv = r[1].filter(function (i) { return i.expires > Date.now() && i.uses < i.max; });
      view.innerHTML = '<div class="card"><h2>Einladungslink erstellen</h2><p class="small muted" style="margin:0 0 10px">Wer den Link bekommt, kann sich mit seiner E-Mail-Adresse registrieren und danach seine Kinder selbst verwalten (Eltern) oder Klassen mit Wochenaufgaben anlegen (Lehrkraft). Jeder Link gilt für eine bestimmte Zahl Familien.</p>' +
        '<div class="row" style="gap:8px"><input id="in" class="grow" maxlength="60" placeholder="Notiz, z. B. Familie Meier"><select id="iu"><option value="1">1 Familie</option><option value="3">3</option><option value="10">10</option></select><select id="ir"><option value="parent">Eltern</option><option value="teacher">Lehrkraft</option></select><button id="imk">Link erstellen</button></div><div id="iout"></div></div>' +
        '<div class="card"><h2>Offene Einladungen</h2>' + (inv.length ? inv.map(function (i) { return '<div class="row" style="gap:8px;padding:6px 0;border-top:1px solid var(--line)"><span class="grow small"><b>' + (i.role === "teacher" ? "🏫 " : "") + esc(i.note || "ohne Notiz") + '</b> · ' + i.uses + "/" + i.max + ' benutzt<br><span class="muted">' + esc(i.url) + '</span></span><button class="ghost sm" data-cp="' + esc(i.url) + '">Kopieren</button><button class="ghost sm" data-di="' + esc(i.code) + '">Löschen</button></div>'; }).join("") : '<p class="small muted" style="margin:0">Keine offenen Einladungen.</p>') + "</div>" +
        '<div class="card"><h2>Familien (' + fs.length + ')</h2>' + (fs.length ? fs.map(function (f) { return '<div class="row" style="gap:8px;padding:6px 0;border-top:1px solid var(--line)"><span class="grow small"><b>' + (f.role === "teacher" ? "🏫 " : "") + esc(f.email) + '</b> ' + (f.status === "blocked" ? '<span class="err">gesperrt</span>' : "") + '<br><span class="muted">' + f.children + ' Kinder · zuletzt angemeldet ' + fmtAgo(f.lastLogin) + '</span></span><button class="ghost sm" data-bl="' + f.id + '" data-b="' + (f.status === "blocked" ? 0 : 1) + '">' + (f.status === "blocked" ? "Entsperren" : "Sperren") + '</button><button class="ghost sm" data-df="' + f.id + '" data-n="' + esc(f.email) + '">Löschen</button></div>'; }).join("") : '<p class="small muted" style="margin:0">Noch keine Familien registriert.</p>') +
        '<p class="small muted" style="margin:10px 0 0">Aus Datenschutzgründen siehst du hier nur Konten, nicht die Lernstände fremder Kinder.</p></div><div class="card" id="mailCard"></div>';
      drawMail();
      document.getElementById("imk").onclick = function () { post("/api/admin/families/invites", { note: document.getElementById("in").value, uses: +document.getElementById("iu").value, role: document.getElementById("ir").value }).then(function (i) { viewFam().then(function () { document.getElementById("iout").innerHTML = '<p style="margin:10px 0 0"><b>Link:</b> <input readonly class="grow" style="width:100%" value="' + esc(i.url) + '" onclick="this.select()"></p>'; }); }).catch(function (e) { alert(e.message); }); };
      Array.prototype.forEach.call(view.querySelectorAll("[data-cp]"), function (b) { b.onclick = function () { navigator.clipboard.writeText(b.getAttribute("data-cp")); b.textContent = "Kopiert"; }; });
      Array.prototype.forEach.call(view.querySelectorAll("[data-di]"), function (b) { b.onclick = function () { api("/api/admin/families/invites/" + b.getAttribute("data-di"), { method: "DELETE" }).then(viewFam); }; });
      Array.prototype.forEach.call(view.querySelectorAll("[data-bl]"), function (b) { b.onclick = function () { post("/api/admin/families/" + b.getAttribute("data-bl") + "/block", { blocked: b.getAttribute("data-b") === "1" }).then(viewFam); }; });
      Array.prototype.forEach.call(view.querySelectorAll("[data-df]"), function (b) { b.onclick = function () { if (confirm(b.getAttribute("data-n") + " samt allen Kindern und Lernständen endgültig löschen?")) api("/api/admin/families/" + b.getAttribute("data-df"), { method: "DELETE" }).then(viewFam); }; });
    }).catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
  }
  /* Gerät eines Kindes freigeben: Code aus der App prüfen, Kind wählen (oder neu anlegen), freigeben */
  function pairCard(id) {

    document.getElementById("gadd").onclick = function () {
      post("/api/admin/players/" + p.id + "/goals", { kind: k.value, target: +document.getElementById("gt").value, coins: +document.getElementById("gc").value, week: document.getElementById("gw").value, scope: picked("gpick") })
        .then(function () { show(); }).catch(function (e) { document.getElementById("gmsg").textContent = e.message; });
    };
    Array.prototype.forEach.call(el.querySelectorAll("button[data-gdel]"), function (b) { b.onclick = function () { if (confirm("Ziel löschen?")) api("/api/admin/goals/" + b.getAttribute("data-gdel"), { method: "DELETE" }).then(show); }; });
  }

  function drawPlans(p, r) {
    var el = document.getElementById("plansCard"); if (!el) return;
    var list = r.plans || [], h = "<h2>Lernplan für Klassenarbeiten</h2>";
    h += list.length ? list.map(function (x) {
      return '<div class="goal"><div class="t"><b>📅 ' + esc(x.title) + '</b><div class="small muted">Arbeit am ' + x.exam.split("-").reverse().join(".") + " · " + (x.daysLeft > 0 ? "noch " + x.daysLeft + " Tage" : x.daysLeft === 0 ? "heute" : "vorbei") + " · " + x.pct + " % sicher (" + x.ok + " von " + x.total + ")" + (x.coins ? " · 🪙 " + x.coins + " Bonus bei 90 %" : "") + '</div><div class="small muted">' + esc(x.unitTitles.join(", ")) + '</div><div class="mini"><i class="' + (x.pct >= 90 ? "d" : "") + '" style="width:' + Math.min(100, x.pct) + '%"></i></div></div><button class="ghost sm" data-pdel="' + x.id + '">Löschen</button></div>';
    }).join("") : '<p class="muted small" style="margin:0">Noch kein Lernplan. Mit Datum und Einheiten verteilt die App die Wörter auf die Tage bis zur Arbeit und zeigt ' + esc(nm()) + ', was heute dran ist.</p>';
    h += '<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--acc);font-weight:600">＋ Lernplan anlegen</summary><div class="form">' +
      '<div><label>Bezeichnung</label><input id="pt" maxlength="60" placeholder="z. B. Englischarbeit Unit 4"></div>' +
      '<div><label>Datum der Arbeit</label><input id="pd" type="date"></div>' +
      '<div class="opcoin"><label>Bonusmünzen bei 90 % sicher</label><input id="pc" type="number" min="0" max="500" value="50"></div></div>' +
      '<div style="margin-top:8px"><label class="small muted">Einheiten für die Arbeit</label><div id="ppp"><p class="small muted">Lade …</p></div></div>' +
      '<div style="margin-top:12px"><button id="padd">Lernplan anlegen</button> <span id="pmsg" class="small err"></span></div></details>';
    el.innerHTML = h;
    var det = el.querySelector("details");
    det.addEventListener("toggle", function () {
      if (det.open && !document.getElementById("ppick")) (catCache[p.id] ? Promise.resolve(catCache[p.id]) : getCatalog(p.id)).then(function (c) { document.getElementById("ppp").innerHTML = c.length ? unitPicker(c, "ppick") : '<p class="small muted">Noch keine Einheiten bekannt. Sie erscheinen, sobald die App einmal gesendet hat.</p>'; });
    });
    document.getElementById("padd").onclick = function () {
      post("/api/admin/players/" + p.id + "/plans", { title: document.getElementById("pt").value, exam: document.getElementById("pd").value, coins: +document.getElementById("pc").value, units: picked("ppick") })
        .then(function () { show(); }).catch(function (e) { document.getElementById("pmsg").textContent = e.message; });
    };
    Array.prototype.forEach.call(el.querySelectorAll("button[data-pdel]"), function (b) { b.onclick = function () { if (confirm("Lernplan löschen?")) api("/api/admin/plans/" + b.getAttribute("data-pdel"), { method: "DELETE" }).then(show); }; });
  }

  function drawBackups(p, r) {
    var el = document.getElementById("backupCard"); if (!el) return;
    var b = r.backups || [];
    el.innerHTML = "<h2>Lernstand-Sicherung</h2>" + (b.length
      ? '<p style="margin:0 0 8px">Die App sichert den kompletten Lernstand (Wörter, Münzen, Shop, Einstellungen) nach jeder Runde. Die letzten ' + b.length + " Tage bleiben erhalten. Zurückspielen geht in der App unter Setup → Auto-Save / Lernfortschritt → „Lernstand wiederherstellen“. Zusätzlich kannst du jeden Stand als Datei herunterladen.</p>" +
        '<table><tr><th>Tag</th><th>Zuletzt</th><th class="n">Wörter</th><th class="n">Münzen</th><th></th></tr>' + b.slice(0, 10).map(function (x) {
          return "<tr><td>" + x.day.split("-").reverse().join(".") + "</td><td>" + fmtDate(x.ts) + '</td><td class="n">' + x.words + '</td><td class="n">' + x.coins + '</td><td><a href="/api/admin/players/' + p.id + "/state?day=" + x.day + '" download>Herunterladen</a></td></tr>';
        }).join("") + "</table>"
      : '<p class="muted small" style="margin:0">Noch keine Sicherung. Sie entsteht nach der nächsten Lernrunde mit der neuen App-Version.</p>');
  }
  function drawMail() {
    var el = document.getElementById("mailCard"); if (!el) return;
    api("/api/admin/mail").then(function (m) {
      var days = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
      var fam = m.family;
      el.innerHTML = "<h2>Wochenzusammenfassung per Mail</h2>" + (m.configured
        ? '<p style="margin:0 0 10px">Geht jeden <b>' + days[m.day] + " um " + m.hour + " Uhr</b> an <b>" + esc(m.to) + "</b>." + (m.lastWeek ? ' <span class="muted small">Zuletzt für die Woche ab ' + m.lastWeek.split("-").reverse().join(".") + " gesendet.</span>" : "") + '</p><button class="ghost" id="mtest">Testmail jetzt senden</button> <span id="mmsg" class="small"></span>'
        : (m.transport === false ? '<p class="muted small" style="margin:0">Mailversand ist auf dem Server noch nicht eingerichtet (siehe README, Abschnitt „Wochenmail“).</p>' : '<p class="muted small" style="margin:0 0 6px">Noch keine Empfänger-Adresse hinterlegt.</p>'))
        + (fam || m.transport === false ? "" : '<div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap"><input id="mto" type="text" inputmode="email" placeholder="name@example.de (mehrere mit Komma)" value="' + esc(m.to || "") + '" style="flex:1;min-width:200px"><button class="ghost" id="msave">Speichern</button></div><p class="small muted" style="margin:6px 0 0">Leer lassen und speichern = Adresse aus der Server-Einstellung verwenden.</p><span id="mmsg2" class="small"></span>');
      var b = document.getElementById("mtest");
      if (b) b.onclick = function () { b.disabled = true; document.getElementById("mmsg").textContent = "Sende …"; post("/api/admin/mail/test").then(function (r) { b.disabled = false; var s = document.getElementById("mmsg"); s.className = "small " + (r.ok ? "" : "err"); s.textContent = r.ok ? "Gesendet. Bitte Postfach prüfen." : "Fehler: " + r.error; }); };
      var sv = document.getElementById("msave");
      if (sv) sv.onclick = function () { post("/api/admin/mail", { to: document.getElementById("mto").value }).then(function (r) { if (r && r.error) { var s = document.getElementById("mmsg2"); s.className = "small err"; s.textContent = r.error; } else drawMail(); }); };
    }).catch(function () {});
  }

  var wfil = "alle", wsort = "no", wq = "";
  function showWords(p) {
    var box = document.getElementById("wbox"); if (!box || box.innerHTML) return;
    box.innerHTML = '<p class="muted small">Lade …</p>';
    api("/api/admin/players/" + p.id + "/words").then(function (r) {
      var all = r.words, wk = Date.now() - 7 * 86400000;
      var F = [["alle", "Alle"], ["schwer", "Schwierig"], ["woche", "Diese Woche gemeistert"], ["sitzt", "Gemeistert"], ["offen", "Noch nicht geübt"]];
      function rate(x) { return x.ok + x.no ? x.no / (x.ok + x.no) : 0; }
      function rows() {
        var q = wq.trim().toLowerCase();
        var l = all.filter(function (x) {
          if (q && (x.en + " " + x.de + " " + x.ut).toLowerCase().indexOf(q) < 0) return false;
          if (wfil === "schwer") return x.no > 0 && x.lv < 3;
          if (wfil === "woche") return x.lv === 4 && x.m > wk;
          if (wfil === "sitzt") return x.lv === 4;
          if (wfil === "offen") return x.lv === 0 && !x.ok && !x.no;
          return true;
        });
        l.sort(function (a, b) { return wsort === "rate" ? (rate(b) - rate(a)) || (b.no - a.no) : wsort === "last" ? b.last - a.last : wsort === "en" ? (a.en || "~").localeCompare(b.en || "~") : (b.no - a.no) || (rate(b) - rate(a)); });
        return l;
      }
      function draw() {
        var l = rows();
        document.getElementById("wlist").innerHTML = '<p class="small muted">' + l.length + " von " + all.length + ' Wörtern' + (r.hasTexts ? "" : " · Wörter-Texte kommen mit der nächsten Übertragung der App") + '</p>' +
          '<table><tr><th>Wort</th><th>Bedeutung</th><th>Einheit</th><th>Stand</th><th class="n">✓</th><th class="n">✗</th><th class="n">Fehler</th><th>Zuletzt</th></tr>' +
          l.slice(0, 200).map(function (x) {
            return "<tr><td><b>" + esc(x.en || "#" + (x.i + 1)) + "</b></td><td>" + esc(x.de) + '</td><td class="small muted">' + esc(x.ut) + '</td><td><span class="pill l' + x.lv + '">' + LV[x.lv] + '</span></td><td class="n">' + x.ok + '</td><td class="n">' + (x.no ? '<b class="err">' + x.no + "</b>" : 0) + '</td><td class="n">' + (x.ok + x.no ? Math.round(rate(x) * 100) + " %" : "–") + "</td><td>" + (x.last ? fmtAgo(x.last) : "–") + "</td></tr>";
          }).join("") + "</table>" + (l.length > 200 ? '<p class="small muted">Es werden die ersten 200 gezeigt. Mit Suche oder Filter eingrenzen.</p>' : "");
      }
      box.innerHTML = '<div class="form" style="margin-top:10px"><input id="wq" type="search" placeholder="Wort oder Einheit suchen"><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">' +
        F.map(function (f) { return '<button class="ghost sm" data-wf="' + f[0] + '" aria-pressed="' + (wfil === f[0]) + '">' + f[1] + "</button>"; }).join("") +
        '<select id="ws" style="width:auto"><option value="no">Sortiert: meiste Fehler</option><option value="rate">Sortiert: Fehlerquote</option><option value="last">Sortiert: zuletzt geübt</option><option value="en">Sortiert: A–Z</option></select></div></div><div id="wlist" style="margin-top:8px"></div>';
      var qi = document.getElementById("wq"); qi.value = wq; qi.oninput = function () { wq = qi.value; draw(); };
      var ws = document.getElementById("ws"); ws.value = wsort; ws.onchange = function () { wsort = ws.value; draw(); };
      Array.prototype.forEach.call(box.querySelectorAll("[data-wf]"), function (b) { b.onclick = function () { wfil = b.getAttribute("data-wf"); Array.prototype.forEach.call(box.querySelectorAll("[data-wf]"), function (o) { o.setAttribute("aria-pressed", o === b); }); draw(); }; });
      draw();
    }).catch(function (e) { box.innerHTML = '<p class="err small">' + esc(e.message) + "</p>"; });
  }

  function showUnit(p, uid) {
    var el = document.getElementById("unitdetail"); if (!el) return;
    el.innerHTML = '<p class="muted small">Lade …</p>';
    api("/api/admin/players/" + p.id + "/unit/" + encodeURIComponent(uid)).then(function (u) {
      var h = '<div style="margin-top:14px"><div class="row"><b class="grow">' + esc(u.title) + '</b><button class="ghost sm" id="udx">Schließen</button></div>';
      if (!u.hasTexts) h += '<p class="small muted">Die Wörter selbst kommen mit der nächsten Übertragung der App (App öffnen, eine Runde lernen).</p>';
      h += '<table><tr><th>Wort</th><th>Bedeutung</th><th>Stand</th><th class="n">✓</th><th class="n">✗</th><th>Zuletzt</th></tr>' + u.words.map(function (w) {
        return "<tr><td><b>" + esc(w.en || "#" + (w.i + 1)) + "</b></td><td>" + esc(w.de) + '</td><td><span class="pill l' + w.lv + '">' + LV[w.lv] + '</span></td><td class="n">' + w.ok + '</td><td class="n">' + (w.no ? '<b class="err">' + w.no + "</b>" : 0) + "</td><td>" + (w.last ? fmtAgo(w.last) : "–") + "</td></tr>";
      }).join("") + "</table></div>";
      el.innerHTML = h; el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      document.getElementById("udx").onclick = function () { el.innerHTML = ""; };
    }).catch(function (e) { el.innerHTML = '<p class="err small">' + esc(e.message) + "</p>"; });
  }

  function kpi(v, l) { return '<div class="kpi"><b>' + v + "</b><span>" + l + "</span></div>"; }

  loadPlayers();
  setInterval(function () { if (cur !== "new" && cur !== "newc" && cur !== "fam" && !document.hidden && !document.getElementById("nn") && !document.getElementById("ic") && !document.querySelector("details[open]:not(.ugrp)") && !document.getElementById("unitdetail").innerHTML) show(); }, 120000);
})();
</script>
</body>
</html>
