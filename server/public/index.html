<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wordy Lernfortschritt</title>
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#16222B;--ink2:#52606B;--line:#E1E6EA;--acc:#1E6273;--acc2:#2E8BA0;--good:#2E8B57;--bad:#C0392B;--warn:#D9962B;--l1:#E2B93B;--l2:#E69A3A;--l3:#4FA6B8;--l4:#2E8B57}
@media (prefers-color-scheme:dark){:root{--bg:#10171C;--card:#18222A;--ink:#E8EEF2;--ink2:#9AA9B4;--line:#26333D;--acc:#5BB6CA;--acc2:#7CC8D9;--good:#58C48B;--bad:#EF6F62;--warn:#E8B054;--l1:#C9A233;--l2:#D18A33;--l3:#4698AA;--l4:#4DB380}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;overflow-x:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.muted{color:var(--ink2)}.small{font-size:13px}
button,input{font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button.tab{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.ghost[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
button.tab[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--ink2);font-weight:600;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.code{font:600 15px ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;word-break:break-all}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--ink2);font-size:10px}
.err{color:var(--bad)}
select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-top:12px}
.form label{font-size:12px;color:var(--ink2);display:block;margin-bottom:3px}
.form input,.form select{width:100%}
.pick{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px;background:var(--bg)}
.pick label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);padding:2px 0;margin:0}
.pick b.g{display:block;font-size:12px;color:var(--ink2);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.06em}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.goal{flex-wrap:wrap}.goal .t{flex:1 1 220px;min-width:0}
input[type=checkbox]{width:auto;padding:0;margin:0;flex:none}
.goal .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}.mini i{display:block;height:100%;background:var(--acc2)}.mini i.d{background:var(--good)}
button.sm{padding:5px 10px;font-size:13px}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--bg)}
.pill.l0{color:var(--ink2)}.pill.l1{border-color:var(--l1)}.pill.l2{border-color:var(--l2)}.pill.l3{border-color:var(--l3)}.pill.l4{border-color:var(--l4);color:var(--good)}
</style>
</head>
<body>
<main>
  <h1>📚 Wordy · <span id="ttl">Lernfortschritt</span></h1>
  <div id="tabs" class="row" style="margin-bottom:12px"></div>
  <div id="view"></div>
</main>
<script>
(function () {
  var view = document.getElementById("view"), tabs = document.getElementById("tabs");
  if (window.WF) document.getElementById("ttl").textContent = "Eltern";
  var players = [], cur = null, days = 14;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function api(path, opt) {
    opt = Object.assign({}, opt || {}); opt.headers = Object.assign({ "X-Wordy": "1" }, opt.headers || {});
    return fetch(path, Object.assign({ credentials: "same-origin" }, opt)).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }
  function post(path, body) { return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); }
  function fmtMin(s) { var m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + " Std. " + (m % 60) + " Min." : m + " Min."; }
  function fmtAgo(t) {
    if (!t) return "noch nie";
    var m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? "gerade eben" : m < 60 ? "vor " + m + " Min." : m < 1440 ? "vor " + Math.round(m / 60) + " Std." : "vor " + Math.round(m / 1440) + " Tagen";
  }
  /* Uhrzeit dazu: „heute 14:32 Uhr“, „gestern 21:05 Uhr“, sonst „Mo 5.10., 14:32 Uhr“ */
  function fmtAt(t) {
    if (!t) return "";
    var d = new Date(t), n = new Date(), hm = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
    var day0 = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); }, diff = Math.round((day0(n) - day0(d)) / 86400000);
    return (diff === 0 ? "heute" : diff === 1 ? "gestern" : ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"][d.getDay()] + " " + d.getDate() + "." + (d.getMonth() + 1) + ".") + (diff === 0 || diff === 1 ? " " : ", ") + hm;
  }
  function fmtDate(ts) { return new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
  function pct(a, b) { return b ? Math.round(a * 100 / b) + " %" : "–"; }
  var MODE = { mix: "Gemischt", new: "Neue Wörter", box: "Fehlerkartei", sent: "Sätze", verbs: "Verben", arena: "Arena", unit: "Einheit", plan: "Lernplan", focus: "Gezielt üben", master: "Meistern", path: "Lernpfad" };

  function loadPlayers(keep) {
    return api("/api/admin/players").then(function (l) {
      players = l; if (!cur || !players.some(function (p) { return p.id === cur; })) cur = players[0] ? players[0].id : "new";
      if (keep) cur = keep;
      drawTabs(); return show();
    }).catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
  }
  function drawTabs() {
    tabs.innerHTML = players.map(function (p) { return '<button class="tab" data-p="' + p.id + '" aria-pressed="' + (cur === p.id) + '">' + esc(p.name) + "</button>"; }).join("") +
      '<button class="tab" data-p="new" aria-pressed="' + (cur === "new") + '">＋ Spieler</button>' +
      '<button class="tab" data-p="fam" aria-pressed="' + (cur === "fam") + '">' + (window.WF ? "⚙️ Konto" : "👪 Familien") + '</button>';
  }
  tabs.onclick = function (e) { var b = e.target.closest("button[data-p]"); if (!b) return; var v = b.getAttribute("data-p"); cur = v === "new" || v === "fam" ? v : +v; drawTabs(); show(); };

  function show() {
    if (cur === "fam") return Promise.resolve(viewFam());
    if (cur === "new" || !players.length) return Promise.resolve(viewNew());
    var p = players.filter(function (x) { return x.id === cur; })[0];
    view.innerHTML = '<div class="card muted">Lade …</div>';
    return api("/api/admin/players/" + cur + "/report?days=" + days).then(function (r) { viewPlayer(p, r); })
      .catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
  }

  /* Betreiber: Familien und Einladungslinks. Eltern: eigenes Konto (E-Mail, Wochenmail, Daten exportieren, Konto löschen). */
  function viewFam() {
    if (window.WF) {
      view.innerHTML = '<div class="card muted">Lade …</div>';
      return api("/api/admin/me").then(function (m) {
        view.innerHTML = '<div class="card"><h2>Mein Konto</h2><p style="margin:0 0 8px">Angemeldet als <b>' + esc(m.email) + '</b>. Kinder: <b>' + m.children + ' von ' + m.max + '</b>.</p>' +
          '<label class="row" style="gap:8px;margin-top:10px"><input type="checkbox" id="fw"' + (m.weekly ? " checked" : "") + '><span>Wochenzusammenfassung per Mail (' + ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"][m.day] + " um " + m.hour + ' Uhr)</span></label><p id="fmsg" class="small muted" style="margin:8px 0 0"></p></div>' +
          '<div class="card"><h2>Meine Daten</h2><p class="small muted" style="margin:0 0 10px">Du kannst alle gespeicherten Daten deiner Familie als Datei herunterladen oder das Konto samt aller Kinder und Lernstände endgültig löschen.</p>' +
          '<div class="row" style="gap:8px"><a class="ghost sm" href="/api/fam/me/export" download style="padding:8px 12px;border-radius:8px;text-decoration:none">Daten herunterladen</a><button class="ghost sm" id="flo">Abmelden</button><button class="ghost sm" id="fdel" style="color:#b8403b">Konto löschen …</button></div>' +
          '<p class="small muted" style="margin:10px 0 0"><a href="/f/datenschutz" target="_blank">Datenschutzerklärung</a></p></div>';
        document.getElementById("fw").onchange = function () { post("/api/admin/me", { weekly: this.checked }).then(function () { document.getElementById("fmsg").textContent = "Gespeichert."; }); };
        document.getElementById("flo").onclick = function () { post("/api/family/logout").then(function () { location.href = "/f/"; }); };
        document.getElementById("fdel").onclick = function () { var c = prompt("Das löscht dein Konto, alle Kinder und alle Lernstände endgültig. Zur Bestätigung deine E-Mail-Adresse eintippen:"); if (c) api("/api/admin/me", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ confirm: c }) }).then(function () { location.href = "/f/"; }).catch(function (e) { alert(e.message); }); };
      }).catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
    }
    view.innerHTML = '<div class="card muted">Lade …</div>';
    return Promise.all([api("/api/admin/families"), api("/api/admin/families/invites")]).then(function (r) {
      var fs = r[0], inv = r[1].filter(function (i) { return i.expires > Date.now() && i.uses < i.max; });
      view.innerHTML = '<div class="card"><h2>Einladungslink erstellen</h2><p class="small muted" style="margin:0 0 10px">Wer den Link bekommt, kann sich mit seiner E-Mail-Adresse registrieren und danach seine Kinder selbst verwalten. Jeder Link gilt für eine bestimmte Zahl Familien.</p>' +
        '<div class="row" style="gap:8px"><input id="in" class="grow" maxlength="60" placeholder="Notiz, z. B. Familie Meier"><select id="iu"><option value="1">1 Familie</option><option value="3">3</option><option value="10">10</option></select><button id="imk">Link erstellen</button></div><div id="iout"></div></div>' +
        '<div class="card"><h2>Offene Einladungen</h2>' + (inv.length ? inv.map(function (i) { return '<div class="row" style="gap:8px;padding:6px 0;border-top:1px solid #e3e8f0"><span class="grow small"><b>' + esc(i.note || "ohne Notiz") + '</b> · ' + i.uses + "/" + i.max + ' benutzt<br><span class="muted">' + esc(i.url) + '</span></span><button class="ghost sm" data-cp="' + esc(i.url) + '">Kopieren</button><button class="ghost sm" data-di="' + esc(i.code) + '">Löschen</button></div>'; }).join("") : '<p class="small muted" style="margin:0">Keine offenen Einladungen.</p>') + "</div>" +
        '<div class="card"><h2>Familien (' + fs.length + ')</h2>' + (fs.length ? fs.map(function (f) { return '<div class="row" style="gap:8px;padding:6px 0;border-top:1px solid #e3e8f0"><span class="grow small"><b>' + esc(f.email) + '</b> ' + (f.status === "blocked" ? '<span class="err">gesperrt</span>' : "") + '<br><span class="muted">' + f.children + ' Kinder · zuletzt angemeldet ' + fmtAgo(f.lastLogin) + '</span></span><button class="ghost sm" data-bl="' + f.id + '" data-b="' + (f.status === "blocked" ? 0 : 1) + '">' + (f.status === "blocked" ? "Entsperren" : "Sperren") + '</button><button class="ghost sm" data-df="' + f.id + '" data-n="' + esc(f.email) + '">Löschen</button></div>'; }).join("") : '<p class="small muted" style="margin:0">Noch keine Familien registriert.</p>') +
        '<p class="small muted" style="margin:10px 0 0">Aus Datenschutzgründen siehst du hier nur Konten, nicht die Lernstände fremder Kinder.</p></div>';
      document.getElementById("imk").onclick = function () { post("/api/admin/families/invites", { note: document.getElementById("in").value, uses: +document.getElementById("iu").value }).then(function (i) { viewFam().then(function () { document.getElementById("iout").innerHTML = '<p style="margin:10px 0 0"><b>Link:</b> <input readonly class="grow" style="width:100%" value="' + esc(i.url) + '" onclick="this.select()"></p>'; }); }).catch(function (e) { alert(e.message); }); };
      Array.prototype.forEach.call(view.querySelectorAll("[data-cp]"), function (b) { b.onclick = function () { navigator.clipboard.writeText(b.getAttribute("data-cp")); b.textContent = "Kopiert"; }; });
      Array.prototype.forEach.call(view.querySelectorAll("[data-di]"), function (b) { b.onclick = function () { api("/api/admin/families/invites/" + b.getAttribute("data-di"), { method: "DELETE" }).then(viewFam); }; });
      Array.prototype.forEach.call(view.querySelectorAll("[data-bl]"), function (b) { b.onclick = function () { post("/api/admin/families/" + b.getAttribute("data-bl") + "/block", { blocked: b.getAttribute("data-b") === "1" }).then(viewFam); }; });
      Array.prototype.forEach.call(view.querySelectorAll("[data-df]"), function (b) { b.onclick = function () { if (confirm(b.getAttribute("data-n") + " samt allen Kindern und Lernständen endgültig löschen?")) api("/api/admin/families/" + b.getAttribute("data-df"), { method: "DELETE" }).then(viewFam); }; });
    }).catch(function (e) { view.innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
  }
  function viewNew(inv, name) {
    var h = '<div class="card"><h2>Neuen Spieler anlegen</h2><div class="row"><input id="nn" class="grow" maxlength="20" placeholder="Name, z. B. Magnus"><button id="mk">Anlegen</button></div>' +
      '<label class="row" style="margin-top:10px;gap:8px;font-size:14px"><input type="checkbox" id="nh"> <span>Nur sichern, nicht anzeigen <span class="muted">(zum Beispiel für dich selbst: der Lernstand wird gesichert, aber es gibt keine Zahlen, Ziele oder Mails dazu)</span></span></label>' +
      '<p class="small muted" style="margin:10px 0 0">Es reicht ein Vorname. Danach erscheint ein Code, den du in der App unter Setup → Auto-Save / Lernfortschritt einfügst.</p></div>';
    if (inv) h = inviteCard(name, inv) + h;
    h += '<div id="hiddenList"></div>';
    view.innerHTML = h;
    var b = document.getElementById("mk");
    if (b) b.onclick = function () {
      var n = document.getElementById("nn").value.trim(); if (!n) return;
      var hid = document.getElementById("nh").checked;
      post("/api/admin/players", { name: n, hidden: hid }).then(function (r) {
        if (hid) { viewNew(r.invite, r.name); loadHidden(); return; }
        return loadPlayers(r.id).then(function () { showInvite(r.name, r.invite); });
      }).catch(function (e) { alert(e.message); });
    };
    var cp = document.getElementById("cp"); if (cp) wireCopy();
    loadHidden();
  }
  function wireCopy() {
    document.getElementById("cp").onclick = function () {
      var t = document.getElementById("ic").textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { document.getElementById("cp").textContent = "Kopiert ✓"; }, function () { prompt("Code kopieren:", t); });
    };
  }
  function loadHidden() {
    api("/api/admin/players?hidden=1").then(function (l) {
      var el = document.getElementById("hiddenList"); if (!el || !l.length) return;
      el.innerHTML = '<div class="card"><h2>Nur gesicherte Spieler</h2><p class="small muted" style="margin:0 0 6px">Sie sind in der Übersicht und in der Wochenmail nicht zu sehen. Der Server hält nur ihren Lernstand als Sicherung bereit.</p>' + l.map(function (p) {
        return '<div class="goal"><div class="t"><b>' + esc(p.name) + '</b><div class="small muted">' + (p.backup ? "Letzte Sicherung " + fmtAgo(p.backup.ts) + " (" + fmtAt(p.backup.ts) + ") · " + p.backup.words + " Wörter · " + p.backup.coins + " Münzen" : "Noch keine Sicherung") + " · " + p.devices.length + " Gerät" + (p.devices.length === 1 ? "" : "e") + '</div></div>' +
          '<div class="acts"><button class="ghost sm" data-hi="' + p.id + '">Neuer Code</button>' + (p.backup ? '<a class="small" href="/api/admin/players/' + p.id + '/state" download>Herunterladen</a>' : "") +
          '<button class="ghost sm" data-hs="' + p.id + '">Anzeigen</button><button class="ghost sm" data-hd="' + p.id + '">Löschen</button></div></div>';
      }).join("") + "</div>";
      Array.prototype.forEach.call(el.querySelectorAll("button[data-hi]"), function (b) { b.onclick = function () { var pl = l.filter(function (x) { return String(x.id) === b.getAttribute("data-hi"); })[0]; post("/api/admin/players/" + pl.id + "/invite").then(function (i) { viewNew(i, pl.name); loadHidden(); }); }; });
      Array.prototype.forEach.call(el.querySelectorAll("button[data-hs]"), function (b) { b.onclick = function () { post("/api/admin/players/" + b.getAttribute("data-hs") + "/hidden", { hidden: false }).then(function () { loadPlayers(+b.getAttribute("data-hs")); }); }; });
      Array.prototype.forEach.call(el.querySelectorAll("button[data-hd]"), function (b) { b.onclick = function () { if (confirm("Diesen Spieler und seine Sicherung endgültig löschen?")) api("/api/admin/players/" + b.getAttribute("data-hd"), { method: "DELETE" }).then(function () { viewNew(); }); }; });
    }).catch(function () {});
  }
  function inviteString(inv) { return location.origin + "#" + inv.code; }
  function inviteCard(name, inv) {
    return '<div class="card"><h2>Verbindungscode für ' + esc(name) + "</h2><div class=\"code\" id=\"ic\">" + esc(inviteString(inv)) + "</div>" +
      '<div class="row" style="margin-top:10px"><button id="cp">Kopieren</button></div>' +
      '<p class="small muted" style="margin:10px 0 0">In der App: Setup → Auto-Save / Lernfortschritt → Code einfügen → Verbinden. Der Code gilt ' + inv.validDays + " Tage und nur für ein Gerät.</p></div>";
  }
  function showInvite(name, inv) {
    view.insertAdjacentHTML("afterbegin", inviteCard(name, inv));
    document.getElementById("cp").onclick = function () {
      var t = document.getElementById("ic").textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { document.getElementById("cp").textContent = "Kopiert ✓"; }, function () { prompt("Code kopieren:", t); });
    };
  }

  function bars(list) {
    var w = 640, h = 130, pad = 18, n = list.length, bw = (w - pad * 2) / n, max = Math.max(600, Math.max.apply(null, list.map(function (d) { return d.sec; })));
    var s = '<svg viewBox="0 0 ' + w + " " + (h + 22) + '" width="100%" role="img" aria-label="Übungszeit pro Tag">';
    [0, 0.5, 1].forEach(function (f) { var y = h - f * (h - 8); s += '<line x1="' + pad + '" x2="' + (w - pad) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/>'; });
    s += '<text x="0" y="' + (h - (h - 8) + 3) + '">' + Math.round(max / 60) + "</text>";
    list.forEach(function (d, i) {
      var bh = Math.max(d.sec ? 2 : 0, d.sec / max * (h - 8)), x = pad + i * bw + bw * 0.15, bwi = bw * 0.7;
      s += '<rect x="' + x + '" y="' + (h - bh) + '" width="' + bwi + '" height="' + bh + '" rx="3" fill="' + (d.sec >= 600 ? "var(--good)" : d.sec ? "var(--acc2)" : "var(--line)") + '"><title>' + d.date + ": " + fmtMin(d.sec) + ", " + d.items + " Aufgaben</title></rect>";
      if (n <= 16 || i % 5 === 0) s += '<text x="' + (x + bwi / 2) + '" y="' + (h + 14) + '" text-anchor="middle">' + d.date.slice(8) + "." + d.date.slice(5, 7) + "</text>";
    });
    return s + "</svg>";
  }
  function stack(lv, total) {
    var cols = ["", "var(--l1)", "var(--l2)", "var(--l3)", "var(--l4)"], s = "";
    for (var i = 4; i >= 1; i--) if (lv[i]) s += '<i style="width:' + (lv[i] * 100 / Math.max(1, total)) + "%;background:" + cols[i] + '"></i>';
    return '<div class="bar">' + s + "</div>";
  }
  var LV = ["Neu", "Angefangen", "Geübt", "Sitzt", "Gemeistert"];

  var WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

    var bl = (pp && pp.bosses) || [], MN = { match: "Match-Rausch", blitz: "Blitzrunde", survival: "Letztes Herz" };
    h += '<h3 style="margin:14px 0 6px;font-size:15px">Boss-Runden</h3><div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><label class="small" for="bossDiff">Schwierigkeit</label>' +
      '<select id="bossDiff"><option value="leicht">leicht (Ziel × 0,7)</option><option value="normal">normal</option><option value="schwer">schwer (Ziel × 1,3)</option></select><span id="bossMsg" class="small"></span></div>' +
      '<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px"><label class="small" for="coinF">Münzfaktor</label><select id="coinF"><option value="0.5">0,5 (langsamer)</option><option value="1">1 (normal)</option><option value="1.5">1,5</option><option value="2">2 (doppelt)</option></select><span id="coinMsg" class="small"></span></div>' +
      '<p class="small muted" style="margin:4px 0 0">Verdienst von Magnus im Shop (Missionen, Tagesziel, Truhen, Fortschritt). In der ersten Woche gibt es zusätzlich ×1,5.</p>' +
      '<p class="small muted" style="margin:6px 0 0">Nach zwei verfehlten Versuchen wird das Ziel automatisch um 1 gesenkt, nach vier um 2 (mindestens 3). Das sieht Magnus offen in der App.</p>';
    if (bl.length) {
      var by = {};
      bl.forEach(function (b) { var x = by[b.m] || (by[b.m] = { n: 0, ok: 0, first: 0, firstOk: 0, gap: [] }); x.n++; x.ok += b.ok; if (b.a === 1) { x.first++; x.firstOk += b.ok; } x.gap.push(b.c - (b.base || b.need)); });
      var med = function (a) { a = a.slice().sort(function (x, y) { return x - y; }); return a[Math.floor(a.length / 2)]; };
      h += '<table class="small" style="width:100%;margin-top:8px"><tr><th align="left">Modus</th><th>Versuche</th><th>geschafft</th><th>1. Versuch</th><th>Ergebnis zum Ziel</th></tr>' +
        Object.keys(by).map(function (m) { var x = by[m], g = med(x.gap); return "<tr><td>" + (MN[m] || m) + "</td><td align='center'>" + x.n + "</td><td align='center'>" + Math.round(x.ok * 100 / x.n) + " %</td><td align='center'>" + (x.first ? Math.round(x.firstOk * 100 / x.first) + " %" : "–") + "</td><td align='center'>" + (g > 0 ? "+" : "") + g + "</td></tr>"; }).join("") + '</table>' +
        '<p class="small muted" style="margin:4px 0 0">Richtwert: beim 1. Versuch etwa 50–70 % geschafft, im 2. Versuch rund 80 %. Wird fast alles sofort geschafft, die Schwierigkeit erhöhen; scheitert er oft knapp, senken.</p>' +
        '<details style="margin-top:6px"><summary class="small" style="cursor:pointer">Letzte Boss-Runden</summary>' + bl.slice().reverse().slice(0, 15).map(function (b) {
          var d = new Date(b.t); return '<div class="small">' + (b.ok ? "✅" : "❌") + " " + esc(b.s) + " · " + (MN[b.m] || b.m) + " · " + b.c + "/" + b.need + (b.base && b.base !== b.need ? " (Ziel erleichtert von " + b.base + ")" : "") + " · Versuch " + b.a + " · " + d.getDate() + "." + (d.getMonth() + 1) + ". " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + "</div>"; }).join("") + '</details>';
    } else h += '<p class="small muted" style="margin:8px 0 0">Noch keine Boss-Runde gespielt. Die Ergebnisse erscheinen hier, sobald die App sie gesendet hat.</p>';
    h += '<p class="small muted" style="margin:14px 0 0" id="pathSel">Lade Auswahl …</p>' +
      '<details style="margin-top:10px" id="pathDet"><summary style="cursor:pointer;color:var(--acc);font-weight:600">Einheiten für den Lernpfad wählen</summary><div id="pathPickBox" style="margin-top:10px"></div></details>';
    el.innerHTML = h;
    api("/api/admin/players/" + p.id + "/coinfactor").then(function (x) {
      var sl = document.getElementById("coinF"); if (!sl) return; sl.value = String(x.factor || 1);
      sl.onchange = function () { post("/api/admin/players/" + p.id + "/coinfactor", { factor: +sl.value }).then(function () { var m = document.getElementById("coinMsg"); if (m) { m.className = "small"; m.textContent = "Gespeichert. Die App übernimmt es beim nächsten Öffnen."; } }).catch(function (e) { var m = document.getElementById("coinMsg"); if (m) { m.className = "small err"; m.textContent = e.message; } }); };
    }).catch(function () {});
    api("/api/admin/players/" + p.id + "/bossdiff").then(function (x) {
      var sl = document.getElementById("bossDiff"); if (!sl) return; sl.value = x.diff || "normal";
      sl.onchange = function () { post("/api/admin/players/" + p.id + "/bossdiff", { diff: sl.value }).then(function () { var m = document.getElementById("bossMsg"); if (m) { m.className = "small"; m.textContent = "Gespeichert. Die App übernimmt es beim nächsten Öffnen."; } }).catch(function (e) { var m = document.getElementById("bossMsg"); if (m) { m.className = "small err"; m.textContent = e.message; } }); };
    }).catch(function () {});
    Promise.all([api("/api/admin/players/" + p.id + "/pathunits"), catCache[p.id] ? Promise.resolve(catCache[p.id]) : getCatalog(p.id)]).then(function (res) {
      var cur = res[0] || [], cat = res[1] || [], sel = document.getElementById("pathSel"); if (!sel) return;
      var names = cat.filter(function (u) { return cur.indexOf(u.id) >= 0; }).map(function (u) { return u.title.replace(/^Headlight 2 · /, ""); });
      sel.textContent = cur.length ? "Im Pfad: " + names.length + " " + (names.length === 1 ? "Einheit" : "Einheiten") + " (von Eltern gewählt)." : "Standard: Schule = Headlight 2, Business = die in der App gewählten Stufen.";
      var box = document.getElementById("pathPickBox");
      box.innerHTML = cat.length ? '<p class="small muted" style="margin:0 0 6px">Die Reihenfolge ist fest (Headlight 2, Klassen, dann Business Basis bis Redewendungen). Bereits geschaffte Stationen bleiben geschafft.</p>' + unitPicker(cat, "pathpick") +
        '<div class="row" style="gap:8px;margin-top:10px"><button id="pathSave">Auswahl speichern</button><button class="ghost" id="pathReset">Standard</button><span id="pathMsg" class="small"></span></div>'
        : '<p class="small muted">Noch keine Einheiten bekannt. Sie erscheinen, sobald die App einmal gesendet hat.</p>';
      cur.forEach(function (id) { var c = box.querySelector('#pathpick input[value="' + id + '"]'); if (c) c.checked = true; });
      var msg = function (t, bad) { var m = document.getElementById("pathMsg"); if (m) { m.className = "small" + (bad ? " err" : ""); m.textContent = t; } };
      var s = document.getElementById("pathSave"), rs = document.getElementById("pathReset");
      if (s) s.onclick = function () { post("/api/admin/players/" + p.id + "/pathunits", { units: picked("pathpick") }).then(function (x) { msg("Gespeichert. Die App übernimmt es beim nächsten Öffnen."); sel.textContent = x.units.length ? "Im Pfad: " + x.units.length + (x.units.length === 1 ? " Einheit" : " Einheiten") + " (von Eltern gewählt)." : "Standard"; }).catch(function (e) { msg(e.message, 1); }); };
      if (rs) rs.onclick = function () { post("/api/admin/players/" + p.id + "/pathunits", { units: [] }).then(function () { Array.prototype.forEach.call(box.querySelectorAll("#pathpick input"), function (c) { c.checked = false; }); msg("Zurück auf Standard."); sel.textContent = "Standard: Schule = Headlight 2, Business = die in der App gewählten Stufen."; }).catch(function (e) { msg(e.message, 1); }); };
    }).catch(function () { var sel = document.getElementById("pathSel"); if (sel) sel.textContent = ""; });
  }
  function drawGoals(p, r) {
    var el = document.getElementById("goalsCard"); if (!el) return;
    var list = r.goals || [], h = '<h2>Wochenziele</h2>';
    h += list.length ? list.map(function (g) {
      var pc = Math.min(100, Math.round(g.cur * 100 / g.target)), wk = g.week.split("-").reverse().slice(0, 2).join(".");
      return '<div class="goal"><div class="t"><b>' + (g.done ? "✅ " : "") + esc(g.title) + '</b><div class="small muted">Woche ab ' + wk + (g.current ? " (diese Woche)" : "") + " · " + g.cur + " von " + g.target + (g.kind === "unit" ? " %" : "") + (g.coins ? " · 🪙 " + g.coins + " Bonus" : "") + '</div><div class="mini"><i class="' + (g.done ? "d" : "") + '" style="width:' + pc + '%"></i></div></div><button class="ghost sm" data-gdel="' + g.id + '">Löschen</button></div>';
    }).join("") : '<p class="muted small" style="margin:0">Noch keine Ziele. Magnus sieht Ziele in der App auf der Startseite und bekommt die Bonusmünzen automatisch, wenn er sie schafft.</p>';
    h += '<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--acc);font-weight:600">＋ Ziel hinzufügen</summary><div class="form">' +
      '<div><label>Art</label><select id="gk"><option value="minutes">Minuten üben</option><option value="days">Tage üben (mind. 5 Min.)</option><option value="newwords">Wörter wiedererkennen (richtig am Folgetag)</option><option value="unit">Einheit sicher lernen (%)</option></select></div>' +
      '<div><label id="gtl">Ziel (Minuten pro Woche)</label><input id="gt" type="number" min="1" value="60"></div>' +
      '<div><label>Bonusmünzen</label><input id="gc" type="number" min="0" max="500" value="30"></div>' +
      '<div><label>Woche</label><select id="gw"><option value="this">Diese Woche</option><option value="next">Nächste Woche</option></select></div></div>' +
      '<div id="gu" hidden style="margin-top:8px"><label class="small muted">Einheiten (alle zusammen zählen)</label><div id="gup"></div></div>' +
      '<div style="margin-top:12px"><button id="gadd">Ziel anlegen</button> <span id="gmsg" class="small err"></span></div></details>';
    el.innerHTML = h;
    var defs = { minutes: ["Ziel (Minuten pro Woche)", 60], days: ["Ziel (Tage, 1 bis 7)", 4], newwords: ["Ziel (wiedererkannte Wörter)", 30], unit: ["Ziel (% sicher, 1 bis 100)", 80] };
    var k = document.getElementById("gk");
    k.onchange = function () {
      document.getElementById("gtl").textContent = defs[k.value][0]; document.getElementById("gt").value = defs[k.value][1];
      document.getElementById("gu").hidden = k.value !== "unit";
      if (k.value === "unit" && !document.getElementById("gup").innerHTML) (catCache[p.id] ? Promise.resolve(catCache[p.id]) : getCatalog(p.id)).then(function (c) { document.getElementById("gup").innerHTML = c.length ? unitPicker(c, "gpick") : '<p class="small muted">Noch keine Einheiten bekannt. Sie erscheinen, sobald die App einmal gesendet hat.</p>'; });
    };
    document.getElementById("gadd").onclick = function () {
      post("/api/admin/players/" + p.id + "/goals", { kind: k.value, target: +document.getElementById("gt").value, coins: +document.getElementById("gc").value, week: document.getElementById("gw").value, scope: picked("gpick") })
        .then(function () { show(); }).catch(function (e) { document.getElementById("gmsg").textContent = e.message; });
    };
    Array.prototype.forEach.call(el.querySelectorAll("button[data-gdel]"), function (b) { b.onclick = function () { if (confirm("Ziel löschen?")) api("/api/admin/goals/" + b.getAttribute("data-gdel"), { method: "DELETE" }).then(show); }; });
  }

  function drawPlans(p, r) {
    var el = document.getElementById("plansCard"); if (!el) return;
    var list = r.plans || [], h = "<h2>Lernplan für Klassenarbeiten</h2>";
    h += list.length ? list.map(function (x) {
      return '<div class="goal"><div class="t"><b>📅 ' + esc(x.title) + '</b><div class="small muted">Arbeit am ' + x.exam.split("-").reverse().join(".") + " · " + (x.daysLeft > 0 ? "noch " + x.daysLeft + " Tage" : x.daysLeft === 0 ? "heute" : "vorbei") + " · " + x.pct + " % sicher (" + x.ok + " von " + x.total + ")" + (x.coins ? " · 🪙 " + x.coins + " Bonus bei 90 %" : "") + '</div><div class="small muted">' + esc(x.unitTitles.join(", ")) + '</div><div class="mini"><i class="' + (x.pct >= 90 ? "d" : "") + '" style="width:' + Math.min(100, x.pct) + '%"></i></div></div><button class="ghost sm" data-pdel="' + x.id + '">Löschen</button></div>';
    }).join("") : '<p class="muted small" style="margin:0">Noch kein Lernplan. Mit Datum und Einheiten verteilt die App die Wörter auf die Tage bis zur Arbeit und zeigt Magnus, was heute dran ist.</p>';
    h += '<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--acc);font-weight:600">＋ Lernplan anlegen</summary><div class="form">' +
      '<div><label>Bezeichnung</label><input id="pt" maxlength="60" placeholder="z. B. Englischarbeit Unit 4"></div>' +
      '<div><label>Datum der Arbeit</label><input id="pd" type="date"></div>' +
      '<div><label>Bonusmünzen bei 90 % sicher</label><input id="pc" type="number" min="0" max="500" value="50"></div></div>' +
      '<div style="margin-top:8px"><label class="small muted">Einheiten für die Arbeit</label><div id="ppp"><p class="small muted">Lade …</p></div></div>' +
      '<div style="margin-top:12px"><button id="padd">Lernplan anlegen</button> <span id="pmsg" class="small err"></span></div></details>';
    el.innerHTML = h;
    var det = el.querySelector("details");
    det.addEventListener("toggle", function () {
      if (det.open && !document.getElementById("ppick")) (catCache[p.id] ? Promise.resolve(catCache[p.id]) : getCatalog(p.id)).then(function (c) { document.getElementById("ppp").innerHTML = c.length ? unitPicker(c, "ppick") : '<p class="small muted">Noch keine Einheiten bekannt. Sie erscheinen, sobald die App einmal gesendet hat.</p>'; });
    });
    document.getElementById("padd").onclick = function () {
      post("/api/admin/players/" + p.id + "/plans", { title: document.getElementById("pt").value, exam: document.getElementById("pd").value, coins: +document.getElementById("pc").value, units: picked("ppick") })
        .then(function () { show(); }).catch(function (e) { document.getElementById("pmsg").textContent = e.message; });
    };
    Array.prototype.forEach.call(el.querySelectorAll("button[data-pdel]"), function (b) { b.onclick = function () { if (confirm("Lernplan löschen?")) api("/api/admin/plans/" + b.getAttribute("data-pdel"), { method: "DELETE" }).then(show); }; });
  }

  function drawBackups(p, r) {
    var el = document.getElementById("backupCard"); if (!el) return;
    var b = r.backups || [];
    el.innerHTML = "<h2>Lernstand-Sicherung</h2>" + (b.length
      ? '<p style="margin:0 0 8px">Die App sichert den kompletten Lernstand (Wörter, Münzen, Shop, Einstellungen) nach jeder Runde. Die letzten ' + b.length + " Tage bleiben erhalten. Zurückspielen geht in der App unter Setup → Auto-Save / Lernfortschritt → „Lernstand wiederherstellen“. Zusätzlich kannst du jeden Stand als Datei herunterladen.</p>" +
        '<table><tr><th>Tag</th><th>Zuletzt</th><th class="n">Wörter</th><th class="n">Münzen</th><th></th></tr>' + b.slice(0, 10).map(function (x) {
          return "<tr><td>" + x.day.split("-").reverse().join(".") + "</td><td>" + fmtDate(x.ts) + '</td><td class="n">' + x.words + '</td><td class="n">' + x.coins + '</td><td><a href="/api/admin/players/' + p.id + "/state?day=" + x.day + '" download>Herunterladen</a></td></tr>';
        }).join("") + "</table>"
      : '<p class="muted small" style="margin:0">Noch keine Sicherung. Sie entsteht nach der nächsten Lernrunde mit der neuen App-Version.</p>');
  }
  function drawMail() {
    var el = document.getElementById("mailCard"); if (!el) return;
    api("/api/admin/mail").then(function (m) {
      var days = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
      el.innerHTML = "<h2>Wochenzusammenfassung per Mail</h2>" + (m.configured
        ? '<p style="margin:0 0 10px">Geht jeden <b>' + days[m.day] + " um " + m.hour + " Uhr</b> an <b>" + esc(m.to) + "</b>." + (m.lastWeek ? ' <span class="muted small">Zuletzt für die Woche ab ' + m.lastWeek.split("-").reverse().join(".") + " gesendet.</span>" : "") + '</p><button class="ghost" id="mtest">Testmail jetzt senden</button> <span id="mmsg" class="small"></span>'
        : '<p class="muted small" style="margin:0">Noch nicht eingerichtet. Auf dem Server in der Datei .env die Mail-Zugangsdaten eintragen (siehe README, Abschnitt „Wochenmail“).</p>');
      var b = document.getElementById("mtest");
      if (b) b.onclick = function () { b.disabled = true; document.getElementById("mmsg").textContent = "Sende …"; post("/api/admin/mail/test").then(function (r) { b.disabled = false; var s = document.getElementById("mmsg"); s.className = "small " + (r.ok ? "" : "err"); s.textContent = r.ok ? "Gesendet. Bitte Postfach prüfen." : "Fehler: " + r.error; }); };
    }).catch(function () {});
  }

  var wfil = "alle", wsort = "no", wq = "";
  function showWords(p) {
    var box = document.getElementById("wbox"); if (!box || box.innerHTML) return;
    box.innerHTML = '<p class="muted small">Lade …</p>';
    api("/api/admin/players/" + p.id + "/words").then(function (r) {
      var all = r.words, wk = Date.now() - 7 * 86400000;
      var F = [["alle", "Alle"], ["schwer", "Schwierig"], ["woche", "Diese Woche gemeistert"], ["sitzt", "Gemeistert"], ["offen", "Noch nicht geübt"]];
      function rate(x) { return x.ok + x.no ? x.no / (x.ok + x.no) : 0; }
      function rows() {
        var q = wq.trim().toLowerCase();
        var l = all.filter(function (x) {
          if (q && (x.en + " " + x.de + " " + x.ut).toLowerCase().indexOf(q) < 0) return false;
          if (wfil === "schwer") return x.no > 0 && x.lv < 3;
          if (wfil === "woche") return x.lv === 4 && x.m > wk;
          if (wfil === "sitzt") return x.lv === 4;
          if (wfil === "offen") return x.lv === 0 && !x.ok && !x.no;
          return true;
        });
        l.sort(function (a, b) { return wsort === "rate" ? (rate(b) - rate(a)) || (b.no - a.no) : wsort === "last" ? b.last - a.last : wsort === "en" ? (a.en || "~").localeCompare(b.en || "~") : (b.no - a.no) || (rate(b) - rate(a)); });
        return l;
      }
      function draw() {
        var l = rows();
        document.getElementById("wlist").innerHTML = '<p class="small muted">' + l.length + " von " + all.length + ' Wörtern' + (r.hasTexts ? "" : " · Wörter-Texte kommen mit der nächsten Übertragung der App") + '</p>' +
          '<table><tr><th>Wort</th><th>Bedeutung</th><th>Einheit</th><th>Stand</th><th class="n">✓</th><th class="n">✗</th><th class="n">Fehler</th><th>Zuletzt</th></tr>' +
          l.slice(0, 200).map(function (x) {
            return "<tr><td><b>" + esc(x.en || "#" + (x.i + 1)) + "</b></td><td>" + esc(x.de) + '</td><td class="small muted">' + esc(x.ut) + '</td><td><span class="pill l' + x.lv + '">' + LV[x.lv] + '</span></td><td class="n">' + x.ok + '</td><td class="n">' + (x.no ? '<b class="err">' + x.no + "</b>" : 0) + '</td><td class="n">' + (x.ok + x.no ? Math.round(rate(x) * 100) + " %" : "–") + "</td><td>" + (x.last ? fmtAgo(x.last) : "–") + "</td></tr>";
          }).join("") + "</table>" + (l.length > 200 ? '<p class="small muted">Es werden die ersten 200 gezeigt. Mit Suche oder Filter eingrenzen.</p>' : "");
      }
      box.innerHTML = '<div class="form" style="margin-top:10px"><input id="wq" type="search" placeholder="Wort oder Einheit suchen"><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">' +
        F.map(function (f) { return '<button class="ghost sm" data-wf="' + f[0] + '" aria-pressed="' + (wfil === f[0]) + '">' + f[1] + "</button>"; }).join("") +
        '<select id="ws" style="width:auto"><option value="no">Sortiert: meiste Fehler</option><option value="rate">Sortiert: Fehlerquote</option><option value="last">Sortiert: zuletzt geübt</option><option value="en">Sortiert: A–Z</option></select></div></div><div id="wlist" style="margin-top:8px"></div>';
      var qi = document.getElementById("wq"); qi.value = wq; qi.oninput = function () { wq = qi.value; draw(); };
      var ws = document.getElementById("ws"); ws.value = wsort; ws.onchange = function () { wsort = ws.value; draw(); };
      Array.prototype.forEach.call(box.querySelectorAll("[data-wf]"), function (b) { b.onclick = function () { wfil = b.getAttribute("data-wf"); Array.prototype.forEach.call(box.querySelectorAll("[data-wf]"), function (o) { o.setAttribute("aria-pressed", o === b); }); draw(); }; });
      draw();
    }).catch(function (e) { box.innerHTML = '<p class="err small">' + esc(e.message) + "</p>"; });
  }

  function showUnit(p, uid) {
    var el = document.getElementById("unitdetail"); if (!el) return;
    el.innerHTML = '<p class="muted small">Lade …</p>';
    api("/api/admin/players/" + p.id + "/unit/" + encodeURIComponent(uid)).then(function (u) {
      var h = '<div style="margin-top:14px"><div class="row"><b class="grow">' + esc(u.title) + '</b><button class="ghost sm" id="udx">Schließen</button></div>';
      if (!u.hasTexts) h += '<p class="small muted">Die Wörter selbst kommen mit der nächsten Übertragung der App (App öffnen, eine Runde lernen).</p>';
      h += '<table><tr><th>Wort</th><th>Bedeutung</th><th>Stand</th><th class="n">✓</th><th class="n">✗</th><th>Zuletzt</th></tr>' + u.words.map(function (w) {
        return "<tr><td><b>" + esc(w.en || "#" + (w.i + 1)) + "</b></td><td>" + esc(w.de) + '</td><td><span class="pill l' + w.lv + '">' + LV[w.lv] + '</span></td><td class="n">' + w.ok + '</td><td class="n">' + (w.no ? '<b class="err">' + w.no + "</b>" : 0) + "</td><td>" + (w.last ? fmtAgo(w.last) : "–") + "</td></tr>";
      }).join("") + "</table></div>";
      el.innerHTML = h; el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      document.getElementById("udx").onclick = function () { el.innerHTML = ""; };
    }).catch(function (e) { el.innerHTML = '<p class="err small">' + esc(e.message) + "</p>"; });
  }

  function kpi(v, l) { return '<div class="kpi"><b>' + v + "</b><span>" + l + "</span></div>"; }

  loadPlayers();
  setInterval(function () { if (cur !== "new" && !document.hidden && !document.getElementById("nn") && !document.getElementById("ic") && !document.querySelector("details[open]:not(.ugrp)") && !document.getElementById("unitdetail").innerHTML) show(); }, 120000);
})();
</script>
</body>
</html>
