<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wordy · Eltern</title>
<style>
:root{--bg:#F6F1E6;--card:#fff;--ink:#10151F;--ink2:#3B4656;--line:#E9E1CD;--acc:#1E6273;--acc2:#2E8BA0;--good:#2C7A57;--bad:#B8403B;--warn:#A9781F;--on-acc:#fff;--btn-sh:#134552;--l1:#E2B93B;--l2:#E69A3A;--l3:#4FA6B8;--l4:#2E8B57}
@media (prefers-color-scheme:dark){:root{--bg:#0E1320;--card:#171F30;--ink:#F6EFE0;--ink2:#B9C0CE;--line:#243049;--acc:#E9BD62;--acc2:#F4C45E;--good:#63C79A;--bad:#E7817B;--warn:#E9BD62;--on-acc:#2a1c00;--btn-sh:#9b6f1c;--l1:#C9A233;--l2:#D18A33;--l3:#4698AA;--l4:#4DB380}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 10px 34px rgba(16,21,31,.12)}
h1{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.015em;font-family:ui-rounded,"SF Pro Rounded","Nunito","DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}p{margin:0 0 14px;color:var(--ink2)}
label{display:block;font-size:14px;margin:12px 0 4px;font-weight:600}
input[type=email]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin-top:14px}.chk input{margin-top:4px}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:14px;background:var(--acc);color:var(--on-acc);font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--btn-sh)}
button:disabled{opacity:.6}.msg{margin-top:14px;font-size:14px}.err{color:var(--bad)}.ok{color:var(--good)}
a{color:var(--acc)}.small{font-size:13px}
@media (prefers-color-scheme:dark){.card{border-color:rgba(233,189,98,.16)}}
</style>
</head>
<body>
<div class="card" id="c"></div>
<script>
(function () {
  var c = document.getElementById("c"), q = new URLSearchParams(location.search), path = location.pathname;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (x) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]; }); }
  function post(u, b) { return fetch(u, { method: "POST", headers: { "Content-Type": "application/json", "X-Wordy": "1" }, body: JSON.stringify(b || {}) }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || "Fehler " + r.status); return j; }); }); }
  function done(msg) { document.getElementById("m").className = "msg ok"; document.getElementById("m").textContent = msg; }
  function fail(e) { var m = document.getElementById("m"); m.className = "msg err"; m.textContent = e.message; var b = c.querySelector("button"); if (b) b.disabled = false; }
  if (path === "/f/login" && q.get("t")) {
    c.innerHTML = '<h1>📚 Wordy · Eltern</h1><p>Schön, dass du da bist. Tippe auf den Knopf, um dich anzumelden.</p><button id="go">Jetzt anmelden</button><div id="m" class="msg"></div>';
    document.getElementById("go").onclick = function () { this.disabled = true; post("/api/family/session", { t: q.get("t") }).then(function () { location.replace("/f/"); }).catch(function (e) { fail(e); c.insertAdjacentHTML("beforeend", '<p class="small" style="margin-top:12px"><a href="/f/">Neuen Link anfordern</a></p>'); }); };
    return;
  }
  var join = path === "/f/join", code = q.get("i") || "";
  if (join && !code) { c.innerHTML = '<h1>Einladung</h1><p>Dieser Link ist unvollständig. Bitte öffne den Link aus deiner Einladung noch einmal.</p>'; return; }
  var teach = join && q.get("l") === "1";
  c.innerHTML = '<h1>📚 Wordy · ' + (teach ? "Lehrkräfte" : "Eltern") + '</h1><p>' + (teach ? "Du wurdest als Lehrkraft eingeladen! Mit deiner E-Mail-Adresse legst du dein Konto an, erstellst eine Klasse und stellst die Wochenaufgabe ein. Die Teilnahme ist für Kinder freiwillig und braucht die Zustimmung der Eltern." : join ? "Du wurdest eingeladen! Mit deiner E-Mail-Adresse legst du dein Elternkonto an und verwaltest danach die Kinder selbst." : "Melde dich mit deiner E-Mail-Adresse an. Wir schicken dir einen Anmeldelink, ein Passwort brauchst du nicht.") + '</p>' +
    '<label for="e">E-Mail-Adresse</label><input id="e" type="email" autocomplete="email" inputmode="email" placeholder="name@beispiel.de">' +
    (join ? '<label class="chk"><input type="checkbox" id="k"><span>' + (teach ? "Ich bin Lehrkraft und stimme der" : "Ich bin erziehungsberechtigt und stimme der") + ' <a href="/f/datenschutz" target="_blank">Datenschutzerklärung</a> zu. ' + (teach ? "Gespeichert werden diese E-Mail-Adresse, meine Klassen und Aufgaben." : "Gespeichert werden nur Lerndaten meiner Kinder (Wörter, Zeiten, Käufe) und diese E-Mail-Adresse.") + '</span></label>' : '') +
    '<button id="go">' + (join ? "Konto anlegen" : "Anmeldelink senden") + '</button><div id="m" class="msg"></div>' + (join ? "" : '<p class="small" style="margin-top:14px">Noch kein Konto? Du brauchst einen Einladungslink.</p>');
  document.getElementById("go").onclick = function () {
    var e = document.getElementById("e").value.trim(); if (!e) return;
    if (join && !document.getElementById("k").checked) { fail(new Error("Bitte stimme der Datenschutzerklärung zu.")); return; }
    this.disabled = true;
    (join ? post("/api/family/join", { email: e, invite: code, consent: true }) : post("/api/family/login", { email: e }))
      .then(function () { done("Fast geschafft: Wenn die Adresse stimmt, ist die Mail unterwegs. Der Link gilt " + 20 + " Minuten. Schau auch im Spam-Ordner nach."); }).catch(fail);
  };
})();
</script>
</body>
</html>
